    try { name = localStorage.getItem('jiangwan_gb_name') || ''; } catch (e) {}
    try {
      var look = JSON.parse(localStorage.getItem('jiangwan_gb_look') || 'null');
      if (look) {
        if (look.mode) mode = look.mode;
        if (look.emoji) emoji = look.emoji;
        if (look.color) color = look.color;
        if (look.image) image = look.image;
        if (look.imagePath) imagePath = look.imagePath;
      }
    } catch (e) {}
  }
  function saveLocal() {
    try { localStorage.setItem('jiangwan_gb_name', name); } catch (e) {}
    try {
      localStorage.setItem('jiangwan_gb_look', JSON.stringify({
        mode: mode, emoji: emoji, color: color, image: image, imagePath: imagePath
      }));
    } catch (e) {}
  }

  /* 头像预览 */
  function avatarNode(size) {
    var el = document.createElement('div');
    el.className = 'avatar-circle ' + (size === 'small' ? 'small' : 'big');
    var url = avatarUrl(imagePath);
    if (mode === 'image' && url) {
      var im = document.createElement('img'); im.src = url; im.alt = '';
      im.onerror = function () { el.textContent = emoji; el.style.background = color; };
      el.appendChild(im);
    } else {
      el.style.background = color;
      el.textContent = emoji;
    }
    return el;
  }
  function renderPreview() {
    var pv = $('avatar-preview');
    if (!pv) return;
    pv.textContent = '';
    pv.appendChild(avatarNode('big'));
    var top = $('top-avatar');
    if (top) { top.textContent = ''; top.appendChild(avatarNode('small')); }
    var nm = $('top-name'); if (nm) nm.textContent = name || '还没设名字';
  }

  function renderPickers() {
    var er = $('emoji-row');
    if (er) {
      er.textContent = '';
      EMOJIS.forEach(function (em) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'emoji-pick' + (em === emoji ? ' on' : '');
        b.textContent = em;
        b.onclick = function () { emoji = em; mode = 'emoji'; renderAll(); };
        er.appendChild(b);
      });
    }
    var cr = $('color-row');
    if (cr) {
      cr.textContent = '';
      COLORS.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'color-pick' + (c === color ? ' on' : '');
        b.style.background = c;
        b.onclick = function () { color = c; renderAll(); };
        cr.appendChild(b);
      });
    }
  }
  function renderMode() {
    var pe = $('panel-emoji'), pi = $('panel-image');
    if (pe) pe.hidden = mode !== 'emoji';
    if (pi) pi.hidden = mode !== 'image';
    var be = $('mode-emoji'), bi = $('mode-image');
    if (be) be.className = 'gb-sec-chip' + (mode === 'emoji' ? ' on' : '');
    if (bi) bi.className = 'gb-sec-chip' + (mode === 'image' ? ' on' : '');
    var clr = $('btn-avatar-clear');
    if (clr) clr.hidden = !(mode === 'image' && imagePath);
  }
  function renderAll() {
    renderPickers(); renderMode(); renderPreview(); saveLocal();
  }

  /* 上传头像 */
  function uploadAvatar(file) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, 256, 256);
        var side = Math.min(im.width, im.height);
        cx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, 256, 256);
        cv.toBlob(function (b) {
          if (!b) return rej(new Error('图片编码失败'));
          var path = uid + '/avatar-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          sb.storage.from('avatars').upload(path, b, { contentType: 'image/jpeg', upsert: false })
            .then(function (r) { if (r.error) throw r.error; res(path); }).catch(rej);
        }, 'image/jpeg', 0.85);
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 统计：我在各处的足迹 */
  function loadStats() {
    if (!sb) return Promise.resolve();
    return sb.from('messages').select('id', { count: 'exact', head: true }).eq('device_id', deviceId)
      .then(function (r) { $('stat-msg').textContent = (r && r.count != null) ? r.count : '—'; })
      .catch(function () {})
      .then(function () {
        return sb.from('works').select('id', { count: 'exact', head: true }).eq('device_id', deviceId);
      })
      .then(function (r) { $('stat-work').textContent = (r && r.count != null) ? r.count : '—'; })
      .catch(function () {})
      .then(function () {
        return sb.from('articles').select('id', { count: 'exact', head: true }).eq('device_id', deviceId);
      })
      .then(function (r) { $('stat-art').textContent = (r && r.count != null) ? r.count : '—'; })
      .catch(function () { $('stat-art').textContent = '—'; });
  }

  /* 我发过的帖子 */
  function loadMyPosts() {
    if (!sb) return;
    var box = $('my-posts');
    if (!box) return;
    box.textContent = '';
    var load = document.createElement('div');
    load.className = 'empty';
    load.textContent = '加载中……';
    box.appendChild(load);

    var PAGE = {'未分区':'guestbook.html','学习':'gb-study.html','新闻':'gb-news.html','作品':'gb-works.html',
                '失物招领':'gb-lost.html','游戏':'gb-game.html','二次元':'gb-acg.html','内娱':'gb-ent.html',
                '学校吐槽':'gb-rant.html','意见建议':'gb-suggest.html','其他':'gb-other.html'};

    sb.from('messages')
      .select('id,created_at,name,content,main_section,sub_section_id,like_count')
      .eq('device_id', deviceId)
      .order('created_at', { ascending: false })
      .limit(30)
      .then(function (r) {
        box.textContent = '';
        var rows = (r && r.data) || [];
        if (!rows.length) {
          var e = document.createElement('div');
          e.className = 'empty';
          e.textContent = '你还没有发过帖子。';
          box.appendChild(e);
          return;
        }
        rows.forEach(function (m) {
          var a = document.createElement('a');
          a.className = 'my-post';
          a.href = './' + (PAGE[m.main_section] || 'guestbook.html') + '?post=' + encodeURIComponent(m.id);
          var t = document.createElement('div');
          t.className = 'my-post-text';
          t.textContent = m.content.slice(0, 60) + (m.content.length > 60 ? '…' : '');
          var meta = document.createElement('div');
          meta.className = 'my-post-meta';
          meta.textContent = (m.main_section || '未分区') + ' · ' + fmt(m.created_at) + ' · 👍' + (m.like_count || 0);
          a.appendChild(t); a.appendChild(meta);
          box.appendChild(a);
        });
      }).catch(function (e) {
        box.textContent = '';
        var d = document.createElement('div');
        d.className = 'empty';
        d.textContent = '读取失败：' + ((e && e.message) || e);
        box.appendChild(d);
      });
  }

  /* ================= 账户系统 ================= */
  var ACC_KEY = 'jw_account', PW_KEY = 'jw_account_pw';
  var account = null, accountPw = '';

  function readAccount() {
    try { account = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); } catch (e) { account = null; }
    try { accountPw = localStorage.getItem(PW_KEY) || ''; } catch (e) { accountPw = ''; }
  }
  function isLogged() { return !!(account && account.username); }

  function renderAccountCard() {
    var av = $('u-acct-avatar'), nm = $('u-acct-name'), sub = $('u-acct-sub'), go = $('u-acct-go');
    if (!av) return;
    av.textContent = '';
    if (isLogged()) {
      var el = document.createElement('div');
      el.className = 'avatar-circle big';
      el.style.cssText = 'width:52px;height:52px;font-size:1.5rem';
      if (account.avatarMode === 'image' && account.avatarPath) {
        var im = document.createElement('img');
        im.src = (window.JW && JW.storagePublic || '') + account.avatarPath;
        im.alt = '';
        im.onerror = function () { el.textContent = account.avatarEmoji || '🙂'; el.style.background = account.avatarColor || '#c0392b'; };
        el.appendChild(im);
      } else {
        el.textContent = account.avatarEmoji || '🙂';
        el.style.background = account.avatarColor || '#c0392b';
      }
      av.appendChild(el);
      nm.textContent = account.username;
      sub.textContent = account.nickname ? ('显示名：' + account.nickname) : '还没设显示名';
      go.textContent = '退出';
      go.href = '#';
      go.onclick = function (e) {
        e.preventDefault();
        if (!confirm('退出登录？（本机记住的资料会清掉）')) return;
        try {
          localStorage.removeItem(ACC_KEY); localStorage.removeItem(PW_KEY);
          localStorage.removeItem('jiangwan_gb_name'); localStorage.removeItem('jiangwan_gb_look');
        } catch (er) {}
        location.reload();
      };
    } else {
      av.innerHTML = '<div class="avatar-circle big" style="width:52px;height:52px;font-size:1.5rem;background:#ddd">?</div>';
      nm.textContent = '未登录';
      sub.textContent = '登录后才能改密码、看消息';
      go.textContent = '登录 / 注册';
      go.href = './auth.html?next=' + encodeURIComponent('./user.html');
      go.onclick = null;
    }
  }

  /* 改密码 */
  function bindPassword() {
    var btn = $('u-pw-save');
    if (!btn) return;
    btn.onclick = function () {
      if (!isLogged()) { status('先登录。', 'err'); return; }
      var oldPw = $('u-pw-old').value, newPw = $('u-pw-new').value.trim();
      if (!oldPw) { status('请填当前密码。', 'err'); return; }
      if (newPw.length < 6) { status('新密码至少 6 位。', 'err'); return; }
      btn.disabled = true; btn.textContent = '提交中…';
      JW.sb.rpc('change_password', {
        p_username: account.username, p_old: oldPw, p_new: newPw
      }).then(function (r) {
        if (r.error) throw r.error;
        try { localStorage.setItem(PW_KEY, newPw); } catch (e) {}
        $('u-pw-old').value = ''; $('u-pw-new').value = '';
        status('密码已修改 ✅', 'ok');
      }).catch(function (e) {
        var m = (e && e.message) || String(e);
        status(/bad password/i.test(m) ? '当前密码不对。' : ('修改失败：' + m), 'err');
      }).then(function () { btn.disabled = false; btn.textContent = '修改密码'; });
    };
  }

  /* 消息中心 */
  function loadMessages() {
    var box = $('msg-list'), badge = $('msg-badge');
    if (!box) return;
    if (!isLogged()) {
      box.innerHTML = '<div class="empty">登录后查看消息。</div>';
      if (badge) badge.hidden = true;
      return;
    }
    box.innerHTML = '<div class="empty">加载中……</div>';
    JW.sb.rpc('list_notifications', {
      p_username: account.username, p_password: accountPw, p_limit: 30
    }).then(function (r) {
      if (r.error) throw r.error;
      var d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
      var items = (d && d.items) || [];
      var unread = (d && d.unread) || 0;
      if (badge) { badge.hidden = unread === 0; badge.textContent = unread; }
      box.textContent = '';
      if (!items.length) {
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = '还没有消息。有人回复你的帖子时会出现在这里。';
        box.appendChild(e);
        return;
      }
      var tools = document.createElement('div');
      tools.className = 'msg-tools';
      var allRead = document.createElement('button');
      allRead.type = 'button'; allRead.className = 'btn-ghost'; allRead.textContent = '全部标为已读';
      allRead.onclick = function () { markRead(null); };
      tools.appendChild(allRead);
      box.appendChild(tools);

      items.forEach(function (n) {
        var a = document.createElement('a');
        a.className = 'msg-item' + (n.is_read ? '' : ' unread');
        a.href = n.link ? ('./' + n.link) : '#';
        var tt = document.createElement('div'); tt.className = 'msg-tt'; tt.textContent = n.title || '通知';
        var bd = document.createElement('div'); bd.className = 'msg-bd'; bd.textContent = n.body || '';
        var tm = document.createElement('div'); tm.className = 'msg-tm'; tm.textContent = fmt(n.created_at);
        a.appendChild(tt); a.appendChild(bd); a.appendChild(tm);
        a.onclick = function () { if (!n.is_read) markRead(n.id, true); };
        box.appendChild(a);
      });
    }).catch(function (e) {
      box.textContent = '';
      var d = document.createElement('div');
      d.className = 'empty';
      var m = (e && e.message) || String(e);
      d.textContent = /bad password/i.test(m) ? '登录状态已失效，请重新登录。' : ('读取消息失败：' + m);
      box.appendChild(d);
    });
  }

  function markRead(id, silent) {
    JW.sb.rpc('mark_notifications_read', {
      p_username: account.username, p_password: accountPw, p_id: id
    }).then(function (r) {
      if (r.error) throw r.error;
      if (!silent) loadMessages();
      else {
        // 单条：只把红点数量减一
        var badge = $('msg-badge');
        if (badge && !badge.hidden) {
          var n = parseInt(badge.textContent, 10) || 0;
          if (n > 1) badge.textContent = n - 1; else badge.hidden = true;
        }
      }
    }).catch(function () {});
  }

  /* 折叠面板 */
  function bindFolds() {
    var heads = document.querySelectorAll('.acc-fold-head');
    Array.prototype.forEach.call(heads, function (h) {
      h.onclick = function () {
        var fold = h.parentNode;
        var open = fold.classList.toggle('open');
        try { localStorage.setItem('jw_fold_' + h.dataset.fold, open ? '1' : '0'); } catch (e) {}
        if (open && h.dataset.fold === 'msg') loadMessages();
      };
      // 恢复上次状态
      try {
        if (localStorage.getItem('jw_fold_' + h.dataset.fold) === '1') h.parentNode.classList.add('open');
      } catch (e) {}
    });
  }

  function boot() {
    readAccount();
    renderAccountCard();
    bindFolds();
    bindPassword();

    // 未登录时把设置区隐藏，醒目提示
    var inner = $('u-settings-inner'), warn = $('u-login-warn');
    if (!isLogged()) {
      if (inner) inner.hidden = true;
      if (warn) warn.hidden = false;
    }

    loadLocal();
    // 已登录时，名字/头像以账户为准
    if (isLogged()) {
      name = account.nickname || account.username.replace(/^@/, '');
      if (account.avatarMode) mode = account.avatarMode;
      if (account.avatarEmoji) emoji = account.avatarEmoji;
      if (account.avatarColor) color = account.avatarColor;
      if (account.avatarPath) { imagePath = account.avatarPath; image = avatarUrl(imagePath); }
    }
    $('u-name').value = name;
    renderAll();
    if (isLogged()) loadMessages();

    $('u-name').oninput = function () { name = $('u-name').value; renderPreview(); };
    $('u-save').onclick = function () {
      name = btrim($('u-name').value);
      if (!name) { status('名字不能空着。', 'err'); return; }
      saveLocal();
      renderPreview();
      // 已登录：把昵称和头像写进账户
      if (isLogged() && accountPw) {
        JW.sb.rpc('update_account_profile', {
          p_username: account.username, p_password: accountPw,
          p_nickname: name, p_avatar_mode: mode, p_avatar_path: imagePath || null,
          p_avatar_color: color, p_avatar_emoji: emoji
        }).then(function (r) {
          if (r.error) throw r.error;
          account.nickname = name;
          account.avatarMode = mode; account.avatarPath = imagePath;
          account.avatarColor = color; account.avatarEmoji = emoji;
          try { localStorage.setItem(ACC_KEY, JSON.stringify(account)); } catch (e) {}
          renderAccountCard();
        }).catch(function (e) {
          status('账户资料同步失败：' + ((e && e.message) || e), 'err');
        });
      }
      status('已保存 ✅ 之后留言、发作品会自动用这个名字和头像。', 'ok');
      setTimeout(function () { if (/已保存/.test($('u-status').textContent)) status(''); }, 3500);
    };
    $('mode-emoji').onclick = function () { mode = 'emoji'; renderAll(); };
    $('mode-image').onclick = function () { mode = 'image'; renderAll(); };
    $('btn-avatar-clear').onclick = function () { image = ''; imagePath = ''; mode = 'emoji'; renderAll(); };
    $('u-avatar-file').onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      if (!sb) { status('还没连上服务器，稍等再传。', 'err'); e.target.value = ''; return; }
      if (f.size > 8 * 1024 * 1024) { alert('头像超过 8MB，请换小一点的'); e.target.value = ''; return; }
      status('正在上传头像……');
      uploadAvatar(f).then(function (path) {
        imagePath = path; image = avatarUrl(path); mode = 'image';
        renderAll();
        status('头像已上传 ✅', 'ok');
        setTimeout(function () { if (/头像已上传/.test($('u-status').textContent)) status(''); }, 2500);
      }).catch(function (err) {
        status('上传失败：' + ((err && err.message) || err), 'err');
      }).then(function () { e.target.value = ''; });
    };
    $('u-reset').onclick = function () {
      if (!confirm('清空本机保存的名字和头像？（已发布的帖子和作品不受影响）')) return;
      name = ''; mode = 'emoji'; emoji = '🙂'; color = COLORS[0]; image = ''; imagePath = '';
      $('u-name').value = '';
      renderAll();
      status('已清空本机资料。', 'ok');
    };

    JW.whenReady(function (e) {
      if (e) { status('连不上云端，只能改本机资料：' + (e.message || e), 'err'); return; }
      sb = JW.sb; uid = JW.uid; deviceId = JW.deviceId;
      $('u-device').textContent = deviceId ? (deviceId.slice(0, 8) + '…') : '—';
      loadStats();
      loadMyPosts();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
SITE.shell('user');
SITE.footer(document.querySelector('.container'));

</script>
</body>
