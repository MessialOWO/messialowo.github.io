<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>用户中心 | 达高中墙Board</title>
<style>
  .avatar-circle { display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; overflow:hidden; flex-shrink:0; line-height:1; user-select:none; }
  .avatar-circle.big { width:72px; height:72px; font-size:2rem; }
  .avatar-circle.small { width:36px; height:36px; font-size:1.1rem; }
  .avatar-circle img { width:100%; height:100%; object-fit:cover; display:block; }
  #avatar-preview { width:72px; height:72px; flex-shrink:0; }
  .emoji-pick { width:44px; height:44px; font-size:1.3rem; border-radius:50%; border:2px solid var(--glass-brd); background:rgba(255,255,255,.6); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; }
  .emoji-pick.on { border-color:var(--accent); background:var(--accent-light); }
  .color-pick { width:36px; height:36px; border-radius:50%; cursor:pointer; padding:0; border:2px solid transparent; box-shadow:0 0 0 1px var(--border) inset; }
  .color-pick.on { border-color:#2c2c2c; }
  .gb-sec-chip { font-family:inherit; font-size:.88rem; cursor:pointer; padding:8px 14px; border:1px solid var(--glass-brd); border-radius:20px; background:rgba(255,255,255,.6); color:var(--text); }
  .gb-sec-chip.on { background:linear-gradient(160deg,#c0392b,#962820) !important; color:#fff !important; font-weight:700; }
  .user-head { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .stat-row { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0 22px; }
  .stat-card { flex:1 1 100px; background:rgba(255,255,255,.6); border:1px solid var(--glass-brd); border-radius:12px; padding:14px; text-align:center; }
  .stat-num { font-size:1.6rem; font-weight:700; color:var(--accent); line-height:1.2; }
  .stat-label { font-size:.78rem; color:var(--muted); margin-top:4px; }
  .my-post { display:block; text-decoration:none; color:inherit; background:rgba(255,255,255,.55); border:1px solid var(--glass-brd); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .my-post:hover { background:rgba(255,255,255,.85); }
  .my-post-text { font-size:.92rem; margin-bottom:6px; }
  .my-post-meta { font-size:.76rem; color:var(--muted); }

  /* 连接线路 */
  function bindLine() {
    var radios = document.querySelectorAll('input[name="line-mode"]');
    if (!radios.length || !window.JW || !JW.setLine) return;
    var cur = (JW.getLine && JW.getLine()) || 'auto';
    Array.prototype.forEach.call(radios, function (r) {
      if (r.value === cur) r.checked = true;
      r.onchange = function () {
        if (!this.checked) return;
        var mode = this.value === 'auto' ? null : this.value;
        JW.setLine(mode);
        var note = $('line-note');
        if (note) {
          note.textContent = this.value === 'auto'
            ? '已切回自动。刷新页面后生效。'
            : (this.value === 'relay' ? '已设为只用中转。刷新页面后生效。' : '已设为只连官方。刷新页面后生效。');
        }
        status('已保存线路设置，刷新页面后生效。', 'ok');
        setTimeout(function () { if (/线路设置/.test(($('u-status')||{}).textContent||'')) status(''); }, 3000);
      };
    });
    var note = $('line-note');
    if (note) {
      note.textContent = cur === 'auto'
        ? '当前：自动（直连优先，失败切中转）'
        : (cur === 'relay' ? '当前：只用中转' : '当前：只连官方');
    }
  }

  /* 折叠面板 */
  .acc-fold {
    border: 1px solid var(--glass-brd); border-radius: 14px;
    background: rgba(255,255,255,.5); margin-bottom: 14px; overflow: hidden;
  }
  .acc-fold-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 1rem; font-weight: 700; color: var(--text);
    text-align: left;
  }
  .acc-fold-head:hover { background: rgba(255,255,255,.55); }
  .acc-fold-head > span { display: flex; align-items: center; gap: 8px; }
  .acc-caret { font-style: normal; font-size: .78rem; color: var(--muted); transition: transform .2s; }
  .acc-fold.open .acc-caret { transform: rotate(180deg); }
  .acc-fold-body { display: none; padding: 0 18px 18px; }
  .acc-fold.open .acc-fold-body { display: block; }
  .acc-badge {
    display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
    padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff;
    font-size: .68rem; text-align: center; font-weight: 700;
  }

  /* 消息条 */
  .msg-item {
    display: block; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.6); border: 1px solid var(--glass-brd);
    border-left: 3px solid transparent; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .msg-item.unread { border-left-color: var(--accent); background: #fffdfb; }
  .msg-item:hover { background: rgba(255,255,255,.9); }
  .msg-tt { font-size: .88rem; font-weight: 700; margin-bottom: 3px; }
  .msg-bd { font-size: .8rem; color: var(--muted); line-height: 1.6; }
  .msg-tm { font-size: .7rem; color: var(--muted); opacity: .75; margin-top: 5px; }
  .msg-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .msg-tools button { font-size: .78rem; padding: 6px 12px; }

  /* 连接线路选项 */
  .line-opts { display: flex; flex-direction: column; gap: 10px; }
  .line-opt {
    display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--glass-brd); background: rgba(255,255,255,.55);
  }
  .line-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-light); }
  .line-opt input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .line-body { flex: 1; min-width: 0; }
  .line-body b { display: block; font-size: .88rem; margin-bottom: 3px; }
  .line-body small { font-size: .76rem; color: var(--muted); line-height: 1.65; }
</style>
<link rel="icon" href="./img/logo.png">
<link rel="stylesheet" href="./assets/site.css">
<link rel="stylesheet" href="./assets/liquid-glass.css">
</head>
<body>
<div class="main">
<div class="container">
<div class="page-head">
  <h1>用户中心</h1>
  <div class="en">Account</div>
  <p>账户资料、消息和发言身份都在这里。</p>
</div>

<div class="status" id="u-status" hidden></div>

<!-- 账户信息卡 -->
<div class="card-box" id="u-acct-card" style="margin-bottom:16px">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div id="u-acct-avatar" style="width:52px;height:52px;flex-shrink:0"></div>
    <div style="flex:1;min-width:0">
      <div id="u-acct-name" style="font-size:1.05rem;font-weight:700">未登录</div>
      <div id="u-acct-sub" style="font-size:.76rem;color:var(--muted);margin-top:3px">登录后才能改密码、看消息</div>
    </div>
    <a id="u-acct-go" href="./auth.html" class="btn-main" style="text-decoration:none;padding:8px 16px;font-size:.85rem;white-space:nowrap">登录 / 注册</a>
  </div>
</div>

<!-- 折叠 1：消息中心 -->
<div class="acc-fold" id="fold-msg">
  <button class="acc-fold-head" type="button" data-fold="msg">
    <span>消息中心<span id="msg-badge" class="acc-badge" hidden>0</span></span>
    <i class="acc-caret">▾</i>
  </button>
  <div class="acc-fold-body">
    <div id="msg-list"><div class="empty">登录后查看消息。</div></div>
  </div>
</div>

<!-- 折叠：背景 -->
<div class="acc-fold" id="fold-bg">
  <button class="acc-fold-head" type="button" data-fold="bg">
    <span>背景</span>
    <i class="acc-caret">▾</i>
  </button>
  <div class="acc-fold-body">
    <div style="font-size:.8rem;color:var(--muted);line-height:1.8;margin-bottom:14px">
      自定义背景只保存在这台设备上，不会上传。换个设备或清空浏览器数据就会恢复默认。
    </div>

    <div id="bg-preview" style="width:100%;height:110px;border-radius:10px;border:1px solid var(--glass-brd);margin-bottom:12px;background:rgba(0,0,0,.04) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);overflow:hidden">
      还没有设置背景
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">
      <label for="bg-file" style="display:inline-block;padding:9px 16px;background:rgba(255,255,255,.75);border:1px solid var(--glass-brd);border-radius:9px;cursor:pointer;font-size:.88rem">选择图片</label>
      <input type="file" id="bg-file" accept="image/*" style="display:none">
      <button class="btn-ghost" id="bg-clear" type="button">恢复默认</button>
    </div>

    <label style="display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin-bottom:8px">
      <span>暗度</span><span id="bg-dim-val">35%</span>
    </label>
    <input type="range" id="bg-dim" min="0" max="80" value="35" step="1"
      style="width:100%;margin-bottom:18px;accent-color:var(--accent)">

    <label style="display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin-bottom:8px">
      <span>模糊度</span><span id="bg-blur-val">6px</span>
    </label>
    <input type="range" id="bg-blur" min="0" max="24" value="6" step="1"
      style="width:100%;margin-bottom:8px;accent-color:var(--accent)">

    <div style="font-size:.76rem;color:var(--muted);line-height:1.7">
      图片会压到最长边 1600 像素再保存，避免占满浏览器空间。
    </div>
  </div>
</div>

<!-- 折叠：连接线路 -->
<div class="acc-fold" id="fold-line">
  <button class="acc-fold-head" type="button" data-fold="line">
    <span>连接线路</span>
    <i class="acc-caret">▾</i>
  </button>
  <div class="acc-fold-body">
    <div style="font-size:.8rem;color:var(--muted);line-height:1.8;margin-bottom:14px">
      如果页面加载很慢或者一直转圈，可以在这里换一条线路试试。记住的选择只保存在这台设备上。
    </div>

    <div class="line-opts">
      <label class="line-opt">
        <input type="radio" name="line-mode" value="auto" checked>
        <span class="line-body">
          <b>自动（推荐）</b>
          <small>先直连官方服务器，5 秒没响应就自动切到中转线路。一般不用改。</small>
        </span>
      </label>
      <label class="line-opt">
        <input type="radio" name="line-mode" value="relay">
        <span class="line-body">
          <b>只用中转</b>
          <small>不尝试直连，直接走中转。直连明显不通时选这个。</small>
        </span>
      </label>
      <label class="line-opt">
        <input type="radio" name="line-mode" value="direct">
        <span class="line-body">
          <b>只连官方</b>
          <small>完全不走中转。中转不可用、或想省中转额度时选这个。</small>
        </span>
      </label>
    </div>

    <div id="line-note" style="font-size:.76rem;color:var(--muted);margin-top:10px;line-height:1.7"></div>
  </div>
</div>

<!-- 折叠 2：账户设置 -->
<div class="acc-fold" id="fold-settings">
  <button class="acc-fold-head" type="button" data-fold="settings">
    <span>账户设置</span>
    <i class="acc-caret">▾</i>
  </button>
  <div class="acc-fold-body">
    <div id="u-login-warn" class="empty" hidden>还没登录。先去 <a href="./auth.html">登录 / 注册</a>，然后才能改名字、头像和密码。</div>
    <div id="u-settings-inner">


<div class="card-box" style="margin-bottom:18px">
  <div class="user-head">
    <div id="avatar-preview"></div>
    <div>
      <div style="font-size:1.05rem;font-weight:700" id="top-name">还没设名字</div>
      <div style="font-size:.8rem;color:var(--muted);margin-top:4px">本机标识：<span id="u-device">—</span></div>
    </div>
  </div>

  <label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px">显示名字</label>
  <input type="text" id="u-name" maxlength="20" placeholder="输入名字或昵称"
    style="width:100%;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:16px">

  <label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px">头像</label>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="gb-sec-chip" id="mode-emoji" type="button" style="flex:1 1 120px">😀 emoji 头像</button>
    <button class="gb-sec-chip" id="mode-image" type="button" style="flex:1 1 120px">🖼 上传图片</button>
  </div>
  <div id="panel-emoji" style="margin-bottom:16px">
    <div id="emoji-row" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
    <div id="color-row" style="display:flex;flex-wrap:wrap;gap:10px"></div>
  </div>
  <div id="panel-image" hidden style="margin-bottom:16px">
    <label for="u-avatar-file" style="display:inline-block;padding:9px 16px;background:rgba(255,255,255,.7);border:1px solid var(--glass-brd);border-radius:8px;cursor:pointer;font-size:.9rem">选择图片</label>
    <input type="file" id="u-avatar-file" accept="image/*" style="display:none">
    <button class="btn-ghost" id="btn-avatar-clear" type="button" hidden style="margin-left:8px">清除</button>
    <div style="font-size:.78rem;color:var(--muted);margin-top:8px">上传时自动压缩到 256 像素</div>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn-main" id="u-save" type="button">保存</button>
    <button class="btn-ghost" id="u-reset" type="button">清空本机资料</button>
  </div>

  <div style="border-top:1px dashed var(--border);margin-top:18px;padding-top:16px">
    <div style="font-size:.9rem;font-weight:700;margin-bottom:10px">修改用户名</div>
    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px">当前用户名</label>
    <input type="text" id="u-uname-view" readonly
      style="width:100%;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:10px;background:rgba(0,0,0,.03);color:var(--muted)">
    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px">新用户名（字母开头，字母数字下划线，3~20 位）</label>
    <div style="display:flex;align-items:center;gap:0;margin-bottom:4px">
      <span style="padding:10px 0 10px 12px;color:var(--accent);font-weight:700">@</span>
      <input type="text" id="u-uname-new" placeholder="新用户名"
        style="flex:1;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-left:-20px;padding-left:26px">
    </div>
    <div id="u-uname-hint" style="font-size:.76rem;color:var(--muted);margin-bottom:10px;min-height:1.2em"></div>
    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px">密码（确认是你本人）</label>
    <input type="password" id="u-uname-pw" placeholder="当前密码"
      style="width:100%;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:12px">
    <button class="btn-main" id="u-uname-save" type="button">修改用户名</button>
  </div>

  <div style="border-top:1px dashed var(--border);margin-top:18px;padding-top:16px">
    <div style="font-size:.9rem;font-weight:700;margin-bottom:10px">修改密码</div>
    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px">当前密码</label>
    <input type="password" id="u-pw-old" placeholder="注册时设的密码（没设过就是 123456）"
      style="width:100%;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:10px">
    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px">新密码（至少 6 位）</label>
    <input type="password" id="u-pw-new" placeholder="新密码"
      style="width:100%;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:12px">
    <button class="btn-main" id="u-pw-save" type="button">修改密码</button>
  </div>
</div>

    </div>
  </div>
</div>

<!-- 我的足迹（不折叠） -->
<div class="card-box" style="margin:16px 0">
  <h3 style="font-size:1.05rem;margin-bottom:4px">我的足迹</h3>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num" id="stat-msg">—</div><div class="stat-label">留言</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-work">—</div><div class="stat-label">作品</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-art">—</div><div class="stat-label">文章</div></div>
  </div>
</div>

<!-- 我发过的帖子 -->
<div class="card-box">
  <h3 style="font-size:1.05rem;margin-bottom:12px">我发过的帖子</h3>
  <div id="my-posts"></div>
</div>
</div>
</div>
<script src="./vendor/supabase.js"></script>
<script>
/* ===== 班级期刊 · 全站共享脚本（侧边栏 + 云端连接） ===== */
var SITE = {
  name: '达高中墙Board',
  school: '达州市高级中学',
  pages: [
    { href: './',                  label: '首页',       en: 'Home',      key: 'home' },
    { href: './gallery.html',      label: '画廊',       en: 'Gallery',   key: 'gallery' },
    { href: './guestbook.html',    label: '留言板',     en: 'Guestbook', key: 'guestbook' },
    { href: './journal.html',      label: '期刊投稿',   en: 'Journal',   key: 'journal' }
  ],
  /* 「用户中心」折叠组 */
  userPages: [
    { href: './auth.html',          label: '登录 / 注册', en: 'Sign in',  key: 'auth' },
    { href: './user.html#fold-msg',      label: '消息中心', en: 'Messages', key: 'user' },
    { href: './user.html#fold-settings', label: '账户设置', en: 'Settings', key: 'user-settings' },
    { href: './user.html#fold-bg',       label: '背景',     en: 'Theme',    key: 'user-bg' }
  ],
  /* 「关于」折叠组 */
  aboutPages: [
    { href: './about-school.html', label: '关于学校',   en: 'About School', key: 'school' },
    { href: './about-site.html',   label: '关于本站',   en: 'About Site',   key: 'site' },
    { href: './changelog.html',    label: '更新日志',   en: 'Changelog',    key: 'changelog' }
  ]
};

/* 是否已登录 */
SITE.loggedIn = function () {
  try {
    var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
    return !!(a && a.username);
  } catch (e) { return false; }
};
SITE.account = function () {
  try { return JSON.parse(localStorage.getItem('jw_account') || 'null'); } catch (e) { return null; }
};

/* 生成侧边栏 + 顶栏（每个页面只需调用 SITE.shell('key')） */
SITE.shell = function (activeKey) {
  var links = SITE.pages.map(function (p) {
    return '<a href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');

  // 「用户中心」折叠组
  var logged = SITE.loggedIn();
  // 已登录后不再显示「登录 / 注册」
  var userItems = SITE.userPages.filter(function (p) {
    return !(logged && p.key === 'auth');
  });
  var userOpen = userItems.some(function (p) { return p.key === activeKey; })
                 || ['auth','user','user-settings','user-bg'].indexOf(activeKey) >= 0;
  var userLinks = userItems.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');
  links += '<div class="nav-group' + (userOpen ? ' open' : '') + '" id="nav-user">'
    + '<button type="button" class="nav-group-btn' + (userOpen ? ' on' : '') + '" id="nav-user-btn">'
    + (logged && SITE.account() && SITE.account().username
        ? SITE.account().username.replace(/^@/, '') + '<small>已登录</small>'
        : '用户中心<small>Account</small>')
    + '<i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + userLinks + '</div>'
    + '</div>';

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

  /* 上传头像 */
  function uploadAvatar(file) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, 256, 256);
        var side = Math.min(im.width, im.height);
        cx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, 256, 256);
        cv.toBlob(function (b) {
          if (!b) return rej(new Error('图片编码失败'));
          var path = uid + '/avatar-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          sb.storage.from('avatars').upload(path, b, { contentType: 'image/jpeg', upsert: false })
            .then(function (r) { if (r.error) throw r.error; res(path); }).catch(rej);
        }, 'image/jpeg', 0.85);
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* ================= 账户系统 ================= */
  var PW_SALT = 'jw-salt-2026';
  function hashPw(pw) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(PW_SALT + '|' + pw))
        .then(function (b) {
          return Array.prototype.map.call(new Uint8Array(b), function (x) {
            return ('0' + x.toString(16)).slice(-2);
          }).join('');
        });
    }
    return Promise.reject(new Error('当前环境不支持加密（请用 https 打开）'));
  }
  var ACC_KEY = 'jw_account', PW_KEY = 'jw_account_pw';
  var account = null, accountPw = '';

  function readAccount() {
    try { account = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); } catch (e) { account = null; }
    try { accountPw = localStorage.getItem(PW_KEY) || ''; } catch (e) { accountPw = ''; }
  }
  function isLogged() { return !!(account && account.username); }

  function renderAccountCard() {
    var av = $('u-acct-avatar'), nm = $('u-acct-name'), sub = $('u-acct-sub'), go = $('u-acct-go');

      var el = document.createElement('div');
      el.className = 'avatar-circle big';
      el.style.cssText = 'width:52px;height:52px;font-size:1.5rem';
      if (account.avatarMode === 'image' && account.avatarPath) {
        var im = document.createElement('img');
        im.src = (window.JW && JW.storagePublic || '') + account.avatarPath;
        im.alt = '';
        im.onerror = function () { el.textContent = account.avatarEmoji || '🙂'; el.style.background = account.avatarColor || '#c0392b'; };
        el.appendChild(im);
      } else {
        el.textContent = account.avatarEmoji || '🙂';
        el.style.background = account.avatarColor || '#c0392b';
      }
      av.appendChild(el);
      nm.textContent = account.username;
      sub.textContent = account.nickname ? ('显示名：' + account.nickname) : '还没设显示名';
      go.textContent = '退出';
      go.href = '#';
      go.onclick = function (e) {
        e.preventDefault();
        if (!confirm('退出登录？（本机记住的资料会清掉）')) return;
        try {
          localStorage.removeItem(ACC_KEY); localStorage.removeItem(PW_KEY);
          localStorage.removeItem('jiangwan_gb_name'); localStorage.removeItem('jiangwan_gb_look');
        } catch (er) {}
        location.reload();
      };
    } else {
      av.innerHTML = '<div class="avatar-circle big" style="width:52px;height:52px;font-size:1.5rem;background:#ddd">?</div>';
      nm.textContent = '未登录';

      go.textContent = '登录 / 注册';
      go.href = './auth.html?next=' + encodeURIComponent('./user.html');
      go.onclick = null;
    }
  }

  /* 改用户名 */
  function bindUsername() {
    var view = $('u-uname-view');
    if (view && isLogged()) view.value = account.username;

    var inp = $('u-uname-new');
    if (inp) {
      inp.oninput = function () {
        var v = this.value.replace(/[^A-Za-z0-9_]/g, '');
        if (v.charAt(0) === '@') v = v.replace(/^@+/, '');
        this.value = v;
        var h = $('u-uname-hint');
        if (!v) { h.textContent = ''; h.style.color = ''; return; }
        var msg = '', ok = false;
        if (v.length < 3) msg = '至少 3 个字符';
        else if (v.length > 20) msg = '最多 20 个字符';
        else if (!/^[A-Za-z]/.test(v)) msg = '必须以英文字母开头';
        else if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(v)) msg = '只能用英文字母、数字、下划线';
        else if (isLogged() && v.toLowerCase() === account.username.replace(/^@/, '').toLowerCase()) msg = '和当前用户名一样';
        else { msg = '可以用'; ok = true; }
        h.textContent = msg;
        h.style.color = ok ? '#27ae60' : '#c0392b';
      };
    }

    var btn = $('u-uname-save');
    if (!btn) return;
    btn.onclick = function () {
      if (!isLogged()) { status('先登录。', 'err'); return; }
      var nv = ($('u-uname-new').value || '').trim();
      var pw = $('u-uname-pw').value;
      if (!nv) { status('请填新用户名。', 'err'); return; }
      if (!pw) { status('请输入密码确认。', 'err'); return; }
      if (!confirm('确定把用户名改成 @' + nv + ' 吗？\n\n你之前发过的帖子和回复会自动转到这个新用户名下。\n旧用户名会被释放，别人以后可以注册。')) return;
      btn.disabled = true; btn.textContent = '提交中…';
      hashPw(pw).then(function (h) {
        return JW.sb.rpc('change_username', {
          p_old_username: account.username, p_pw_hash: h, p_new_username: nv
        });
      }).then(function (r) {
        if (r.error) throw r.error;
        var d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
        account.username = d.username || ('@' + nv);
        if (d.nickname) account.nickname = d.nickname;
        try { localStorage.setItem(ACC_KEY, JSON.stringify(account)); } catch (e) {}
        $('u-uname-view').value = account.username;
        $('u-uname-new').value = '';
        $('u-uname-pw').value = '';
        $('u-uname-hint').textContent = '';
        renderAccountCard();
        var np = (d && d.synced_posts) || 0;
        var nr = (d && d.synced_replies) || 0;
        var extra = '';
        if (np || nr) {
          var bits = [];
          if (np) bits.push(np + ' 条帖子');
          if (nr) bits.push(nr + ' 条回复');
          extra = '，已同步 ' + bits.join('、');
        }
        status('用户名已改为 ' + account.username + ' ✅' + extra, 'ok');
      }).catch(function (e) {
        var m = (e && e.message) || String(e);
        status(/username taken/i.test(m) ? '这个用户名已经有人用了。'
          : (/bad password/i.test(m) ? '密码不对。'
          : (/bad username/i.test(m) ? '新用户名不符合规则。' : ('修改失败：' + m))), 'err');
      }).then(function () { btn.disabled = false; btn.textContent = '修改用户名'; });
    };
  }

  /* 改密码 */
  function bindPassword() {
    var btn = $('u-pw-save');
    if (!btn) return;
    btn.onclick = function () {
      if (!isLogged()) { status('先登录。', 'err'); return; }
      var oldPw = $('u-pw-old').value, newPw = $('u-pw-new').value.trim();
      if (!oldPw) { status('请填当前密码。', 'err'); return; }
      if (newPw.length < 6) { status('新密码至少 6 位。', 'err'); return; }
      btn.disabled = true; btn.textContent = '提交中…';
      Promise.all([hashPw(oldPw), hashPw(newPw)]).then(function (hs) {
        return JW.sb.rpc('change_password', {
          p_username: account.username, p_old_hash: hs[0], p_new_hash: hs[1]
        });
      }).then(function (r) {
        if (r.error) throw r.error;
        try { localStorage.setItem(PW_KEY, newPw); } catch (e) {}
        $('u-pw-old').value = ''; $('u-pw-new').value = '';
        status('密码已修改 ✅', 'ok');
      }).catch(function (e) {
        var m = (e && e.message) || String(e);
        status(/bad password/i.test(m) ? '当前密码不对。' : ('修改失败：' + m), 'err');
      }).then(function () { btn.disabled = false; btn.textContent = '修改密码'; });
    };

  /* ================= 自定义背景 ================= */
  function bindBackground() {
    var fileEl = $('bg-file'), dimEl = $('bg-dim'), blurEl = $('bg-blur');
    var dimVal = $('bg-dim-val'), blurVal = $('bg-blur-val'), preview = $('bg-preview');
    if (!dimEl || !SITE.BG) return;

    var cfg = SITE.BG.getCfg();
    var src = SITE.BG.getSrc();
    dimEl.value = cfg.dim; blurEl.value = cfg.blur;
    if (dimVal) dimVal.textContent = cfg.dim + '%';
    if (blurVal) blurVal.textContent = cfg.blur + 'px';
    if (preview) {
      if (src) {
        preview.style.backgroundImage = 'url("' + src + '")';
        preview.textContent = '';
      } else {
        preview.textContent = '还没有设置背景';
      }
    }

    var saveTimer = null;
    function scheduleSave(immediate) {
      clearTimeout(saveTimer);
      var run = function () {
        var c = { dim: +dimEl.value, blur: +blurEl.value };
        if (!SITE.BG.getSrc()) { SITE.BG.saveCfg(c); return; }
        SITE.BG.saveCfg(c);
        SITE.BG.preview(SITE.BG.getSrc(), c);
      };
      if (immediate) run(); else saveTimer = setTimeout(run, 260);
    }

    dimEl.oninput = function () {
      if (dimVal) dimVal.textContent = this.value + '%';
      scheduleSave(true);
    };
    blurEl.oninput = function () {
      if (blurVal) blurVal.textContent = this.value + 'px';
      scheduleSave(false);
    };

    if (fileEl) fileEl.onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      if (!f.type || f.type.indexOf('image/') !== 0) { alert('请选图片文件'); e.target.value = ''; return; }
      status('正在处理图片……');
      SITE.BG.compress(f, 1600, 0.82).then(function (dataUrl) {
        var ok = SITE.BG.saveSrc(dataUrl);
        if (!ok) {
          status('图片太大，浏览器存不下。换一张小一点的，或先裁小。', 'err');
          return;
        }
        SITE.BG.saveCfg({ dim: +dimEl.value, blur: +blurEl.value });
        if (preview) { preview.style.backgroundImage = 'url("' + dataUrl + '")'; preview.textContent = ''; }
        SITE.BG.preview(dataUrl, { dim: +dimEl.value, blur: +blurEl.value });
        status('背景已设置 ✅', 'ok');
        setTimeout(function () { if (/背景已设置/.test(($('u-status')||{}).textContent||'')) status(''); }, 2500);
      }).catch(function (err) {
        status('处理失败：' + ((err && err.message) || err), 'err');
      }).then(function () { e.target.value = ''; });
    };

    var clr = $('bg-clear');
    if (clr) clr.onclick = function () {
      if (!confirm('恢复默认背景？')) return;
      SITE.BG.clear();
      if (preview) { preview.style.backgroundImage = ''; preview.textContent = '还没有设置背景'; }
      status('已恢复默认背景。', 'ok');
      setTimeout(function () { if (/恢复默认/.test(($('u-status')||{}).textContent||'')) status(''); }, 2000);
    };
  }

  /* 折叠面板 */
  var FOLD_IDS = { msg: 'fold-msg', settings: 'fold-settings', bg: 'fold-bg' };
  function openFold(name) {
    var fold = document.getElementById(FOLD_IDS[name] || name);
    if (!fold) return;
    fold.classList.add('open');
    try { localStorage.setItem('jw_fold_' + name, '1'); } catch (e) {}
    if (name === 'msg' && isLogged()) loadMessages();
  }
  function bindFolds() {
    var heads = document.querySelectorAll('.acc-fold-head');
    Array.prototype.forEach.call(heads, function (h) {
      h.onclick = function () {
        var fold = h.parentNode;
        var open = fold.classList.toggle('open');
        try { localStorage.setItem('jw_fold_' + h.dataset.fold, open ? '1' : '0'); } catch (e) {}
        if (open && h.dataset.fold === 'msg') loadMessages();
      };
      // 恢复上次状态
      try {
        if (localStorage.getItem('jw_fold_' + h.dataset.fold) === '1') h.parentNode.classList.add('open');
      } catch (e) {}
    });

    // 从侧边栏点进来的 #fold-xxx 直达
    function fromHash() {
      var h = (location.hash || '').replace('#', '');
      if (!h) return;
      var name = h.replace(/^fold-/, '');
      if (!FOLD_IDS[name] && !document.getElementById(h)) return;
      openFold(name);
      setTimeout(function () {
        var el = document.getElementById(FOLD_IDS[name] || h);
        if (el && typeof el.scrollIntoView === 'function') {
          try { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {}
        }
      }, 120);
    }
    fromHash();
    window.addEventListener('hashchange', fromHash);
  }

  function boot() {
    readAccount();
    renderAccountCard();
    bindFolds();
    bindPassword();
    bindUsername();
    bindBackground();
    bindLine();

    // 未登录时把设置区隐藏，醒目提示
    var inner = $('u-settings-inner'), warn = $('u-login-warn');
    if (!isLogged()) {
      if (inner) inner.hidden = true;
      if (warn) warn.hidden = false;
    }

    loadLocal();
    // 已登录时，名字/头像以账户为准
    if (isLogged()) {
      name = account.nickname || account.username.replace(/^@/, '');
      if (account.avatarMode) mode = account.avatarMode;
      if (account.avatarEmoji) emoji = account.avatarEmoji;
      if (account.avatarColor) color = account.avatarColor;
      if (account.avatarPath) { imagePath = account.avatarPath; image = avatarUrl(imagePath); }
    }
    $('u-name').value = name;
    renderAll();
    if (isLogged()) loadMessages();

    $('u-name').oninput = function () { name = $('u-name').value; renderPreview(); };
    $('u-save').onclick = function () {
      name = btrim($('u-name').value);
      if (!name) { status('名字不能空着。', 'err'); return; }
      saveLocal();
      renderPreview();
      // 已登录：把昵称和头像写进账户
      if (isLogged() && accountPw) {
        hashPw(accountPw).then(function (h) {
          return JW.sb.rpc('update_account_profile', {
            p_username: account.username, p_pw_hash: h,
            p_nickname: name, p_avatar_mode: mode, p_avatar_path: imagePath || null,
            p_avatar_color: color, p_avatar_emoji: emoji
          });
        }).then(function (r) {
          if (r.error) throw r.error;
          account.nickname = name;
          account.avatarMode = mode; account.avatarPath = imagePath;
          account.avatarColor = color; account.avatarEmoji = emoji;
          try { localStorage.setItem(ACC_KEY, JSON.stringify(account)); } catch (e) {}
          renderAccountCard();
        }).catch(function (e) {
          status('账户资料同步失败：' + ((e && e.message) || e), 'err');
        });
      }
      status('已保存 ✅ 之后留言、发作品会自动用这个名字和头像。', 'ok');
      setTimeout(function () { if (/已保存/.test($('u-status').textContent)) status(''); }, 3500);
    };
    $('mode-emoji').onclick = function () { mode = 'emoji'; renderAll(); };
    $('mode-image').onclick = function () { mode = 'image'; renderAll(); };
    $('btn-avatar-clear').onclick = function () { image = ''; imagePath = ''; mode = 'emoji'; renderAll(); };
    $('u-avatar-file').onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      if (!sb) { status('还没连上服务器，稍等再传。', 'err'); e.target.value = ''; return; }
      if (f.size > 8 * 1024 * 1024) { alert('头像超过 8MB，请换小一点的'); e.target.value = ''; return; }
      status('正在上传头像……');
      uploadAvatar(f).then(function (path) {
        imagePath = path; image = avatarUrl(path); mode = 'image';
        renderAll();
        status('头像已上传 ✅', 'ok');
        setTimeout(function () { if (/头像已上传/.test($('u-status').textContent)) status(''); }, 2500);
      }).catch(function (err) {
        status('上传失败：' + ((err && err.message) || err), 'err');
      }).then(function () { e.target.value = ''; });
    };
    $('u-reset').onclick = function () {
      if (!confirm('清空本机保存的名字和头像？（已发布的帖子和作品不受影响）')) return;
      name = ''; mode = 'emoji'; emoji = '🙂'; color = COLORS[0]; image = ''; imagePath = '';
      $('u-name').value = '';
      renderAll();
      status('已清空本机资料。', 'ok');
    };

    JW.whenReady(function (e) {
      if (e) { status('连不上云端，只能改本机资料：' + (e.message || e), 'err'); return; }
      sb = JW.sb; uid = JW.uid; deviceId = JW.deviceId;
      $('u-device').textContent = deviceId ? (deviceId.slice(0, 8) + '…') : '—';
      loadStats();
      loadMyPosts();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
SITE.shell('user');
SITE.footer(document.querySelector('.container'));

</script>
</body>
</html>
