/* 是否已登录 */
SITE.loggedIn = function () {

/* 生成侧边栏 + 顶栏（每个页面只需调用 SITE.shell('key')） */
SITE.shell = function (activeKey) {
  var links = SITE.pages.map(function (p) {
    return '<a href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');

  // 「用户中心」折叠组
  var logged = SITE.loggedIn();
  // 已登录后不再显示「登录 / 注册」
  var userItems = SITE.userPages.filter(function (p) {
    return !(logged && p.key === 'auth');
  });
  var userOpen = userItems.some(function (p) { return p.key === activeKey; })
                 || ['auth','user','user-settings','user-bg'].indexOf(activeKey) >= 0;
  var userLinks = userItems.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');
  links += '<div class="nav-group' + (userOpen ? ' open' : '') + '" id="nav-user">'

    + '<div class="nav-group-body">' + userLinks + '</div>'
    + '</div>';

  // 「关于」折叠组：关于学校 / 关于本站
  var aboutOpen = SITE.aboutPages.some(function (p) { return p.key === activeKey; });
  var aboutLinks = SITE.aboutPages.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '</a>';
  }).join('');
  links += '<div class="nav-group' + (aboutOpen ? ' open' : '') + '" id="nav-about">'
    + '<button type="button" class="nav-group-btn' + (aboutOpen ? ' on' : '') + '" id="nav-about-btn">'
    + '关于<small>About</small><i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + aboutLinks + '</div>'
    + '</div>';

  var bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = '<button id="nav-toggle" aria-label="菜单">☰</button>'
    + '<span class="title">' + SITE.name + '</span>';

  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.id = 'nav-mask';
  mask.hidden = true;

  var aside = document.createElement('aside');
  aside.className = 'sidebar';
  aside.innerHTML =
    '<div class="brand">'
    + '<img src="./img/logo.png" alt="校徽">'
    + '<div class="name">' + SITE.name + '</div>'
    + '<div class="sub">Unofficial</div>'
    + '</div>'
    + '<nav>' + links + '</nav>'
    ;

  document.body.insertBefore(aside, document.body.firstChild);
  document.body.insertBefore(mask, document.body.firstChild);
  document.body.insertBefore(bar, document.body.firstChild);

  var userBtn = aside.querySelector('#nav-user-btn');
  if (userBtn) {
    userBtn.onclick = function () {
      var g = aside.querySelector('#nav-user');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_user_open', open ? '1' : '0'); } catch (e) {}
    };
    if (!userOpen) {
      try {
        if (localStorage.getItem('jw_user_open') === '1') aside.querySelector('#nav-user').classList.add('open');
      } catch (e) {}
    }
  }

  var aboutBtn = aside.querySelector('#nav-about-btn');
  if (aboutBtn) {
    aboutBtn.onclick = function () {
      var g = aside.querySelector('#nav-about');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_about_open', open ? '1' : '0'); } catch (e) {}
    };
    // 记住上次展开状态（只要不是当前页在关于里）
    if (!aboutOpen) {
      try {
        if (localStorage.getItem('jw_about_open') === '1') aside.querySelector('#nav-about').classList.add('open');
      } catch (e) {}
    }
  }

  bar.querySelector('#nav-toggle').onclick = function () {
    document.body.classList.toggle('nav-open');
    mask.hidden = !document.body.classList.contains('nav-open');
  };
  mask.onclick = function () {
    document.body.classList.remove('nav-open');
    mask.hidden = true;

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

</script>
<script>
/* ===== 班级期刊 · 云端连接（所有页面共用） ===== */
var JW = {
  url: 'https://wvqrnkgjwnlhjhfuonts.supabase.co',
  key: 'sb_publishable_cGy9MFHh3-t2i0kEnbHeeg_A1-rUMaF',
  bucket: 'avatars',
  timeoutMs: 10000,
  /* 中转线路列表（按顺序尝试）
     - Deno Deploy：原来的主力
     - Cloudflare Pages：部署后把地址填进来（xxx.pages.dev）
     注意：不要填 workers.dev，那个在国内被墙。 */
  proxy: [
    'https://arid-bluejay-4932.messialowo.deno.net'
    /* 部署 Cloudflare Pages 后，在上面这行后面加英文逗号，再填你的地址，例如：
       , 'https://jw-relay.pages.dev'
    */
  ],
  /* 中转健康状态：连续失败就暂时跳过，直接连主库，避免每次白等超时 */
  _proxyFail: {}, _proxySkipUntil: 0,
  _directOK: null, _directFailCount: 0, _directSkipUntil: 0,
  /* 用户手动选择：'direct' 只直连 / 'relay' 走中转 / null 未选（先试直连） */
  lineMode: null, _asking: false,      // null=默认(直连优先+5秒询问) / 'direct' / 'relay'
  LINE_KEY: 'jw_line_mode',
  sb: null, uid: '', deviceId: '', ready: false, error: null, _waiters: [],
  whenReady: function (cb) { if (JW.ready) cb(JW.error); else JW._waiters.push(cb); },
  _settle: function (err) {
    JW.error = err || null; JW.ready = true;
    JW._waiters.splice(0).forEach(function (cb) { try { cb(JW.error); } catch (e) { console.error(e); } });
    try { document.dispatchEvent(new Event('jw:ready')); } catch (e) {}
  },
  withTimeout: function (p, ms, what) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (done) return; done = true;
        reject(new Error('连接超时：' + (what || '请求') + '（' + Math.round(ms / 1000) + ' 秒无响应）'));
      }, ms);
      Promise.resolve(p).then(function (v) { if (done) return; done = true; clearTimeout(t); resolve(v); },
        function (e) { if (done) return; done = true; clearTimeout(t); reject(e); });
    });
  },
  retry: function (fn, times) {
    times = times === undefined ? 2 : times;
    var n = 0;
    var run = function () {
      n++;
      return Promise.resolve().then(fn).catch(function (e) {
        if (n >= times) throw e;
        return new Promise(function (r) { setTimeout(r, 1200); }).then(run);
      });
    };
    return run();
  },
  makeFetch: function () {
    var BASE = JW.url;
    return function (input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      var rel = null;
      try {
        var u = new URL(url, BASE);
        if (u.origin === BASE) rel = u.pathname + u.search;
      } catch (e) {}
      if (!rel || !JW.proxy || !JW.proxy.length) return fetch(input, init);

      /* 文件存储（上传/下载/删除）不走中转：
         Storage 本身就是对象存储 CDN，国内访问比数据库 API 稳；
         而且大文件经中转转发会占用大量"内存×时间"额度，把免费额度耗尽。
         所以 storage 直连，失败再退回中转。 */
      if (rel.indexOf('/storage/v1/') === 0) {
        return fetch(url, init).catch(function (e) {
          console.warn('Storage 直连失败，改走中转', e && e.message);
          var list0 = JW.proxy.slice();
          function tryRelay(i) {
            if (i >= list0.length) throw e;
            var clean = String(list0[i]).replace(/\/$/, '');
            return fetch(clean + rel, init).then(function (res) {
              if (!res || res.status >= 500) throw new Error('中转 ' + clean + ' 返回 ' + (res && res.status));
              return res;
            }).catch(function () { return tryRelay(i + 1); });
          }
          return tryRelay(0);
        });
      }
      /* ===== 连接策略 =====
         默认（自动）：先试直连，3 秒没响应或失败 → 自动切中转，不打扰用户
         手动：用户可在「用户中心 → 连接线路」里指定「只直连」或「只中转」
         文件存储（storage）已在上面单独处理，不走这里 */
      var DIRECT_TIMEOUT = 3000;
      var cleanList = JW.proxy.map(function (x) { return String(x).replace(/\/$/, ''); });

      function viaRelay() {
        if (!cleanList.length) return fetch(url, init);
        function attempt(i) {
          if (i >= cleanList.length) return fetch(url, init);
          var clean = cleanList[i];
          return fetch(clean + rel, init).then(function (res) {
            if (!res || res.status >= 500) throw new Error('中转返回 ' + (res && res.status));
            return res;
          }).catch(function (e) {
            console.warn('中转失败：' + clean, e && e.message);
            return attempt(i + 1);
          });
        }
        return attempt(0);
      }

      if (JW.lineMode === 'relay') return viaRelay();     // 用户选了只走中转
      if (JW.lineMode === 'direct') return fetch(url, init);  // 用户选了只直连

      // 自动：先直连，超时就自动切中转
      return new Promise(function (resolve) {
        var done = false;
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var merged = init ? Object.assign({}, init) : {};
        if (ctl) merged.signal = ctl.signal;

        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          if (ctl) { try { ctl.abort(); } catch (e) {} }
          console.warn('直连超过 ' + (DIRECT_TIMEOUT / 1000) + ' 秒，自动切换中转');
          JW._directOK = false;
          resolve(viaRelay());
        }, DIRECT_TIMEOUT);

        fetch(url, merged).then(function (res) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          JW._directOK = true;
          resolve(res);
        }).catch(function (e) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          console.warn('直连失败，自动切换中转：', e && e.message);
          JW._directOK = false;
          resolve(viaRelay());
        });
      });
    };
  }
};
JW.storagePublic = JW.url + '/storage/v1/object/public/' + JW.bucket + '/';

(function () {
  /* ---- 连接线路：读用户手动选择；不选就是「自动」 ---- */
  try {
    var lm = localStorage.getItem(JW.LINE_KEY);
    if (lm === 'direct' || lm === 'relay') JW.lineMode = lm;
  } catch (e) {}

  JW.setLine = function (mode) {
    JW.lineMode = (mode === 'direct' || mode === 'relay') ? mode : null;
    try {
      if (JW.lineMode) localStorage.setItem(JW.LINE_KEY, JW.lineMode);
      else localStorage.removeItem(JW.LINE_KEY);
    } catch (e) {}
    return JW.lineMode;
  };
  JW.getLine = function () { return JW.lineMode; };
  JW.proxyList = function () { return JW.proxy.slice(); };

  function newDeviceId() {
    if (window.crypto && window.crypto.randomUUID) return 'gb-' + window.crypto.randomUUID();
    return 'gb-' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  JW.deviceId = localStorage.getItem('jiangwan_gb_device') || '';
  if (!JW.deviceId || JW.deviceId.length < 8 || JW.deviceId.length > 64) {
    JW.deviceId = newDeviceId();
    try { localStorage.setItem('jiangwan_gb_device', JW.deviceId); } catch (e) {}
  }
  function boot() {
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
      JW._settle(new Error('云端组件没加载到（vendor/supabase.js）'));
      return;
    }
    try {
      JW.sb = window.supabase.createClient(JW.url, JW.key, {
        auth: { persistSession: true, autoRefreshToken: true },
        global: JW.proxy && JW.proxy.length ? { fetch: JW.makeFetch() } : undefined
      });
    } catch (e) { JW._settle(e); return; }
    JW.sb.auth.getSession().then(function (r) {
      var u = r && r.data && r.data.session && r.data.session.user;
      if (u && u.id) JW.uid = u.id;
      return null;
    }).catch(function () { return null; })
      .then(function () {
        if (JW.uid) return null;
        return JW.retry(function () {
          return JW.withTimeout(JW.sb.auth.signInAnonymously(), JW.timeoutMs, '登录匿名身份');
        }, 2).then(function (res) {
          if (res && res.error) throw new Error(res.error.message || '匿名登录被拒绝');
          if (res && res.data && res.data.user) JW.uid = res.data.user.id || '';
          return null;
        });
      })
      .then(function () { JW._settle(null); })
      .catch(function (e) { JW._settle(e); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
/* ===== 班级期刊 · 期刊投稿（期刊 → 专区 → 板块 → 文章） ===== */
(function () {
  var PW_SALT = 'jw-salt-2026';

  function isLoggedIn() {
    try {
      var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
      return !!(a && a.username);
    } catch (e) { return false; }
  }
  function needLogin(msg) {
    alert(msg || '登录后才能写作或修改。');
    location.href = './auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search);
  }
  var SECTIONS = [
    { id: 'essay',   name: '散文',       en: 'Prose',  icon: '🖋' },
    { id: 'poem',    name: '诗歌',       en: 'Poetry', icon: '🌾' },
    { id: 'opinion', name: '议论',       en: 'Essay',  icon: '💬' },
    { id: 'news',    name: '班级新闻',   en: 'News',   icon: '📰' },
    { id: 'study',   name: '学习与知识', en: 'Study',  icon: '📚' }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var sb = null, uid = '', deviceId = '', connected = false;
  var issues = [], boards = [], articles = [];
  var curIssue = '', curSection = 'essay';
  var busy = false;

  function status(t, kind) {
    var el = $('status');
    if (!el) return;
    if (!t) { el.hidden = true; el.textContent = ''; return; }
    el.hidden = false; el.className = 'status' + (kind ? ' ' + kind : ''); el.textContent = t;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmt(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sha256(t) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.reject(new Error('浏览器不支持加密接口'));
  }
  function isBadPw(e) { return /bad password/i.test((e && e.message) || ''); }
  function issueName(id) {
    for (var i = 0; i < issues.length; i++) if (issues[i].id === id) return issues[i].name;
    return '';
  }
  function sectionById(id) {
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
    return SECTIONS[0];
  }
  function articleOf(boardId) {
    for (var i = 0; i < articles.length; i++) if (articles[i].board_id === boardId) return articles[i];
    return null;
  }

  /* ---- 渲染 ---- */
  function renderIssues() {
    var box = $('issue-bar'); box.textContent = '';
    var lab = document.createElement('span'); lab.className = 'label'; lab.textContent = '期刊：';
    box.appendChild(lab);
    issues.forEach(function (it) {
      var done = boards.filter(function (b) { return b.issue_id === it.id && articleOf(b.id); }).length;
      var all = boards.filter(function (b) { return b.issue_id === it.id; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'issue-pick' + (it.id === curIssue ? ' on' : '');
      b.innerHTML = esc(it.name) + '<small>' + done + '/' + all + ' 篇</small>';
      b.onclick = function () {
        if (curIssue === it.id) return;
        curIssue = it.id; curSection = 'essay'; hideForm();
        renderIssues(); renderSections(); renderBoards(); renderPanel();
      };
      box.appendChild(b);
    });
    if (window.__journalAdmin) {
      var add = document.createElement('button');
      add.type = 'button'; add.className = 'issue-add'; add.textContent = '＋ 新建期刊';
      add.onclick = newIssue; box.appendChild(add);
    }
  }
  function renderSections() {
    var box = $('section-tabs'); box.textContent = '';
    SECTIONS.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'section-tab' + (s.id === curSection ? ' on' : '');
      b.innerHTML = '<b>' + s.icon + ' ' + esc(s.name) + '</b><small>' + esc(s.en) + '</small>';
      b.onclick = function () {
        if (curSection === s.id) return;
        curSection = s.id; curBoard = ''; hideForm();
        renderSections(); renderBoards(); renderPanel();
      };
      box.appendChild(b);
    });
  }
  var curBoard = '';
  function ensureToolbar() {
    if (document.getElementById('jr-tools')) return;
    var bar = $('section-tabs').parentNode.insertBefore(document.createElement('div'), $('section-tabs'));
    bar.id = 'jr-tools';
    bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin:14px 0';
    bar.innerHTML = '<button class="btn-ghost" id="jr-newboard" type="button">＋ 新建板块</button>'
      + '<button class="btn-ghost" id="jr-refresh" type="button">↻ 刷新</button>';
    document.getElementById('jr-newboard').onclick = function () { newBoard(); };
    document.getElementById('jr-refresh').onclick = function () {
      status('正在刷新……');
      loadAll().then(function () { refresh(); status('已刷新', 'ok'); setTimeout(function () { status(''); }, 1200); })
        .catch(function (e) { status('刷新失败：' + ((e && e.message) || e), 'err'); });
    };
  }

  function renderBoards() {
    var box = $('boards'); box.textContent = '';
    var list = boards.filter(function (b) { return b.issue_id === curIssue && b.section === curSection; });
    if (!list.length) {
      var t = document.createElement('div');
      t.style.cssText = 'color:var(--muted);font-size:.9rem;padding:6px 0';
      t.textContent = (issueName(curIssue) || '本期') + ' 的「' + sectionById(curSection).name + '」还没有板块。';
      box.appendChild(t);
      return;
    }
    list.forEach(function (b) {
      var art = articleOf(b.id);
      var chip = document.createElement('a');
      chip.className = 'board-chip' + (b.id === curBoard ? ' on' : '') + (art ? ' has' : '');
      chip.href = art ? ('article.html?board=' + b.id) : 'javascript:void(0)';
      chip.innerHTML = '<span class="dot"></span>' + esc(b.name);
      if (!art) chip.onclick = function () { curBoard = b.id; renderBoards(); renderPanel(); };
      box.appendChild(chip);
    });
  }
  function renderPanel() {
    var panel = $('panel'); panel.textContent = '';
    if (!issues.length) {
      panel.innerHTML = '<div class="empty">还没有任何期刊。</div>';
      return;
    }
    var list = boards.filter(function (b) { return b.issue_id === curIssue && b.section === curSection; });
    if (!list.length) { panel.innerHTML = '<div class="empty">这个区还没有板块。</div>'; return; }
    if (!curBoard || !list.some(function (b) { return b.id === curBoard; })) curBoard = list[0].id;
    var board = list.filter(function (b) { return b.id === curBoard; })[0];
    var art = articleOf(board.id);
    var box = document.createElement('div');
    box.className = 'card-box';
    box.style.position = 'relative';

    if (art) {
      var h = document.createElement('h3');
      h.style.cssText = 'font-size:1.4rem;margin-bottom:8px';
      h.textContent = art.title;
      var meta = document.createElement('div');
      meta.style.cssText = 'color:var(--muted);font-size:.86rem;margin-bottom:14px';
      meta.textContent = '作者：' + art.author + ' · 发布：' + fmt(art.created_at);
      var preview = document.createElement('div');
      preview.style.cssText = 'white-space:pre-wrap;max-height:340px;overflow:hidden';
      preview.textContent = art.body.slice(0, 400) + (art.body.length > 400 ? '…' : '');
      box.appendChild(h); box.appendChild(meta); box.appendChild(preview);

      var acts = document.createElement('div');
      acts.style.cssText = 'margin-top:16px;display:flex;gap:10px;flex-wrap:wrap';
      var read = document.createElement('a');
      read.className = 'btn btn-main'; read.href = 'article.html?board=' + board.id;
      read.textContent = '阅读全文';
      read.style.cssText = 'display:inline-block;text-decoration:none';
      var edit = document.createElement('button');
      edit.className = 'btn-ghost'; edit.type = 'button'; edit.textContent = '✏️ 修改';
      edit.onclick = function () { openEditor(board, art); };
      var del = document.createElement('button');
      del.className = 'btn-ghost'; del.type = 'button'; del.textContent = '🗑 删掉这篇';
      del.onclick = function () { deleteArticle(board, art); };
      acts.appendChild(read); acts.appendChild(edit); acts.appendChild(del);
      box.appendChild(acts);
    } else {
      var tip = document.createElement('div');
      tip.className = 'empty';
      tip.textContent = '「' + board.name + '」还没有文章。';
      box.appendChild(tip);
      var bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-top:14px';
      var w1 = document.createElement('button');
      w1.className = 'btn-main'; w1.type = 'button'; w1.textContent = '＋ 写这一板块的文章';
      w1.onclick = function () { openEditor(board, null); };
      var d1 = document.createElement('button');
      d1.className = 'btn-ghost'; d1.type = 'button'; d1.textContent = '🗑 删掉这个板块';
      d1.onclick = function () { deleteBoard(board); };
      bar.appendChild(w1); bar.appendChild(d1);
      box.appendChild(bar);
    }
    panel.appendChild(box);
  }

  /* ---------------- 写 / 改 文章 ---------------- */
  function openEditor(board, article) {
    if (!isLoggedIn()) { needLogin('登录后才能写文章或修改文章。'); return; }
    var old = document.getElementById('editor');
    if (old) old.remove();
    var form = document.createElement('div');
    form.id = 'editor';
    form.className = 'card-box';
    form.style.marginBottom = '22px';
    form.innerHTML =
      '<h3 style="font-size:1.15rem;margin-bottom:14px">' + (article ? '修改' : '写') + '「' + esc(board.name) + '」的文章</h3>'
      + '<div style="font-size:.82rem;color:var(--muted);margin-bottom:14px">正文排版：空行分段，一行以「## 」开头是小标题，以「> 」开头是引用。</div>'
      + '<label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px">标题</label>'
      + '<input type="text" id="ed-title" maxlength="60" placeholder="文章标题" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:14px">'
      + '<label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px">作者</label>'
      + '<input type="text" id="ed-author" maxlength="20" placeholder="作者姓名" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:14px">'
      + '<label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px">正文</label>'
      + '<textarea id="ed-body" placeholder="把文章粘到这里……" style="width:100%;min-height:260px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;line-height:1.8;margin-bottom:14px;resize:vertical"></textarea>'
      + '<label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px">管理密码</label>'
      + '<input type="password" id="ed-pw" placeholder="写/改文章需要密码" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:16px">'
      + '<div style="display:flex;gap:10px"><button class="btn-main" id="ed-save" type="button">' + (article ? '保存修改' : '发布文章') + '</button>'
      + '<button class="btn-ghost" id="ed-cancel" type="button">取消</button></div>';

    var panel = $('panel');
    panel.insertBefore(form, panel.firstChild);
    form.scrollIntoView({ block: 'start' });

    $('ed-title').value = article ? article.title : '';
    $('ed-author').value = article ? article.author : (localStorage.getItem('jw_art_author') || '');
    $('ed-body').value = article ? article.body : '';
    $('ed-cancel').onclick = function () { form.remove(); };

    $('ed-save').onclick = function () {
      if (busy) return;
      var t = $('ed-title').value.trim(), a = $('ed-author').value.trim();
      var b = $('ed-body').value.trim(), pw = $('ed-pw').value;
      if (!t) { alert('请填标题'); return; }
      if (!a) { alert('请填作者'); return; }
      if (!b) { alert('正文不能空着'); return; }
      if (!pw.trim()) { alert('请输入管理密码'); return; }
      var save = this;
      busy = true; save.disabled = true; save.textContent = '提交中…';
      status('正在校验密码并提交……');
      sha256(PW_SALT + '|' + pw.trim()).then(function (h) {
        return JW.sb.rpc('save_article', {
          p_board_id: board.id, p_title: t, p_author: a, p_body: b,
          p_cover_path: article ? (article.cover_path || null) : null,
          p_pw_hash: h, p_device_id: deviceId
        });
      }).then(function (r) {
        if (r.error) throw r.error;
        try { localStorage.setItem('jw_art_author', a); } catch (e) {}
        status('已保存 ✅', 'ok');
        form.remove();
        return loadAll().then(refresh);
      }).catch(function (e) {
        status(isBadPw(e) ? '密码不对，没有保存。' : ((e && e.message) || String(e)), 'err');
      }).then(function () { busy = false; save.disabled = false; save.textContent = article ? '保存修改' : '发布文章'; });
    };
  }

  function deleteArticle(board, article) {
    if (!confirm('删掉《' + article.title + '》？不可恢复。')) return;
    var pw = prompt('删除需要管理密码：');
    if (pw === null || !pw.trim()) return;
    status('正在校验密码……');
    sha256(PW_SALT + '|' + pw.trim()).then(function (h) {
      return JW.sb.rpc('delete_article', { p_article_id: article.id, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      if (!o || o.deleted !== true) throw new Error('bad password');
      status('文章已删除，这个板块可以写新的了。', 'ok');
      return loadAll().then(refresh);
    }).catch(function (e) {
      status(isBadPw(e) ? '密码不对，没有删除。' : ((e && e.message) || String(e)), 'err');
    });
  }

  function deleteBoard(board) {
    if (!confirm('删掉板块「' + board.name + '」？里面的文章、评论会一起删掉。')) return;
    var pw = prompt('删除需要管理密码：');
    if (pw === null || !pw.trim()) return;
    status('正在校验密码……');
    sha256(PW_SALT + '|' + pw.trim()).then(function (h) {
      return JW.sb.rpc('delete_board', { p_board_id: board.id, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      if (!o || o.deleted !== true) throw new Error('bad password');
      status('板块已删除。', 'ok');
      if (curBoard === board.id) curBoard = '';
      return loadAll().then(refresh);
    }).catch(function (e) {
      status(isBadPw(e) ? '密码不对，没有删除。' : ((e && e.message) || String(e)), 'err');
    });
  }

  /* ---------------- 新建板块（需要密码） ---------------- */
  function newBoard() {
    if (!isLoggedIn()) { needLogin('登录后才能新建板块。'); return; }
    if (!curIssue) { status('请先新建一期期刊。', 'err'); return; }
    var name = prompt('在「' + issueName(curIssue) + ' · ' + sectionById(curSection).name + '」新建板块\n请输入板块名：');
    if (name === null || !name.trim()) return;
    var pw = prompt('请输入管理密码：');
    if (pw === null || !pw.trim()) return;
    status('正在新建板块……');
    sha256(PW_SALT + '|' + pw.trim()).then(function (h) {
      return JW.sb.rpc('create_board', {
        p_issue_id: curIssue, p_section: curSection, p_name: name.trim(), p_pw_hash: h
      });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      status('板块已新建 ✅', 'ok');
      return loadAll().then(function () {
        if (o && o.id) curBoard = o.id;
        refresh();
      });
    }).catch(function (e) {
      var m = (e && e.message) || String(e);
      status(isBadPw(e) ? '密码不对。' : (/duplicate key/i.test(m) ? '这个区已经有同名板块了。' : m), 'err');
    });
  }

  window.__journalNewBoard = newBoard;

  /* ---- 数据 ---- */
  function loadAll() {
    return JW.sb.from('issues').select('id,name,slug,sort_order').order('sort_order')
      .then(function (r) {
        if (r.error) throw r.error;
        issues = r.data || [];
        if (!curIssue || !issues.some(function (i) { return i.id === curIssue; })) curIssue = issues.length ? issues[0].id : '';
        return JW.sb.from('boards').select('id,issue_id,section,name,sort_order').order('sort_order');
      })
      .then(function (r) {
        if (r.error) throw r.error;
        boards = r.data || [];
        return JW.sb.from('articles').select('id,board_id,title,author,body,cover_path,like_count,created_at').eq('hidden', false).limit(300);
      })
      .then(function (r) {
        if (r.error) throw r.error;
        articles = r.data || [];
      });
  }
  function refresh() { ensureToolbar(); renderIssues(); renderSections(); renderBoards(); renderPanel(); }

  /* ---- 新建期刊（需要密码） ---- */
  function newIssue() {
    var name = prompt('新建一期期刊\n请输入期号名（例如：期刊3）：');
    if (name === null || !name.trim()) return;
    var pw = prompt('请输入管理密码：');
    if (pw === null || !pw.trim()) return;
    status('正在新建期刊……');
    sha256(PW_SALT + '|' + pw.trim())
      .then(function (h) { return JW.sb.rpc('create_issue', { p_name: name.trim(), p_pw_hash: h }); })
      .then(function (r) {
        if (r.error) throw r.error;
        status('期刊已新建 ✅', 'ok');
        return loadAll().then(refresh);
      })
      .catch(function (e) { status(isBadPw(e) ? '密码不对。' : (e.message || e), 'err'); });
  }
  function hideForm() {}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
  function start() {
    JW.whenReady(function (err) {
      if (err) { status('连不上云端：' + (err.message || err), 'err'); return; }
      sb = JW.sb;
      JW.retry(function () { return JW.withTimeout(loadAll(), 20000, '加载期刊'); }, 2)
        .then(function () { connected = true; refresh(); status(''); })
        .catch(function (e) { status('加载失败：' + (e.message || e), 'err'); });
    });
  }
})();

</script>

<script>
SITE.shell('journal');
SITE.footer(document.querySelector('.container'));

</script>
