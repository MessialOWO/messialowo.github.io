/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();


/* 文章加载后更新 SEO 信息（分享出去时标题正确） */
(function () {
  function setMeta(name, val) {
    if (!val) return;
    var m = document.querySelector('meta[name="' + name + '"]');
    if (m) m.setAttribute('content', val);
  }
  function setProp(prop, val) {
    if (!val) return;
    var m = document.querySelector('meta[property="' + prop + '"]');
    if (m) m.setAttribute('content', val);
  }
  window.__jwSetArticleSEO = function (title, author, body) {
    if (!title) return;
    var full = title + ' | 达高中墙Board';
    document.title = full;
    var desc = (body || '').replace(/\s+/g, ' ').trim().slice(0, 110);
    if (desc) {
      setMeta('description', desc);
      setProp('og:description', desc);
      setMeta('twitter:description', desc);
    }
    setProp('og:title', full);
    setMeta('twitter:title', full);
    if (author) {
      setMeta('author', author);
      var m = document.querySelector('meta[property="article:author"]');
      if (!m) {
        m = document.createElement('meta');
        m.setAttribute('property', 'article:author');
        document.head.appendChild(m);
      }
      m.setAttribute('content', author);
    }
  };
})();

    });

  retry: function (fn, times) {

    var run = function () {

         实测：国内直连 Supabase 会被 RST 重置，所以默认直接走中转。
         中转顺序：Cloudflare Pages（额度无限）→ Deno（额度紧张，备用）
         用户可在「用户中心 → 连接线路」里改成只连官方（海外网络适用）。
         所有中转都失败时，最后再试直连兜底。 */
      var cleanList = JW.proxy.map(function (x) { return String(x).replace(/\/$/, ''); });

      function viaRelay() {
        if (!cleanList.length) return fetch(url, init);
        function attempt(i) {
          if (i >= cleanList.length) {
            console.warn('所有中转都失败，最后试直连');
            return fetch(url, init);
          }
          var clean = cleanList[i];
          return fetch(clean + rel, init).then(function (res) {
            if (!res || res.status >= 500) throw new Error('中转返回 ' + (res && res.status));
            return res;
          }).catch(function (e) {
            console.warn('中转失败：' + clean, e && e.message);
            return attempt(i + 1);
          });
        }
        return attempt(0);
      }

      // 用户明确选「只连官方」→ 直连
      if (JW.lineMode === 'direct') return fetch(url, init);

      // 默认 / 「只用中转」→ 走中转
      return viaRelay();
    };
  }
};
/* 图片/音视频的公开地址：国内直连 Supabase 会被重置，所以走中转
   （Cloudflare Pages 带宽无限，图片走它不心疼） */
JW.storagePublic = (JW.proxy && JW.proxy.length ? String(JW.proxy[0]).replace(/\/$/, '') : JW.url)
                 + '/storage/v1/object/public/' + JW.bucket + '/';

(function () {
  /* ---- 连接线路：读用户手动选择；不选就是「自动」 ---- */
  try {
    var lm = localStorage.getItem(JW.LINE_KEY);
    if (lm === 'direct' || lm === 'relay') JW.lineMode = lm;
  } catch (e) {}

  JW.setLine = function (mode) {
    JW.lineMode = (mode === 'direct' || mode === 'relay') ? mode : null;
    try {
      if (JW.lineMode) localStorage.setItem(JW.LINE_KEY, JW.lineMode);
      else localStorage.removeItem(JW.LINE_KEY);
    } catch (e) {}
    return JW.lineMode;
  };
  JW.getLine = function () { return JW.lineMode; };
  JW.proxyList = function () { return JW.proxy.slice(); };

  function newDeviceId() {
    if (window.crypto && window.crypto.randomUUID) return 'gb-' + window.crypto.randomUUID();
    return 'gb-' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  JW.deviceId = localStorage.getItem('jiangwan_gb_device') || '';
  if (!JW.deviceId || JW.deviceId.length < 8 || JW.deviceId.length > 64) {
    JW.deviceId = newDeviceId();
    try { localStorage.setItem('jiangwan_gb_device', JW.deviceId); } catch (e) {}
  }
  function boot() {
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
      JW._settle(new Error('云端组件没加载到（vendor/supabase.js）'));
      return;
    }
    try {
      JW.sb = window.supabase.createClient(JW.url, JW.key, {
        auth: { persistSession: true, autoRefreshToken: true },
        global: JW.proxy && JW.proxy.length ? { fetch: JW.makeFetch() } : undefined
      });
    } catch (e) { JW._settle(e); return; }
    JW.sb.auth.getSession().then(function (r) {
      var u = r && r.data && r.data.session && r.data.session.user;
      if (u && u.id) JW.uid = u.id;
      return null;
    }).catch(function () { return null; })
      .then(function () {
        if (JW.uid) return null;
        return JW.retry(function () {
          return JW.withTimeout(JW.sb.auth.signInAnonymously(), JW.timeoutMs, '登录匿名身份');
        }, 2).then(function (res) {
          if (res && res.error) throw new Error(res.error.message || '匿名登录被拒绝');
          if (res && res.data && res.data.user) JW.uid = res.data.user.id || '';
          return null;
        });
      })
      .then(function () { JW._settle(null); })
      .catch(function (e) { JW._settle(e); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var PW_SALT = 'jw-salt-2026';
  var $ = function (id) { return document.getElementById(id); };
  var boardId = new URLSearchParams(location.search).get('board') || '';
  var sb = null, article = null, board = null, issue = null, comments = [];
  var deviceId = '', busy = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmt(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function status(t) { var el = $('status'); if (!t) { el.hidden = true; return; } el.hidden = false; el.textContent = t; }
  function body(text) {
    var wrap = document.createElement('div');
    wrap.className = 'article-body';
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim(); if (!line) return;
      var el;
      if (line.indexOf('## ') === 0) { el = document.createElement('h2'); el.textContent = line.slice(3); }
      else if (line.indexOf('> ') === 0) { el = document.createElement('blockquote'); el.textContent = line.slice(2); }
      else { el = document.createElement('p'); el.textContent = line; }
      wrap.appendChild(el);
    });
    return wrap;
  }
  function coverUrl(p) {
    if (typeof p !== 'string' || !/^[A-Za-z0-9-]{1,64}\/[A-Za-z0-9._-]{1,80}$/.test(p)) return '';
    return JW.storagePublic + p;
  }

  function render() {
    var host = $('article'); host.textContent = '';
    if (!article) {
      host.innerHTML = '<div class="empty">找不到这篇文章。可能链接不对，或者文章已被删除。<br><br><a href="./journal.html">← 回到期刊投稿</a></div>';
      return;
    }
    document.title = article.title + ' | 班级期刊';

    var h = document.createElement('h1');
    h.className = 'article-title'; h.textContent = article.title;
    var meta = document.createElement('div');
    meta.className = 'article-meta';
    [ '作者：' + article.author, '发布：' + fmt(article.created_at),
      issue ? ('期刊：' + issue.name) : '', board ? ('板块：' + board.name) : '' ]
      .filter(Boolean).forEach(function (t) { var s = document.createElement('span'); s.textContent = t; meta.appendChild(s); });

    var card = document.createElement('div');
    card.className = 'card-box';
    card.appendChild(h); card.appendChild(meta);

    var cov = coverUrl(article.cover_path);
    if (cov) { var img = document.createElement('img'); img.className = 'article-cover'; img.src = cov; img.alt = article.title; card.appendChild(img); }
    card.appendChild(body(article.body));

    var acts = document.createElement('div');
    acts.className = 'actions';
    var like = document.createElement('button');
    like.className = 'action-btn'; like.textContent = '👍 赞 ' + (article.like_count || 0);
    like.onclick = function () {
      if (busy) return; busy = true;
      JW.sb.rpc('like_article', { p_article_id: article.id, p_device_id: deviceId }).then(function (r) {
        if (r.error) throw r.error;
        var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
        if (o) { like.textContent = '👍 赞 ' + o.like_count; like.className = 'action-btn' + (o.liked ? ' liked' : ''); }
      }).catch(function (e) { alert('点赞失败：' + (e.message || e)); }).then(function () { busy = false; });
    };
    var back = document.createElement('a');
    back.className = 'action-btn'; back.href = './journal.html'; back.textContent = '← 返回期刊';
    back.style.textDecoration = 'none'; back.style.display = 'inline-block';
    acts.appendChild(like); acts.appendChild(back);
    card.appendChild(acts);

    // 评论
    var cm = document.createElement('div');
    cm.className = 'comments';
    var h4 = document.createElement('h4'); h4.textContent = '评论 ' + comments.length; cm.appendChild(h4);
    comments.forEach(function (c) {
      var item = document.createElement('div'); item.className = 'comment';
      item.innerHTML = '<div class="comment-head"><span class="comment-name">' + esc(c.name) + '</span>'
        + '<span class="comment-time">' + fmt(c.created_at) + '</span></div>'
        + '<div class="comment-body">' + esc(c.content) + '</div>';
      cm.appendChild(item);
    });
    var form = document.createElement('div'); form.className = 'comment-form';
    form.innerHTML = '<input type="text" id="c-name" maxlength="20" placeholder="你的名字">'
      + '<input type="text" id="c-text" class="grow" maxlength="500" placeholder="写点评论……">'
      + '<button class="btn-main" id="c-send" type="button">发表</button>';
    cm.appendChild(form);
    card.appendChild(cm);
    host.appendChild(card);

    $('c-send').onclick = function () {
      var n = $('c-name').value.trim(), t = $('c-text').value.trim();
      if (!n) return alert('请填名字');
      if (!t) return alert('评论不能为空');
      if (busy) return; busy = true;
      JW.sb.from('article_comments').insert({ article_id: article.id, device_id: deviceId, name: n.slice(0,20), content: t.slice(0,500) })
        .then(function (r) { if (r.error) throw r.error; status('评论已发布 ✅'); setTimeout(function(){status('');},2000); return loadComments(); })
        .then(function () { render(); })
        .catch(function (e) { status('评论失败：' + (e.message || e)); })
        .then(function () { busy = false; });
    };
    status('');
  }

  function loadComments() {
    if (!article) { comments = []; return Promise.resolve(); }
    return JW.sb.from('article_comments').select('id,created_at,name,content')
      .eq('article_id', article.id).eq('hidden', false)
      .order('created_at', { ascending: true }).limit(200)
      .then(function (r) { if (!r.error) comments = r.data || []; });
  }

  function load() {
    if (!boardId) { render(); return Promise.resolve(); }
    return JW.sb.from('boards').select('id,issue_id,section,name').eq('id', boardId).limit(1)
      .then(function (r) { if (r.error) throw r.error; board = (r.data || [])[0] || null; return null; })
      .then(function () {
        if (!board) throw new Error('板块不存在');
        return JW.sb.from('articles').select('id,board_id,title,author,body,cover_path,like_count,created_at,hidden').eq('board_id', boardId).limit(1);
      })
      .then(function (r) {
        if (r.error) throw r.error;
        article = (r.data || [])[0] || null;
        return JW.sb.from('issues').select('id,name').eq('id', board.issue_id).limit(1);
      })
      .then(function (r) { if (!r.error) issue = (r.data || [])[0] || null; return loadComments(); });
  }

  JW.whenReady(function (err) {
    if (err) { status('连不上云端：' + (err.message || err)); return; }
    sb = JW.sb; deviceId = JW.deviceId;
    JW.retry(function () { return JW.withTimeout(load(), 20000, '加载文章'); }, 2)
      .then(render)
      .catch(function (e) { status('加载失败：' + (e.message || e)); render(); });
  });
})();
</script>
<script>
SITE.shell('journal'); SITE.footer(document.querySelector('.container'));
</script>
</body>
