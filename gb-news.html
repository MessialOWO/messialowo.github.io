<style>
  .avatar-circle { display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; overflow:hidden; flex-shrink:0; line-height:1; user-select:none; }
  .avatar-circle.big { width:40px; height:40px; font-size:1.2rem; }
  .avatar-circle.small { width:26px; height:26px; font-size:.88rem; }
  .avatar-circle img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
  #avatar-preview { width:64px; height:64px; border-radius:50%; background:#f0f0f0; display:flex; align-items:center; justify-content:center; overflow:hidden; border:2px solid var(--border); flex-shrink:0; }
  #avatar-preview .avatar-circle, #avatar-preview .avatar-circle img { width:64px; height:64px; }
  .emoji-pick { width:44px; height:44px; font-size:1.3rem; border-radius:50%; border:2px solid var(--glass-brd); background:rgba(255,255,255,.6); cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; }
  .emoji-pick.on { border-color:var(--accent); background:var(--accent-light); }
  .color-pick { width:36px; height:36px; border-radius:50%; cursor:pointer; padding:0; border:2px solid transparent; box-shadow:0 0 0 1px var(--border) inset; }
  .color-pick.on { border-color:#2c2c2c; }
  /* 分区：横向可滑动的一排 */
  .gb-scroll {
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; -ms-overflow-style: none;
    margin-bottom: 8px;
    /* 左右留一点阴影提示"还能滑" */
    mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
  }
  .gb-scroll::-webkit-scrollbar { display: none; height: 0; }
  .gb-sections, .gb-subs {
    display: flex; flex-wrap: nowrap; gap: 6px;
    align-items: center; padding: 2px 12px; min-width: min-content;
  }
  .gb-subs:empty { display: none; }
  .gb-scroll-sub:empty { display: none; }
  .gb-sort { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:12px 0 14px; }
  .gb-sort .gb-sec-chip { font-size:.76rem; padding:4px 10px; }
  .gb-sort-label { font-size:.85rem; color:var(--muted); }
  .gb-sort-tip { font-size:.78rem; color:var(--muted); margin-left:4px; }
  .gb-fold-bar { margin-top:8px; }
  .gb-fold-btn { font-family:inherit; font-size:.85rem; cursor:pointer; padding:6px 14px; border-radius:16px; border:1px dashed var(--accent); background:none; color:var(--accent); }
  .gb-fold-btn:hover { background:var(--accent-light); }
  .gb-sub-replies { margin-top:8px; padding-left:12px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .gb-sub-reply { background:rgba(255,255,255,.55); border-radius:8px; padding:7px 9px; font-size:.78rem; }
  .gb-sub-reply .gb-reply-content { margin-top:2px; }
  .gb-sub-more { font-family:inherit; font-size:.78rem; color:var(--accent); background:none; border:none; border-bottom:1px dashed rgba(192,57,43,.4); cursor:pointer; padding:2px 0; text-align:left; align-self:flex-start; }
  .gb-flash { animation: gbflash 2.4s ease; }
  @keyframes gbflash { 0%,100% { box-shadow:0 6px 18px rgba(31,27,22,.06); } 25%,75% { box-shadow:0 0 0 4px rgba(192,57,43,.35); } }
  .gb-sec-chip {
    font-family: inherit; font-size: .8rem; cursor: pointer;
    padding: 5px 11px; border: 1px solid var(--glass-brd); border-radius: 16px;
    background: rgba(255,255,255,.6); color: var(--text);
    box-shadow: 0 1px 5px rgba(31,27,22,.05); text-decoration: none;
    flex: 0 0 auto; white-space: nowrap; line-height: 1.35;
  }
  .gb-subs .gb-sec-chip { font-size: .74rem; padding: 3px 9px; border-radius: 13px; }
  .gb-search-chip { padding: 5px 10px; }
  .gb-sec-chip:hover { background:rgba(255,255,255,.85); transform:translateY(-1px); }
  .gb-sec-chip.on { background:linear-gradient(160deg,#c0392b,#962820) !important; color:#fff !important; font-weight:700; }
  .gb-sec-chip.add { border-style:dashed; color:var(--accent); }
  .gb-sec-chip.del { border-color:#e0b4b0; color:var(--accent); }
  .gb-sec-tag { font-size:.66rem; color:var(--muted); background:rgba(0,0,0,.05); padding:1px 7px; border-radius:8px; }
  .gb-tag { color:var(--accent); text-decoration:none; border-bottom:1px dashed rgba(192,57,43,.4); }
  .gb-tag:hover { background:var(--accent-light); }
  /* ===== 底部发帖条 ===== */
  .gb-composer-trigger {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.82);
    border-top: 1px solid var(--glass-brd);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    backdrop-filter: blur(14px) saturate(170%);
    box-shadow: 0 -4px 18px rgba(31,27,22,.07);
  }
  .gb-trigger-avatar { width: 34px; height: 34px; flex-shrink: 0; }
  .gb-trigger-avatar .avatar-circle { width: 34px !important; height: 34px !important; font-size: 1rem !important; }
  .gb-trigger-fake {
    flex: 1; min-width: 0; text-align: left; cursor: text;
    padding: 9px 14px; border-radius: 18px;
    background: rgba(0,0,0,.045); border: 1px solid var(--border);
    color: var(--muted); font-family: inherit; font-size: .9rem;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

  .gb-composer { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
  .gb-composer[hidden] { display: none; }
  .gb-composer-mask { position: absolute; inset: 0; background: rgba(20,16,14,.42); }
  .gb-composer-inner {
    position: relative; background: #fffdfb;
    border-radius: 18px 18px 0 0;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(31,27,22,.18);
    animation: gbUp .22s ease;
  }
  @keyframes gbUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .gb-composer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 10px; font-size: .85rem; color: var(--muted);
    position: sticky; top: 0; background: #fffdfb; z-index: 2;
  }
  .gb-composer-head b { color: var(--accent); }
  .gb-composer-close {
    width: 30px; height: 30px; border-radius: 50%; padding: 0;
    border: 1px solid var(--border); background: rgba(0,0,0,.03);
    color: var(--muted); font-size: .9rem; cursor: pointer; line-height: 1;
  }
  .gb-composer-input {
    width: 100%; min-height: 90px; max-height: 40vh; resize: none;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    font-family: inherit; font-size: 1rem; line-height: 1.7;
    background: rgba(255,255,255,.9); color: var(--text); box-sizing: border-box;
  }
  .gb-composer-input:focus { outline: none; border-color: rgba(192,57,43,.5); }
  .gb-composer-bar {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap;
  }
  .gb-file-btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 14px; border-radius: 18px; white-space: nowrap;
    border: 1px solid var(--glass-brd); background: rgba(255,255,255,.75);
    font-size: .86rem; color: var(--text);
  }
  .gb-file-btn span { color: var(--accent); font-weight: 700; font-size: 1.05rem; line-height: 1; }
  .gb-file-hint { font-size: .76rem; color: var(--muted); flex: 1; min-width: 0; }
  .gb-send-btn {
    padding: 9px 22px; border-radius: 18px; border: none; cursor: pointer;
    background: linear-gradient(160deg, #c0392b, #962820);
    color: #fff; font-family: inherit; font-size: .9rem; font-weight: 700;
    white-space: nowrap;
  }
  .gb-send-btn:disabled { opacity: .55; }

  .gb-attach-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .gb-attach {
    position: relative; width: 92px; height: 92px; border-radius: 10px;
    overflow: hidden; border: 1px solid var(--border); background: #f2f0ec;
    display: flex; align-items: center; justify-content: center;
  }
  .gb-attach img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gb-attach .gb-attach-icon { font-size: 1.7rem; }
  .gb-attach .gb-attach-ext {
    position: absolute; bottom: 4px; left: 4px; right: 4px;
    font-size: .62rem; text-align: center; color: #fff;
    background: rgba(0,0,0,.5); border-radius: 4px; padding: 1px 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .gb-attach button {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
    border-radius: 50%; border: none; padding: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: .7rem;
    line-height: 1; cursor: pointer;
  }

  /* 消息里显示的音视频 */
  .gb-media-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .gb-media-list audio { width: 100%; max-width: 360px; height: 38px; }
  .gb-media-list video { width: 100%; max-width: 420px; max-height: 320px; border-radius: 10px; background: #000; }
  .gb-media-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 10px; text-decoration: none;
    background: rgba(0,0,0,.045); border: 1px solid var(--border);
    color: var(--text); font-size: .84rem; max-width: 100%;
  }
  .gb-media-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 给底部栏留空间，避免挡住最后一条 */
  .container { padding-bottom: 96px !important; }

  .gb-loading {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 44px 20px; color: var(--muted); font-size: .88rem;
  }
  @media (max-width: 860px) { .gb-composer-trigger { left: 0; } }
  .gb-spin {
    width: 17px; height: 17px; border-radius: 50%;
    border: 2px solid rgba(192,57,43,.2);
    border-top-color: var(--accent);
    animation: gbspin .7s linear infinite;
    display: inline-block; flex-shrink: 0;
  }
  @keyframes gbspin { to { transform: rotate(360deg); } }

  .gb-item { display:flex; gap:14px; background:rgba(255,255,255,.55); border:1px solid var(--glass-brd); border-radius:14px; padding:15px 16px; margin-bottom:12px; position:relative; }
  .gb-item.pinned { border-left:5px solid var(--accent); background:#fffdfb; }
  .gb-body { flex:1; min-width:0; }
  .gb-header { display:flex; align-items:baseline; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
  .gb-name { font-weight:700; overflow-wrap:anywhere; font-size:.88rem; }
  .gb-time { font-size:.72rem; color:var(--muted); }
  .gb-pin-badge { background:var(--accent); color:#fff; font-size:.72rem; padding:2px 8px; border-radius:10px; font-weight:700; }
  .gb-content { white-space:pre-wrap; word-break:break-word; font-size:.88rem; line-height:1.75; }
  .gb-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .gb-action-btn { background:none; border:1px solid transparent; padding:4px 9px; cursor:pointer; color:var(--muted); font-size:1rem; font-family:inherit; border-radius:8px; }
  .gb-action-btn:hover { background:var(--accent-light); color:var(--accent); }
  .gb-action-btn.liked { color:var(--accent); background:var(--accent-light); }
  .gb-action-btn.danger { border-color:#e0b4b0; color:var(--accent); }
  .gb-action-btn.pinned-on { background:var(--accent-light); border-color:var(--accent); }
  .gb-replies { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:flex; flex-direction:column; gap:8px; }
  .gb-reply { display:flex; gap:10px; align-items:flex-start; background:rgba(255,255,255,.6); border-radius:8px; padding:10px 12px; }
  .gb-reply-body { flex:1; min-width:0; font-size:.82rem; }
  .gb-reply-name { font-weight:600; margin-right:8px; }
  .gb-reply-to { font-size:.78rem; color:var(--accent); background:var(--accent-light); padding:1px 7px; border-radius:8px; margin-left:8px; }
  .gb-reply-time { font-size:.75rem; color:var(--muted); }
  .gb-reply-content { white-space:pre-wrap; word-break:break-word; margin-top:3px; font-size:.82rem; line-height:1.65; }
  .gb-reply-actions { margin-top:4px; display:flex; gap:6px; }
  .gb-reply-actions .gb-action-btn { padding:2px 8px; font-size:.9rem; }
  .reply-form { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .reply-form input { flex:1 1 140px; min-width:0; padding:9px 12px; border:1px solid var(--glass-brd); border-radius:8px; font-family:inherit; font-size:16px; background:rgba(255,255,255,.75); color:var(--text); }
  .gb-msg-images { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .gb-msg-images img { width:104px; height:104px; object-fit:cover; border-radius:8px; cursor:zoom-in; border:1px solid var(--border); }
  .gb-pick-thumb { position:relative; }
  .gb-pick-thumb img { width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; }
  .gb-pick-thumb button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:.75rem; line-height:1; padding:0; }
  .gb-notice { position:relative; background:rgba(255,250,235,.85); border:1px solid #f0dcae; border-left:5px solid #e6b800; border-radius:12px; padding:16px 44px 14px 18px; margin-bottom:18px; font-size:.9rem; line-height:1.85; }
  .gb-notice[hidden] { display:none; }
  .gb-notice-t { font-weight:700; color:#8a6d1a; margin-bottom:8px; letter-spacing:1px; }
  .gb-notice p { margin:0 0 4px; color:#6b5a22; }
  .gb-notice-x { position:absolute; top:8px; right:10px; width:28px; height:28px; padding:0; border-radius:50%; background:none; border:1px solid transparent; color:#9a8a55; font-size:.95rem; line-height:1; cursor:pointer; }
  .lb { position:fixed; inset:0; z-index:999; background:rgba(24,20,18,.86); display:flex; flex-direction:column; }
  .lb[hidden] { display:none; }
  .lb-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; color:#f2efe9; flex-wrap:wrap; }
  .lb-btns { display:flex; gap:8px; }
  .lb-stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 12px 16px; overflow:auto; }
  .lb-stage img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
</style>

/* ===== 班级期刊 · 全站共享脚本（侧边栏 + 云端连接） ===== */
var SITE = {
  name: '达高中墙Board',
  school: '达州市高级中学',
  pages: [
    { href: './',                  label: '首页',       en: 'Home',      key: 'home' },
    { href: './gallery.html',      label: '画廊',       en: 'Gallery',   key: 'gallery' },
    { href: './guestbook.html',    label: '留言板',     en: 'Guestbook', key: 'guestbook' },
    { href: './journal.html',      label: '期刊投稿',   en: 'Journal',   key: 'journal' }
  ],
  /* 「用户中心」折叠组 */
  userPages: [
    { href: './auth.html',          label: '登录 / 注册', en: 'Sign in',  key: 'auth' },
    { href: './user.html#fold-msg',      label: '消息中心', en: 'Messages', key: 'user' },
    { href: './user.html#fold-settings', label: '账户设置', en: 'Settings', key: 'user-settings' },
    { href: './user.html#fold-bg',       label: '背景',     en: 'Theme',    key: 'user-bg' }
  ],
  /* 「关于」折叠组 */
  aboutPages: [
    { href: './about-school.html', label: '关于学校',   en: 'About School', key: 'school' },
    { href: './about-site.html',   label: '关于本站',   en: 'About Site',   key: 'site' },
    { href: './changelog.html',    label: '更新日志',   en: 'Changelog',    key: 'changelog' }
  ]
};

/* 是否已登录 */

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

  function fmt(ts) { var d=new Date(ts); if(isNaN(d))return ''; var p=function(n){return n<10?'0'+n:''+n}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
  function secName(id) { for (var i=0;i<subs.length;i++) if (subs[i].id===id) return subs[i].name; return ''; }
  function sha(t) {
    if (window.crypto && crypto.subtle) return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
    });
    return Promise.reject(new Error('浏览器不支持加密'));
  }
  function badPw(e){ return /bad password/i.test((e&&e.message)||''); }
  function avatarUrl(p){ if(typeof p!=='string'||!/^[A-Za-z0-9-]{1,64}\/[A-Za-z0-9._-]{1,80}$/.test(p))return ''; return (window.JW&&JW.storagePublic||'')+p; }

  /* ---------- 标签解析：从正文里抓 #标签 ---------- */
  // 规则：# 后面跟字母/数字/汉字，最长 12 个字符，中间不能有空格
  function parseTags(text) {
    var out = [], re = /#([A-Za-z0-9_\u4e00-\u9fff]{1,12})/g, m;
    while ((m = re.exec(text || '')) !== null) {
      if (out.indexOf(m[1]) < 0) out.push(m[1]);
      if (out.length >= 5) break;
    }
    return out;
  }
  // 渲染正文：把 #标签 变成可点击
  function renderContent(host, text) {
    host.textContent = '';
    var re = /#([A-Za-z0-9_\u4e00-\u9fff]{1,12})/g;
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) host.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');
      a.href = './search.html?tag=' + encodeURIComponent(m[1]);
      a.className = 'gb-tag';
      a.textContent = '#' + m[1];
      host.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) host.appendChild(document.createTextNode(text.slice(last)));
  }

  /* ---------- 渲染 ---------- */
  function renderSortBar() {
    var box = $('gb-sort');
    if (!box) return;
    box.textContent = '';
    var opts = [['default','默认'],['time','时间'],['hot','热度']];
    var lab = document.createElement('span');
    lab.className = 'gb-sort-label';
    lab.textContent = '排序：';
    box.appendChild(lab);
    opts.forEach(function (o) {

      b.className = 'gb-sec-chip' + (sortMode === o[0] ? ' on' : '');
      b.textContent = o[1];
      b.onclick = function () {
        if (sortMode === o[0]) return;
        sortMode = o[0];
        var exp = expandedPost; expandedPost = ''; openSubReply = '';
        renderSortBar(); render();
        if (exp) setTimeout(function(){ scrollToEl(document.getElementById('p-'+exp)); }, 60);
      };
      box.appendChild(b);
    });
    var tip = document.createElement('span');
    tip.className = 'gb-sort-tip';
    tip.textContent = sortMode === 'default' ? '置顶在最上面' : '置顶不再排到最前（仍带📌标签）';

  }

  function renderSubBar() {
    var box = $('gb-subs');
    if (!box) return;
    box.textContent = '';
    var list = subs.filter(function (x) { return x.main_section === curMain; });
    if (!curMain) return;          // 只有大分区页才有小分区栏

    if (!list.length) {
      var hint = document.createElement('span');
      hint.style.cssText = 'font-size:.78rem;color:var(--muted);align-self:center;white-space:nowrap';
      hint.textContent = '还没有小分区，先建一个：';
      box.appendChild(hint);
    }
    // 只有一个小分区时不需要「全部」
    if (curSub && list.length > 1) {
      var all = document.createElement('button');
      all.type = 'button'; all.className = 'gb-sec-chip';
      all.textContent = '全部';
      all.onclick = function () { curSub = ''; renderSubBar(); render(); scrollChipIntoView(all); };
      box.appendChild(all);
    }
    list.forEach(function (sec) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'gb-sec-chip' + (curSub === sec.id ? ' on' : '');
      var n = messages.filter(function (m) { return m.sub_section_id === sec.id; }).length;
      b.textContent = sec.name + (n ? ' ' + n : '');
      // 点小分区就是选中它，不做"再点取消"（否则会跳回"全部"，看起来像丢了分区）
      b.onclick = function () {
        if (curSub === sec.id) return;
        curSub = sec.id;
        renderSubBar(); render();
        scrollChipIntoView(b);
      };
      box.appendChild(b);
    });
    // 「未分类」是每个大分区的固定小分区，不允许删除
    var curObj = null;
    for (var ci = 0; ci < list.length; ci++) if (list[ci].id === curSub) curObj = list[ci];
    var isFixed = curObj && /(未分组|未分类|未归类|默认)$/.test(btrimName(curObj.name));
    if (curSub && !isFixed) {
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'gb-sec-chip del'; del.textContent = '🗑 删除';
      del.onclick = function () { deleteSub(curSub); };
      box.appendChild(del);
    } else if (isFixed) {
      var fix = document.createElement('span');
      fix.style.cssText = 'font-size:.72rem;color:var(--muted);align-self:center;white-space:nowrap';
      fix.textContent = '默认分区';
      box.appendChild(fix);
    }
    var add = document.createElement('button');
    add.type = 'button'; add.className = 'gb-sec-chip add'; add.textContent = '＋ 新建';
    add.onclick = newSub;
    box.appendChild(add);
  }

  /* 加载中的占位 */
  function showLoading(text) {
    var listEl = $('gb-list');
    if (!listEl) return;
    listEl.textContent = '';
    var box = document.createElement('div');
    box.className = 'gb-loading';
    box.innerHTML = '<span class="gb-spin"></span><span>' + (text || '正在加载留言……') + '</span>';
    listEl.appendChild(box);
  }

  function render() {
    renderSortBar();
    var listEl = $('gb-list');
    if (!listEl) return;
    listEl.textContent = '';
    var show = messages.filter(function (m) {
      if (curMain && m.main_section !== curMain) return false;
      if (curSub && m.sub_section_id !== curSub) return false;
      return true;
    });
    // 排序
    if (sortMode === 'time') {
      show = show.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    } else if (sortMode === 'hot') {
      show = show.slice().sort(function (a, b) {
        var d = (b.like_count || 0) - (a.like_count || 0);
        return d !== 0 ? d : (new Date(b.created_at) - new Date(a.created_at));
      });
    } else {
      // 默认：置顶的单独提到最前面，其余按时间倒序
      var pinned = show.filter(function (m) { return m.is_pinned; });
      var rest = show.filter(function (m) { return !m.is_pinned; });
      pinned.sort(function (a, b) { return new Date(b.pinned_at || b.created_at) - new Date(a.pinned_at || a.created_at); });
      rest.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      show = pinned.concat(rest);
    }
    if (!show.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      if (!connected) { showLoading(); return; }
      e.textContent = curSub ? '这个小分区还没有帖子，你可以发第一条。' : '这里还没有帖子。';
      listEl.appendChild(e);
      return;
    }
    show.forEach(function (m) { listEl.appendChild(postEl(m)); });
  }

  function postEl(msg) {
    var item = document.createElement('div');
    item.className = 'gb-item' + (msg.is_pinned ? ' pinned' : '');
    item.id = 'p-' + msg.id;                      // 供搜索页跳转定位
    item.appendChild(avatarNode(msg.avatar_color, msg.avatar_emoji, msg.avatar_path, 'big'));

    var body = document.createElement('div');
    body.className = 'gb-body';

    var head = document.createElement('div');
    head.className = 'gb-header';
    if (msg.is_pinned) {
      var pin = document.createElement('span'); pin.className = 'gb-pin-badge'; pin.textContent = '📌 置顶'; head.appendChild(pin);
    }
    var nm = document.createElement('span'); nm.className = 'gb-name'; nm.textContent = msg.name; head.appendChild(nm);
    var tm = document.createElement('span'); tm.className = 'gb-time'; tm.textContent = fmt(msg.created_at); head.appendChild(tm);
    var tag = document.createElement('span'); tag.className = 'gb-sec-tag';
    tag.textContent = (msg.main_section || '未分区') + (msg.sub_section_id && secName(msg.sub_section_id) ? ' · ' + secName(msg.sub_section_id) : '');
    head.appendChild(tag);

    var ct = document.createElement('div'); ct.className = 'gb-content';
    renderContent(ct, msg.content);

    body.appendChild(head); body.appendChild(ct);
    renderImages(body, msg);
    body.appendChild(actionsEl(msg, body));

  function avatarNode(color, emoji, path, size) {
    var el = document.createElement('div');
    el.className = 'avatar-circle ' + (size === 'small' ? 'small' : 'big');
    var url = avatarUrl(path);
    if (url) {
      var im = document.createElement('img'); im.src = url; im.alt = ''; im.loading = 'lazy';
      im.onerror = function () { el.textContent = emoji || '🙂'; el.style.background = color || COLORS[0]; };
      el.style.background = '#f0f0f0'; el.appendChild(im);
    } else {
      el.style.background = /^#[0-9a-fA-F]{6}$/.test(color || '') ? color : COLORS[0];
      el.textContent = emoji || '🙂';
    }
    return el;
  }

  function renderImages(host, msg) {
    var list = msgImages[msg.id] || [];
    if (!list.length) return;

    var imgs = [], others = [];
    list.forEach(function (it) {
      var url = avatarUrl(it.image_path);
      if (!url) return;
      it._url = url;
      if ((it.media_type || 'image') === 'image') imgs.push(it);
      else others.push(it);
    });

    // 图片：缩略图网格
    if (imgs.length) {
      var box = document.createElement('div');
      box.className = 'gb-msg-images';
      imgs.forEach(function (it) {
        var el = document.createElement('img');
        el.src = it._url; el.loading = 'lazy'; el.alt = '图片';
        el.onclick = function () {
          if (window.__jwOpenImage) window.__jwOpenImage(it._url, '图片');
          else window.open(it._url, '_blank');
        };
        box.appendChild(el);
      });
      host.appendChild(box);
    }

    // 音频 / 视频 / 其它
    if (others.length) {
      var wrap = document.createElement('div');
      wrap.className = 'gb-media-list';
      others.forEach(function (it) {
        if (it.media_type === 'audio') {
          var au = document.createElement('audio');
          au.controls = true; au.preload = 'metadata'; au.src = it._url;
          wrap.appendChild(au);
        } else if (it.media_type === 'video') {
          var vd = document.createElement('video');
          vd.controls = true; vd.preload = 'metadata'; vd.src = it._url;
          vd.setAttribute('playsinline', '');
          wrap.appendChild(vd);
        } else {
          var a = document.createElement('a');
          a.className = 'gb-media-chip'; a.href = it._url; a.target = '_blank'; a.rel = 'noopener';
          var ic = document.createElement('b');
          ic.textContent = '📎';
          var nm = document.createElement('span');
          nm.textContent = it.file_name || '附件';
          a.appendChild(ic); a.appendChild(nm);
          wrap.appendChild(a);
        }
      });
      host.appendChild(wrap);
    }
  }

  function actionsEl(msg, host) {
    var acts = document.createElement('div'); acts.className = 'gb-actions';
    var liked = !!likedSet[msg.id];
    var like = document.createElement('button');
    like.type = 'button'; like.className = 'gb-action-btn' + (liked ? ' liked' : '');
    like.textContent = '👍 ' + (msg.like_count || 0); like.title = '点赞';
    like.onclick = function () {
      if (busy || !connected) return; busy = true;
      sb.rpc('like_message', { p_message_id: msg.id, p_device_id: deviceId }).then(function (r) {
        if (r.error) throw r.error;
        var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
        if (o) { msg.like_count = o.like_count; if (o.liked) likedSet[msg.id]=true; else delete likedSet[msg.id];
                 like.className = 'gb-action-btn' + (o.liked ? ' liked' : ''); like.textContent = '👍 ' + o.like_count; }
      }).catch(function (e) { status('点赞失败：' + ((e&&e.message)||e), 'err'); }).then(function(){ busy=false; });
    };
    var rep = document.createElement('button');
    rep.type = 'button'; rep.className = 'gb-action-btn';
    var n = (repliesByMsg[msg.id] || []).length;
    rep.textContent = '💬' + (n ? ' ' + n : ''); rep.title = '回复';
    rep.onclick = function () { openReply(msg, null, host); };
    var cp = document.createElement('button');
    cp.type = 'button'; cp.className = 'gb-action-btn'; cp.textContent = '📋'; cp.title = '复制内容';
    cp.onclick = function () { if (navigator.clipboard) navigator.clipboard.writeText(msg.content); else prompt('复制：', msg.content); };
    var pin = document.createElement('button');
    pin.type = 'button'; pin.className = 'gb-action-btn' + (msg.is_pinned ? ' pinned-on' : '');
    pin.textContent = '📌'; pin.title = msg.is_pinned ? '取消置顶' : '置顶';
    pin.onclick = function () { togglePin(msg); };
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'gb-action-btn danger'; del.textContent = '🗑'; del.title = '删除';
    del.onclick = function () { deleteMessage(msg); };
    acts.appendChild(like); acts.appendChild(rep); acts.appendChild(cp); acts.appendChild(pin); acts.appendChild(del);
    return acts;
  }

  function renderReplies(host, msg) {
    var list = repliesByMsg[msg.id] || [];
    if (!list.length) return;

    var isExpanded = (expandedPost === msg.id);
    var box = document.createElement('div');
    box.className = 'gb-replies';

    // 要显示哪几条
    var shown = isExpanded ? list : list.slice(0, REPLY_FOLD);

    shown.forEach(function (r, idx) {
      // 展开状态下：每条回评本来也带自己的"回评"？这里用嵌套深度控制：
      // 列表里第 4 条及以后在折叠时根本不显示；展开后全显示
      box.appendChild(replyEl(msg, r, host, isExpanded));
    });

    // 折叠/展开按钮
    if (list.length > REPLY_FOLD || isExpanded) {
      var bar = document.createElement('div');
      bar.className = 'gb-fold-bar';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gb-fold-btn';
      if (!isExpanded) {
        btn.textContent = '展开全部 ' + list.length + ' 条评论 ▾';
      } else {
        btn.textContent = '收起评论 ▴';
      }
      btn.onclick = function () {
        // 只允许一个帖子处于展开状态，其他自动收回
        expandedPost = isExpanded ? '' : msg.id;
        openSubReply = '';
        render();
        scrollToEl(document.getElementById('p-' + msg.id));
      };
      bar.appendChild(btn);
      box.appendChild(bar);
    }
    host.appendChild(box);
  }

  /* 单条回复（可带"回评折叠"：展开后才有子回复） */
  function replyEl(msg, r, host, showSubReplies) {
    var el = document.createElement('div'); el.className = 'gb-reply';
    el.appendChild(avatarNode(r.avatar_color, r.avatar_emoji, r.avatar_path, 'small'));
    var b = document.createElement('div'); b.className = 'gb-reply-body';
    var h = document.createElement('div');
    var n = document.createElement('span'); n.className = 'gb-reply-name'; n.textContent = r.name; h.appendChild(n);
    if (r.reply_to_name) { var to = document.createElement('span'); to.className = 'gb-reply-to'; to.textContent = '回复 ' + r.reply_to_name; h.appendChild(to); }
    var t = document.createElement('span'); t.className = 'gb-reply-time'; t.textContent = fmt(r.created_at); h.appendChild(t);
    var c = document.createElement('div'); c.className = 'gb-reply-content';
    renderContent(c, r.content);
    b.appendChild(h); b.appendChild(c);

    var ra = document.createElement('div'); ra.className = 'gb-reply-actions';
    var rb = document.createElement('button'); rb.type='button'; rb.className='gb-action-btn'; rb.textContent='↩'; rb.title='回复';
    rb.onclick = function () { openReply(msg, r, host); };
    var db = document.createElement('button'); db.type='button'; db.className='gb-action-btn'; db.textContent='🗑'; db.title='删除';
    db.onclick = function () { deleteReply(r); };
    ra.appendChild(rb); ra.appendChild(db); b.appendChild(ra);

    // 子回评（回复这条回复的）：
    //   帖子折叠时 → 完全不显示
    //   帖子展开后 → 先显示 1 条，剩下的要再点「展开」才看得到
    var children = (repliesByMsg[msg.id] || []).filter(function (x) { return x.reply_to_id === r.id; });
    if (children.length && showSubReplies) {
      var sub = document.createElement('div');
      sub.className = 'gb-sub-replies';
      var allOpen = (openSubReply === r.id);
      var showN = allOpen ? children.length : 1;
      children.slice(0, showN).forEach(function (ch) {
        var ce = document.createElement('div'); ce.className = 'gb-sub-reply';
        var cn = document.createElement('span'); cn.className = 'gb-reply-name'; cn.textContent = ch.name;
        var ct = document.createElement('span'); ct.className = 'gb-reply-time'; ct.textContent = fmt(ch.created_at);
        var cc = document.createElement('div'); cc.className = 'gb-reply-content';
        renderContent(cc, ch.content);
        ce.appendChild(cn); ce.appendChild(ct); ce.appendChild(cc);
        sub.appendChild(ce);
      });
      if (children.length > 1) {
        var more = document.createElement('button');
        more.type = 'button';
        more.className = 'gb-sub-more';
        more.textContent = allOpen ? '收起回评 ▴' : ('还有 ' + (children.length - 1) + ' 条回评，展开 ▾');
        more.onclick = function () {
          openSubReply = allOpen ? '' : r.id;
          render();
          scrollToEl(document.getElementById('p-' + msg.id));
        };
        sub.appendChild(more);
      }
      b.appendChild(sub);
    }

    el.appendChild(b);
    return el;
  }

  /* ---------- 回复 ---------- */
  function openReply(msg, replyTo, host) {
    var old = host.querySelector('.gb-reply-form-inline');
    if (old) old.remove();
    var box = document.createElement('div'); box.className = 'reply-form gb-reply-form-inline';
    var inp = document.createElement('input'); inp.type='text'; inp.maxLength=300;
    inp.placeholder = replyTo ? ('回复 ' + replyTo.name + '……') : ('回复 ' + msg.name + '……');
    var send = document.createElement('button'); send.type='button'; send.className='btn-main'; send.textContent='发送';
    var cancel = document.createElement('button'); cancel.type='button'; cancel.className='btn-ghost'; cancel.textContent='取消';
    cancel.onclick = function () { box.remove(); };
    send.onclick = function () {
      var name = (localStorage.getItem('jiangwan_gb_name') || '').replace(/^\s+|\s+$/g, '');
      if (!isLoggedIn()) {
        alert('登录后才能回复。');
        location.href = './auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search);
        return;
      }
      if (!name) { alert('还没设名字，先去「用户中心」设一下。'); return; }
      var text = inp.value.trim();
      if (!text) { alert('回复不能为空'); return; }
      if (busy || !connected) { status('还没连上服务器，暂时发不了。', 'err'); return; }
      busy = true; send.disabled = true; send.textContent = '…';
      var av = avatarPayload();
      sb.from('replies').insert({
        message_id: msg.id, device_id: deviceId, name: name.slice(0,20), content: text.slice(0,300),
        reply_to_id: replyTo ? replyTo.id : null, reply_to_name: replyTo ? replyTo.name : null,
        author_username: currentUsername() || null,
        avatar_mode: av.avatar_mode, avatar_path: av.avatar_path, avatar_color: av.avatar_color, avatar_emoji: av.avatar_emoji
      }).then(function (r) { if (r.error) throw r.error; box.remove(); return loadAll().then(render); })
        .catch(function (e) { status('回复失败：' + ((e&&e.message)||e), 'err'); })
        .then(function () { busy = false; send.disabled = false; send.textContent = '发送'; });
    };
    box.appendChild(inp); box.appendChild(send); box.appendChild(cancel);
    host.appendChild(box); inp.focus();
  }

  /* ---------- 置顶 / 删除 ---------- */
  function togglePin(msg) {
    var pw = prompt((msg.is_pinned ? '取消置顶' : '置顶这条帖子') + '\n请输入管理密码：');
    if (pw === null || !pw.trim()) return;
    status('正在校验密码……');
    sha(PW_SALT + '|' + pw.trim()).then(function (h) {
      return sb.rpc('set_message_pinned', { p_message_id: msg.id, p_pinned: !msg.is_pinned, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      status(o && o.is_pinned ? '已置顶 📌' : '已取消置顶', 'ok');
      return loadAll().then(render);
    }).catch(function (e) { status(badPw(e) ? '密码不对。' : ('置顶失败：' + ((e&&e.message)||e)), 'err'); });
  }
  function deleteMessage(msg) {
    if (!confirm('删除这条帖子？回复和配图会一起删掉。')) return;
    var pw = prompt('删除需要管理密码：');
    if (pw === null || !pw.trim()) return;
    sha(PW_SALT + '|' + pw.trim()).then(function (h) {
      return sb.rpc('delete_message', { p_message_id: msg.id, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      if (!o || o.deleted !== true) throw new Error('bad password');
      status('已删除 ✅', 'ok'); return loadAll().then(render);
    }).catch(function (e) { status(badPw(e) ? '密码不对，没有删除。' : ('删除失败：' + ((e&&e.message)||e)), 'err'); });
  }
  function deleteReply(r) {
    if (!confirm('删除这条回复？')) return;
    var pw = prompt('删除需要管理密码：');
    if (pw === null || !pw.trim()) return;
    sha(PW_SALT + '|' + pw.trim()).then(function (h) {
      return sb.rpc('delete_reply', { p_reply_id: r.id, p_pw_hash: h });
    }).then(function (res) {
      if (res.error) throw res.error;
      var o = res.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      if (!o || o.deleted !== true) throw new Error('bad password');
      status('已删除 ✅', 'ok'); return loadAll().then(render);
    }).catch(function (e) { status(badPw(e) ? '密码不对。' : ('删除失败：' + ((e&&e.message)||e)), 'err'); });
  }

  /* ---------- 小分区增删 ---------- */
  function newSub() {
    if (!curMain) { status('请先从左侧进入某个大分区。', 'err'); return; }
    var name = prompt('在「' + curMain + '」下面新建小分区\n名称不超过 5 个汉字或 10 个字母：');
    if (name === null || !name.trim()) return;
    var v = name.trim();
    var cjk = (v.match(/[\u4e00-\u9fff]/g) || []).length;
    var lat = v.replace(/[\u4e00-\u9fff]/g, '').length;
    if (cjk > 5 || lat > 10) { alert('名称太长：最多 5 个汉字或 10 个字母'); return; }
    status('正在新建小分区……');
    sb.rpc('create_gb_subsection', { p_main: curMain, p_name: v, p_device: deviceId }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      status('小分区已新建 ✅', 'ok');
      return loadSections().then(function () { if (o && o.id) curSub = o.id; renderSubBar(); render(); });
    }).catch(function (e) {
      var m = (e && e.message) || String(e);
      status(/duplicate/i.test(m) ? '这个分区里已经有同名小分区了。' : (/too long/i.test(m) ? '名称太长：最多 5 个汉字或 10 个字母' : ('新建失败：' + m)), 'err');
    });
  }
  function deleteSub(id) {
    if (/(未分组|未分类|未归类|默认)$/.test(btrimName(secName(id)))) { alert('这是默认小分区，不能删除。'); return; }
    if (!confirm('删除小分区「' + secName(id) + '」？\n里面的帖子会回到大分区，不会被删。')) return;
    var pw = prompt('删除小分区需要管理密码：');
    if (pw === null || !pw.trim()) return;
    sha(PW_SALT + '|' + pw.trim()).then(function (h) {
      return sb.rpc('delete_gb_subsection', { p_id: id, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
      if (!o || o.deleted !== true) throw new Error('bad password');
      status('小分区已删除，帖子已回到「' + curMain + '」✅', 'ok');
      curSub = '';
      return loadAll().then(function () { renderSubBar(); render(); });
    }).catch(function (e) { status(badPw(e) ? '密码不对。' : ('删除失败：' + ((e&&e.message)||e)), 'err'); });
  }

  /* ---------- 头像/配图 ---------- */
  function avatarPayload() {
    if (avatarMode === 'image' && selImagePath) return { avatar_mode:'image', avatar_path: selImagePath, avatar_color: selColor, avatar_emoji: selEmoji };
    return { avatar_mode:'emoji', avatar_path: null, avatar_color: selColor, avatar_emoji: selEmoji };
  }

  /* ---------- 数据 ---------- */
  function loadSections() {
    return sb.from('gb_sections').select('id,name,main_section,sort_order,is_default').order('sort_order')
      .then(function (r) {
        if (r.error) throw r.error;
        sections = r.data || [];
        subs = sections.filter(function (x) { return !x.is_default; });
        // 当前选中的小分区若不属于这个大分区，清掉
        if (curSub) {
          var ok = subs.some(function (x) { return x.id === curSub && x.main_section === curMain; });
          if (!ok) curSub = '';
        }
        // 默认选中的小分区：按后缀识别用户自己的命名
        // （各分区不同：学习未分组 / 2次元未分组 / 招领未分组 / 吐槽未分组 / 建议未分组）
        if (curSub) {
          var mine2 = subs.filter(function (x) { return x.main_section === curMain; });
          var stillOk = mine2.some(function (x) { return x.id === curSub; });
          if (!stillOk) curSub = '';
        }
        if (!curSub) {
          var mine = subs.filter(function (x) { return x.main_section === curMain; });
          var target = null;
          for (var mi = 0; mi < mine.length; mi++) {
            if (/(未分组|未分类|未归类|默认)$/.test(btrimName(mine[mi].name))) { target = mine[mi]; break; }
          }
          if (!target && mine.length) target = mine[0];
          if (target) curSub = target.id;
        }
      });
  }

  /* 把横滑条里点中的按钮滚到可见位置 */
  function scrollChipIntoView(btn) {
    try {
      var row = btn.closest ? btn.closest('.gb-scroll') : null;
      if (!row) return;
      var r = btn.getBoundingClientRect(), rr = row.getBoundingClientRect();
      if (r.left < rr.left + 16) row.scrollLeft -= (rr.left + 16 - r.left);
      else if (r.right > rr.right - 16) row.scrollLeft += (r.right - rr.right + 16);
    } catch (e) {}
  }

  /* 是否已登录 */
  function isLoggedIn() {
    try {
      var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
      return !!(a && a.username);
    } catch (e) { return false; }
  }

  /* 当前登录账户的用户名（不带 @），没登录返回空 */
  function currentUsername() {
    try {
      var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
      if (a && a.username) return String(a.username).replace(/^@+/, '');
    } catch (e) {}
    return '';
  }

  function btrimName(x) { return String(x == null ? '' : x).replace(/^\s+|\s+$/g, ''); }

  function loadAll() {
    return sb.from('messages')
      .select('id,created_at,name,content,avatar_color,avatar_emoji,avatar_path,avatar_mode,like_count,reply_count,is_pinned,pinned_at,main_section,sub_section_id,tags')
      .eq('hidden', false)
      .order('is_pinned', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(PAGE_SIZE)
      .then(function (r) {
        if (r.error) throw r.error;
        messages = r.data || [];
        var ids = messages.map(function (m) { return m.id; });
        if (!ids.length) { repliesByMsg = {}; msgImages = {}; return null; }
        return sb.from('message_images').select('id,message_id,image_path,sort_order,media_type,mime,file_name').in('message_id', ids).eq('hidden', false).limit(400)
          .then(function (r2) {
            msgImages = {};
            if (!r2.error) (r2.data || []).forEach(function (x) { (msgImages[x.message_id] = msgImages[x.message_id] || []).push(x); });
            return sb.from('replies').select('id,message_id,created_at,name,content,avatar_color,avatar_emoji,avatar_path,avatar_mode,reply_to_id,reply_to_name')
              .in('message_id', ids).order('created_at', { ascending: true }).limit(600);
          }).then(function (r3) {
            repliesByMsg = {};
            if (r3 && !r3.error) (r3.data || []).forEach(function (x) { (repliesByMsg[x.message_id] = repliesByMsg[x.message_id] || []).push(x); });
            return null;
          });
      });
  }

  /* ---------- 发帖 ---------- */
  function submit() {
    var ctEl = $('gb-content');
    var name = (localStorage.getItem('jiangwan_gb_name') || '').replace(/^\s+|\s+$/g, '');
    var content = ctEl ? ctEl.value.trim() : '';
    if (!isLoggedIn()) {
      alert('登录后才能发帖。');
      location.href = './auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search);
      return;
    }
    if (!name) { alert('还没设名字。点页面上方「去设置」，或进「用户中心」设好再发。'); return; }
    if (!content) { alert('请写点内容'); ctEl && ctEl.focus(); return; }
    if (!curSub) {
      alert('请先选一个小分区再发帖。\n\n如果这个分区里还没有小分区，点「＋ 新建小分区」建一个（不用密码），建好后会自动选中。');
      var bar = $('gb-subs');
      if (bar && typeof bar.scrollIntoView === 'function') {
        try { bar.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
      }
      return;
    }
    if (avatarMode === 'image' && !selImagePath) { alert('头像还没上传成功'); return; }
    if (!connected) { status('还没连上云端，暂时发不了。', 'err'); return; }
    if (busy) return;
    busy = true;
    var btn = $('gb-submit'); if (btn) { btn.disabled = true; btn.textContent = '发送中…'; }
    var tags = parseTags(content);
    var av = avatarPayload();
    sb.from('messages').insert({
      device_id: deviceId, name: name.slice(0,20), content: content.slice(0,500),
      main_section: curMain || '未分区',
      sub_section_id: curSub || null,
      tags: tags,
      author_username: currentUsername() || null,
      avatar_mode: av.avatar_mode, avatar_path: av.avatar_path,
      avatar_color: av.avatar_color, avatar_emoji: av.avatar_emoji
    }).select('id').then(function (r) {
      if (r.error) throw r.error;
      if (ctEl) ctEl.value = '';
      try { localStorage.setItem('jiangwan_gb_name', name); } catch (e) {}
      var nid = (r.data && r.data[0] && r.data[0].id) || '';
      return uploadImgs(nid);
    }).then(function () {
      var comp = $('gb-composer');
      if (comp) comp.hidden = true;
      document.body.style.overflow = '';
      status('已发布 ✅' + (parseTags(content).length ? '（识别到标签：' + parseTags(content).map(function(t){return '#'+t;}).join(' ') + '）' : ''), 'ok');
      setTimeout(function () { status(''); }, 3000);
      return loadAll().then(render);
    }).catch(function (e) {
      status('发布失败：' + ((e&&e.message)||e), 'err');
    }).then(function () { busy = false; if (btn) { btn.disabled = false; btn.textContent = '发布'; } });
  }

  function uploadImgs(mid) {
    if (!pendingFiles.length || !uid || !mid) return Promise.resolve();
    var total = pendingFiles.length;
    return pendingFiles.reduce(function (chain, item, i) {
      return chain.then(function () {
        status('上传 ' + (i + 1) + '/' + total + '……');
        return prepareBlob(item).then(function (blob) {
          var ext = item.kind === 'image' ? 'jpg'
                  : (item.kind === 'audio' ? (item.file.name.split('.').pop() || 'mp3').toLowerCase().slice(0, 5)
                  : (item.file.name.split('.').pop() || 'mp4').toLowerCase().slice(0, 5));
          var path = uid + '/msg-' + Date.now().toString(36) + '-' +
                     Math.random().toString(36).slice(2, 8) + '.' + ext;
          var mime = item.kind === 'image' ? 'image/jpeg' : (item.file.type || 'application/octet-stream');
          return sb.storage.from('avatars')
            .upload(path, blob, { contentType: mime, upsert: false })
            .then(function (r) {
              if (r.error) throw r.error;
              return sb.from('message_images').insert({
                message_id: mid, device_id: deviceId, image_path: path, sort_order: i,
                media_type: item.kind, mime: mime,
                file_name: (item.file.name || '').slice(0, 80),
                size_bytes: blob.size || 0
              });
            })
            .then(function (r) { if (r && r.error) throw r.error; return null; });
        });
      });
    }, Promise.resolve()).then(function () {
      pendingFiles.forEach(function (x) { try { if (x.url) URL.revokeObjectURL(x.url); } catch (e) {} });
      pendingFiles = [];
      renderImgPick();
    });
  }

  /* 图片压缩；音视频原样上传 */
  function prepareBlob(item) {
    if (item.kind !== 'image') return Promise.resolve(item.file);
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var cv = document.createElement('canvas');
        var sc = Math.min(1, 1600 / Math.max(im.width, im.height));
        cv.width = Math.max(1, Math.round(im.width * sc));
        cv.height = Math.max(1, Math.round(im.height * sc));
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { b ? res(b) : rej(new Error('图片编码失败')); }, 'image/jpeg', 0.86);
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(item.file);
    });
  }

  function renderImgPick() {
    var box = $('gb-img-preview'), cnt = $('gb-file-count');
    if (!box) return;
    box.textContent = '';
    pendingFiles.forEach(function (it, i) {
      var w = document.createElement('div');
      w.className = 'gb-attach';
      if (it.kind === 'image' && it.url) {
        var im = document.createElement('img');
        im.src = it.url; im.alt = '';
        w.appendChild(im);
      } else {
        var ic = document.createElement('div');
        ic.className = 'gb-attach-icon';
        ic.textContent = iconOf(it.kind);
        w.appendChild(ic);
        var ext = document.createElement('div');
        ext.className = 'gb-attach-ext';
        ext.textContent = (it.file.name || '').split('.').pop().slice(0, 6).toUpperCase();
        w.appendChild(ext);
      }
      var del = document.createElement('button');
      del.type = 'button'; del.textContent = '×'; del.title = '移除';
      del.onclick = function () {
        try { if (it.url) URL.revokeObjectURL(it.url); } catch (e) {}
        pendingFiles.splice(i, 1);
        renderImgPick();
      };
      w.appendChild(del);
      box.appendChild(w);
    });
    if (cnt) {
      if (!pendingFiles.length) cnt.textContent = '还没选文件';
      else {
        var c = { image: 0, audio: 0, video: 0 };
        pendingFiles.forEach(function (x) { c[x.kind]++; });
        var parts = [];
        if (c.image) parts.push('图片 ' + c.image);
        if (c.audio) parts.push('音频 ' + c.audio);
        if (c.video) parts.push('视频 ' + c.video);
        cnt.textContent = parts.join(' · ') + '（共 ' + pendingFiles.length + '/' + MAX_FILES + '）';
      }
    }
  }

  /* ---------- 启动 ---------- */
  function boot(opts) {
    curMain = (opts && opts.main) || '';
    sb = JW.sb; uid = JW.uid || ''; deviceId = JW.deviceId;
    // 头像偏好
    try {
      var look = JSON.parse(localStorage.getItem('jiangwan_gb_look') || 'null');
      if (look) {
        if (look.emoji) selEmoji = look.emoji;
        if (look.color) selColor = look.color;
        if (look.mode) avatarMode = look.mode;
        if (look.image) selImage = look.image;
        if (look.imagePath) selImagePath = look.imagePath;
      }
    } catch (e) {}
    

    // 显示当前身份（在用户中心设置）
    renderWho();
    renderImgPick();
    gatePosting();

    // 附件选择（图片/音频/视频）
    var fi = $('gb-files');
    if (fi) fi.onchange = function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      var rejected = [];
      files.forEach(function (f) {
        if (pendingFiles.length >= MAX_FILES) { rejected.push(f.name + '（最多 ' + MAX_FILES + ' 个）'); return; }
        var kind = kindOf(f);
        if (!kind) { rejected.push(f.name + '（不支持的类型）'); return; }
        var mb = f.size / 1024 / 1024;
        if (mb > limitOf(kind)) { rejected.push(f.name + '（超过 ' + limitOf(kind) + 'MB）'); return; }
        pendingFiles.push({
          file: f, kind: kind,
          url: (kind === 'image' && window.URL && URL.createObjectURL) ? URL.createObjectURL(f) : ''
        });
      });
      if (rejected.length) alert('这些没加上：\n' + rejected.join('\n'));
      renderImgPick();
      e.target.value = '';
    };

    var sub = $('gb-submit');
    if (sub) sub.onclick = submit;

    // ---- 底部发帖条交互 ----
    var composer = $('gb-composer');
    var trigger = $('gb-composer-trigger');
    var mask = $('gb-composer-mask');
    var closeBtn = $('gb-composer-close');
    var fakeBtn = $('gb-trigger-fake');
    var contentEl = $('gb-content');

    function openComposer() {
      if (!isLoggedIn()) {
        alert('登录后才能发帖。');
        location.href = './auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search);
        return;
      }
      if (!curSub) {
        alert('请先选一个小分区再发帖。');
        renderSubBar();
        return;
      }
      if (!composer) return;
      composer.hidden = false;
      document.body.style.overflow = 'hidden';
      var sec = $('gb-composer-sec');
      if (sec) sec.textContent = curMain + (secName(curSub) ? ' · ' + secName(curSub) : '');
      setTimeout(function () { if (contentEl) contentEl.focus(); }, 80);
    }
    function closeComposer() {
      if (!composer) return;
      composer.hidden = true;
      document.body.style.overflow = '';
    }
    if (fakeBtn) fakeBtn.onclick = openComposer;
    if (closeBtn) closeBtn.onclick = closeComposer;
    if (mask) mask.onclick = closeComposer;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && composer && !composer.hidden) closeComposer();
    });

    // 输入框自适应高度
    if (contentEl) contentEl.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, Math.round(window.innerHeight * 0.4)) + 'px';
    });

    showLoading('正在加载留言……');
    loadSections().then(loadAll).then(function () {
      connected = true;
      renderSortBar(); renderSubBar(); render();
      status('');
      // 从搜索页跳过来：定位到那条帖子
      var pid = new URLSearchParams(location.search).get('post');
      if (pid) {
        setTimeout(function () {
          var el = document.getElementById('p-' + pid);
          if (el) {
            scrollToEl(el);
            el.classList.add('gb-flash');
            setTimeout(function () { el.classList.remove('gb-flash'); }, 2600);
          }
        }, 200);
      }
    }).catch(function (e) {
      status('加载失败：' + ((e && e.message) || e), 'err');
      var listEl = $('gb-list');
      if (listEl) {
        listEl.textContent = '';
        var box = document.createElement('div');
        box.className = 'empty';
        box.textContent = '加载失败，请检查网络后刷新页面。';
        listEl.appendChild(box);
      }
    });
  }

  /* ---------- 头像：emoji 或 上传图片 ---------- */
  function setMode(mode) {
    avatarMode = (mode === 'image') ? 'image' : 'emoji';
    var pe = $('panel-emoji'), pi = $('panel-image');
    if (pe) pe.hidden = avatarMode !== 'emoji';
    if (pi) pi.hidden = avatarMode !== 'image';
    var be = $('mode-emoji'), bi = $('mode-image');
    if (be) be.className = 'gb-sec-chip' + (avatarMode === 'emoji' ? ' on' : '');
    if (bi) bi.className = 'gb-sec-chip' + (avatarMode === 'image' ? ' on' : '');
    var clr = $('btn-avatar-clear');
    if (clr) clr.hidden = !(avatarMode === 'image' && selImage);
    saveLook();
  }

  function uploadAvatar(file) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, 256, 256);
        var side = Math.min(im.width, im.height);
        cx.drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, 256, 256);
        cv.toBlob(function (b) {
          if (!b) return rej(new Error('图片编码失败'));
          var path = uid + '/avatar-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          sb.storage.from('avatars').upload(path, b, { contentType: 'image/jpeg', upsert: false })
            .then(function (r) { if (r.error) throw r.error; res(path); })
            .catch(rej);
        }, 'image/jpeg', 0.85);
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  function statusEl() { return $('gb-status'); }

  /* 未登录：把发帖区收起来，换成登录按钮 */
  function gatePosting() {
    var box = $('gb-login-gate');
    var trig = $('gb-composer-trigger');
    var comp = $('gb-composer');
    var logged = isLoggedIn();

    if (box) box.hidden = logged;
    if (trig) trig.hidden = !logged;
    if (comp && !logged) comp.hidden = true;

    if (!logged) {
      var sub = $('gb-login-gate-sub');
      if (sub) sub.textContent = '登录后才能在这个分区发帖。';
      var btn = $('gb-login-gate-btn');
      if (btn) btn.href = './auth.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search);
    }
  }

  /* 显示当前身份（来自用户中心的设置） */
  function renderWho() {
    var box = $('gb-who-avatar'), nm = $('gb-who-name');
    if (box) {
      box.textContent = '';
      var el = avatarNode(selColor, selEmoji, (avatarMode === 'image' ? selImagePath : ''), 'small');
      el.style.width = '40px'; el.style.height = '40px'; el.style.fontSize = '1.2rem';
      box.appendChild(el);
    }
    if (nm) {
      var n = localStorage.getItem('jiangwan_gb_name') || '';
      nm.textContent = n || '还没设名字（点「去设置」）';
      nm.style.color = n ? '' : 'var(--accent)';
    }
  }

  function saveLook() {
    try { localStorage.setItem('jiangwan_gb_look', JSON.stringify({ mode:avatarMode, emoji:selEmoji, color:selColor, image:selImage, imagePath:selImagePath })); } catch (e) {}
    var pv = $('avatar-preview');
    if (pv) { pv.textContent=''; pv.appendChild(avatarNode(selColor, selEmoji, selImagePath, 'big')); }
  }


  return { boot: boot, parseTags: parseTags, MAINS: MAINS };
})();

</script>

JW.whenReady(function(e){ if(e){ document.getElementById('gb-status').hidden=false; document.getElementById('gb-status').textContent='连不上云端：'+(e.message||e); return;} GB.boot({main:'新闻'}); });
</script>
<script>

(function () {
  var KEY = 'jw_notice_seen2';
  var box = document.getElementById('gb-notice');
  if (!box) return;
  try { if (localStorage.getItem(KEY) === '1') box.hidden = true; else box.hidden = false; } catch (e) { box.hidden = false; }
  document.getElementById('gb-notice-x').onclick = function () {
    box.hidden = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  };
  var lb = document.getElementById('lightbox');
  if (lb) {
    var img = document.getElementById('lb-img'), title = document.getElementById('lb-title');
    window.__jwOpenImage = function (url, name) {
      img.src = url; title.textContent = (name || '图片') + '　（长按可直接保存）';
      lb.hidden = false; document.body.style.overflow = 'hidden';
      lb.dataset.url = url; lb.dataset.name = name || '图片';
    };
    function close() { lb.hidden = true; document.body.style.overflow = ''; }
    document.getElementById('lb-close').onclick = close;
    lb.querySelector('.lb-stage').onclick = function (e) { if (e.target === lb.querySelector('.lb-stage')) close(); };
    document.getElementById('lb-download').onclick = function () {
      var b = this; b.disabled = true; b.textContent = '下载中…';
      fetch(lb.dataset.url).then(function (r) { return r.blob(); }).then(function (bl) {
        var u = URL.createObjectURL(bl), a = document.createElement('a');
        a.href = u; a.download = (lb.dataset.name || '图片') + '.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
        b.disabled = false; b.textContent = '⬇ 下载原图';
      }).catch(function () { window.open(lb.dataset.url, '_blank'); b.disabled = false; b.textContent = '⬇ 下载原图'; });
    };
  }
})();
</script>
