/* 生成侧边栏 + 顶栏（每个页面只需调用 SITE.shell('key')） */
SITE.shell = function (activeKey) {
  var links = SITE.pages.map(function (p) {
    return '<a href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');

  // 「用户中心」折叠组
  var logged = SITE.loggedIn();
  // 已登录后不再显示「登录 / 注册」
  var userItems = SITE.userPages.filter(function (p) {
    return !(logged && p.key === 'auth');
  });
  var userOpen = userItems.some(function (p) { return p.key === activeKey; })
                 || ['auth','user','user-settings','user-bg'].indexOf(activeKey) >= 0;
  var userLinks = userItems.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');
  links += '<div class="nav-group' + (userOpen ? ' open' : '') + '" id="nav-user">'
    + '<button type="button" class="nav-group-btn' + (userOpen ? ' on' : '') + '" id="nav-user-btn">'

        : '用户中心<small>Account</small>')

    + '<div class="nav-group-body">' + userLinks + '</div>'
    + '</div>';

  // 「关于」折叠组：关于学校 / 关于本站
  var aboutOpen = SITE.aboutPages.some(function (p) { return p.key === activeKey; });
  var aboutLinks = SITE.aboutPages.map(function (p) {
    var cls = 'sub-link' + (p.faint ? ' sub-link-faint' : '') + (p.key === activeKey ? ' on' : '');
    var small = p.en ? '' : '';
    return '<a class="' + cls + '" href="' + p.href + '">' + p.label + small + '</a>';
  }).join('');
  links += '<div class="nav-group' + (aboutOpen ? ' open' : '') + '" id="nav-about">'
    + '<button type="button" class="nav-group-btn' + (aboutOpen ? ' on' : '') + '" id="nav-about-btn">'
    + '关于<small>About</small><i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + aboutLinks + '</div>'
    + '</div>';

  var bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = '<button id="nav-toggle" aria-label="菜单">☰</button>'
    + '<span class="title">' + SITE.name + '</span>';

  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.id = 'nav-mask';
  mask.hidden = true;

  var aside = document.createElement('aside');
  aside.className = 'sidebar';

    '<div class="brand">'
    + '<img src="./img/logo.png" alt="校徽">'
    + '<div class="name">' + SITE.name + '</div>'
    + '<div class="sub">Unofficial</div>'
    + '</div>'
    + '<nav>' + links + '</nav>'
    ;

  document.body.insertBefore(aside, document.body.firstChild);
  document.body.insertBefore(mask, document.body.firstChild);
  document.body.insertBefore(bar, document.body.firstChild);

  var userBtn = aside.querySelector('#nav-user-btn');
  if (userBtn) {
    userBtn.onclick = function () {
      var g = aside.querySelector('#nav-user');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_user_open', open ? '1' : '0'); } catch (e) {}
    };
    if (!userOpen) {
      try {
        if (localStorage.getItem('jw_user_open') === '1') aside.querySelector('#nav-user').classList.add('open');
      } catch (e) {}
    }
  }

  var aboutBtn = aside.querySelector('#nav-about-btn');
  if (aboutBtn) {
    aboutBtn.onclick = function () {
      var g = aside.querySelector('#nav-about');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_about_open', open ? '1' : '0'); } catch (e) {}
    };
    // 记住上次展开状态（只要不是当前页在关于里）
    if (!aboutOpen) {
      try {
        if (localStorage.getItem('jw_about_open') === '1') aside.querySelector('#nav-about').classList.add('open');
      } catch (e) {}
    }
  }

  bar.querySelector('#nav-toggle').onclick = function () {
    document.body.classList.toggle('nav-open');
    mask.hidden = !document.body.classList.contains('nav-open');
  };
  mask.onclick = function () {

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

</script>

        reject(new Error('连接超时：' + (what || '请求') + '（' + Math.round(ms / 1000) + ' 秒无响应）'));
      }, ms);
      Promise.resolve(p).then(function (v) { if (done) return; done = true; clearTimeout(t); resolve(v); },
        function (e) { if (done) return; done = true; clearTimeout(t); reject(e); });
    });
  },
  retry: function (fn, times) {
    times = times === undefined ? 2 : times;
    var n = 0;
    var run = function () {
      n++;
      return Promise.resolve().then(fn).catch(function (e) {
        if (n >= times) throw e;
        return new Promise(function (r) { setTimeout(r, 1200); }).then(run);
      });
    };
    return run();
  },
  makeFetch: function () {
    var BASE = JW.url;
    return function (input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      var rel = null;
      try {
        var u = new URL(url, BASE);
        if (u.origin === BASE) rel = u.pathname + u.search;
      } catch (e) {}
      if (!rel || !JW.proxy || !JW.proxy.length) return fetch(input, init);

      /* 文件存储：国内直连 Supabase 会被重置，所以也走中转（Cloudflare 带宽无限） */

      /* ===== 连接策略 =====
         实测：国内直连 Supabase 会被 RST 重置，所以默认直接走中转。
         中转顺序：Cloudflare Pages（额度无限）→ Deno（额度紧张，备用）
         用户可在「用户中心 → 连接线路」里改成只连官方（海外网络适用）。
         所有中转都失败时，最后再试直连兜底。 */
      var cleanList = JW.proxy.map(function (x) { return String(x).replace(/\/$/, ''); });

      function viaRelay() {
        if (!cleanList.length) return fetch(url, init);
        function attempt(i) {
          if (i >= cleanList.length) {
            console.warn('所有中转都失败，最后试直连');
            return fetch(url, init);
          }
          var clean = cleanList[i];
          return fetch(clean + rel, init).then(function (res) {
            if (!res || res.status >= 500) throw new Error('中转返回 ' + (res && res.status));
            return res;
          }).catch(function (e) {
            console.warn('中转失败：' + clean, e && e.message);
            return attempt(i + 1);
          });
        }
        return attempt(0);
      }

      // 用户明确选「只连官方」→ 直连
      if (JW.lineMode === 'direct') return fetch(url, init);

      // 默认 / 「只用中转」→ 走中转
      return viaRelay();
    };
  }
};
/* 图片/音视频的公开地址：国内直连 Supabase 会被重置，所以走中转
   （Cloudflare Pages 带宽无限，图片走它不心疼） */
JW.storagePublic = (JW.proxy && JW.proxy.length ? String(JW.proxy[0]).replace(/\/$/, '') : JW.url)
                 + '/storage/v1/object/public/' + JW.bucket + '/';

(function () {
  /* ---- 连接线路：读用户手动选择；不选就是「自动」 ---- */
  try {
    var lm = localStorage.getItem(JW.LINE_KEY);
    if (lm === 'direct' || lm === 'relay') JW.lineMode = lm;
  } catch (e) {}

  JW.setLine = function (mode) {
    JW.lineMode = (mode === 'direct' || mode === 'relay') ? mode : null;
    try {
      if (JW.lineMode) localStorage.setItem(JW.LINE_KEY, JW.lineMode);
      else localStorage.removeItem(JW.LINE_KEY);
    } catch (e) {}
    return JW.lineMode;
  };
  JW.getLine = function () { return JW.lineMode; };
  JW.proxyList = function () { return JW.proxy.slice(); };

  function newDeviceId() {
    if (window.crypto && window.crypto.randomUUID) return 'gb-' + window.crypto.randomUUID();
    return 'gb-' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  JW.deviceId = localStorage.getItem('jiangwan_gb_device') || '';
  if (!JW.deviceId || JW.deviceId.length < 8 || JW.deviceId.length > 64) {
    JW.deviceId = newDeviceId();
    try { localStorage.setItem('jiangwan_gb_device', JW.deviceId); } catch (e) {}
  }
  function boot() {
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
      JW._settle(new Error('云端组件没加载到（vendor/supabase.js）'));
      return;
    }
    try {
      JW.sb = window.supabase.createClient(JW.url, JW.key, {
        auth: { persistSession: true, autoRefreshToken: true },
        global: JW.proxy && JW.proxy.length ? { fetch: JW.makeFetch() } : undefined
      });
    } catch (e) { JW._settle(e); return; }
    JW.sb.auth.getSession().then(function (r) {
      var u = r && r.data && r.data.session && r.data.session.user;
      if (u && u.id) JW.uid = u.id;
      return null;
    }).catch(function () { return null; })
      .then(function () {
        if (JW.uid) return null;
        return JW.retry(function () {
          return JW.withTimeout(JW.sb.auth.signInAnonymously(), JW.timeoutMs, '登录匿名身份');
        }, 2).then(function (res) {
          if (res && res.error) throw new Error(res.error.message || '匿名登录被拒绝');
          if (res && res.data && res.data.user) JW.uid = res.data.user.id || '';
          return null;
        });
      })
      .then(function () { JW._settle(null); })
      .catch(function (e) { JW._settle(e); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

<script>
/* ===== 个人资料卡（点帖子头像弹出） ===== */
var PROFILE = (function () {
  var $ = function (id) { return document.getElementById(id); };
  var cache = {};          // username -> profile
  var cur = null;

  function storageUrl(p) {
    if (typeof p !== 'string' || !/^[A-Za-z0-9-]{1,64}\/[A-Za-z0-9._-]{1,80}$/.test(p)) return '';
    return (window.JW && JW.storagePublic || '') + p;
  }
  function fmtDate(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月加入';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* 建弹层（只建一次） */
  function ensureDom() {
    if ($('pc-modal')) return;
    var box = document.createElement('div');
    box.className = 'pc-modal';
    box.id = 'pc-modal';
    box.hidden = true;
    box.innerHTML =
      '<div class="pc-mask" id="pc-mask"></div>' +
      '<div class="pc-card" role="dialog" aria-modal="true">' +
      '  <div class="pc-cover" id="pc-cover"></div>' +
      '  <button class="pc-close" id="pc-close" type="button" aria-label="关闭">✕</button>' +
      '  <div class="pc-body">' +
      '    <div class="pc-avatar" id="pc-avatar"></div>' +
      '    <div class="pc-name" id="pc-name"></div>' +
      '    <div class="pc-uid" id="pc-uid"></div>' +
      '    <div class="pc-bio" id="pc-bio"></div>' +
      '    <div class="pc-meta" id="pc-meta"></div>' +
      '    <div class="pc-actions" id="pc-actions"></div>' +
      '  </div>' +
      '</div>';
    document.body.appendChild(box);

    $('pc-mask').onclick = close;
    $('pc-close').onclick = close;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !box.hidden) close();
    });
  }

  function close() {
    var box = $('pc-modal');
    if (box) box.hidden = true;
    document.body.style.overflow = '';
    cur = null;
  }

  function render(p) {
    var cover = $('pc-cover');
    cover.style.backgroundImage = '';
    if (p.cover_path) {
      var cu = storageUrl(p.cover_path);
      if (cu) cover.style.backgroundImage = 'url("' + cu + '")';
    }
    cover.classList.toggle('no-cover', !p.cover_path);

    var av = $('pc-avatar');
    av.textContent = '';
    var el = document.createElement('div');
    el.className = 'avatar-circle';
    el.style.cssText = 'width:76px;height:76px;font-size:2.1rem;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.16)';
    if (p.avatar_mode === 'image' && p.avatar_path) {
      var im = document.createElement('img');
      im.src = storageUrl(p.avatar_path); im.alt = '';
      im.onerror = function () { el.textContent = p.avatar_emoji || '🙂'; el.style.background = p.avatar_color || '#c0392b'; };
      el.appendChild(im);
    } else {
      el.textContent = p.avatar_emoji || '🙂';
      el.style.background = /^#[0-9a-fA-F]{6}$/.test(p.avatar_color || '') ? p.avatar_color : '#c0392b';
    }
    av.appendChild(el);

    $('pc-name').textContent = p.nickname || p.username;
    $('pc-uid').textContent = p.username;

    var bio = $('pc-bio');
    if (p.bio) { bio.textContent = p.bio; bio.hidden = false; }
    else { bio.textContent = '这个人还没写简介'; bio.hidden = false; bio.classList.add('empty-bio'); }

    var meta = $('pc-meta');
    meta.textContent = '';
    if (p.posts != null) {
      var s1 = document.createElement('span');
      s1.textContent = p.posts + ' 条帖子';
      meta.appendChild(s1);
    }
    if (p.created_at) {
      var s2 = document.createElement('span');
      s2.textContent = fmtDate(p.created_at);
      meta.appendChild(s2);
    }
  }

  function openByUsername(username) {
    if (!username) return;
    var key = String(username).replace(/^@+/, '').toLowerCase();
    ensureDom();
    var box = $('pc-modal');
    box.hidden = false;
    document.body.style.overflow = 'hidden';

    if (cache[key]) { render(cache[key]); return; }

    // 先占位
    $('pc-name').textContent = '加载中……';
    $('pc-uid').textContent = '@' + username;
    $('pc-bio').textContent = '';
    $('pc-meta').textContent = '';
    $('pc-avatar').textContent = '';
    $('pc-cover').style.backgroundImage = '';
    $('pc-cover').classList.add('no-cover');

    if (!window.JW || !JW.sb) {
      $('pc-name').textContent = '连不上服务器';
      return;
    }
    JW.sb.rpc('get_profile', { p_username: username }).then(function (r) {
      if (r.error) throw r.error;
      var p = r.data;
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) {} }
      if (!p) { $('pc-name').textContent = '找不到这个用户'; return; }
      cache[key] = p;
      render(p);
    }).catch(function (e) {
      $('pc-name').textContent = '加载失败：' + ((e && e.message) || e);
    });
  }

  function bind(container) {
    if (!container) return;
    container.addEventListener('click', function (e) {
      var trigger = e.target.closest ? e.target.closest('[data-profile]') : null;
      if (!trigger) return;
      e.preventDefault();
      e.stopPropagation();
      openByUsername(trigger.getAttribute('data-profile'));
    });
  }

  return { open: openByUsername, bind: bind, close: close, clearCache: function () { cache = {}; } };
})();

<script>

(function () {

      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmt(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
         + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function storageUrl(p) {
    if (typeof p !== 'string' || !/^[A-Za-z0-9-]{1,64}\/[A-Za-z0-9._-]{1,80}$/.test(p)) return '';
    return (JW.storagePublic || '') + p;
  }
  function account() { try { return JSON.parse(localStorage.getItem('jw_account') || 'null'); } catch (e) { return null; } }
  function loggedIn() { var a = account(); return !!(a && a.username); }
  function myUsername() { var a = account(); return a ? String(a.username).replace(/^@+/, '') : ''; }
  function myName() { var a = account(); return a ? (a.nickname || String(a.username).replace(/^@+/, '')) : ''; }
  function pw() { try { return localStorage.getItem('jw_account_pw') || ''; } catch (e) { return ''; } }
  function sha(t) {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) {
          return ('0' + x.toString(16)).slice(-2);
        }).join('');
      });
    }
    return Promise.reject(new Error('当前环境不支持加密'));
  }
  function status(t, kind) {
    var el = $('p-status');
    if (!el) return;
    if (!t) { el.hidden = true; el.textContent = ''; return; }
    el.hidden = false; el.className = 'status' + (kind ? ' ' + kind : ''); el.textContent = t;
  }

  function avatarNode(color, emoji, path, size, username) {
    var el = document.createElement('div');

    if (username) {
      el.setAttribute('data-profile', String(username).replace(/^@+/, ''));

      el.style.background = /^#[0-9a-fA-F]{6}$/.test(color || '') ? color : '#c0392b';

  /* ---------- 加载 ---------- */

    sb.from('messages')
      .select('id,created_at,name,content,avatar_color,avatar_emoji,avatar_path,avatar_mode,like_count,reply_count,is_pinned,pinned_at,main_section,sub_section_id,tags,author_username,hidden')
      .eq('id', postId).limit(1)
      .then(function (r) {

        post = (r.data || [])[0];
        if (!post || post.hidden) { showError('帖子不存在或已被删除'); return Promise.reject('stop'); }
        return sb.from('message_images')
          .select('id,image_path,media_type,mime,file_name,sort_order')
          .eq('message_id', post.id).eq('hidden', false)
          .order('sort_order', { ascending: true });
      })
      .then(function (r) {
        if (r === 'stop') return null;

          .select('id,created_at,name,content,avatar_color,avatar_emoji,avatar_path,avatar_mode,reply_to_id,reply_to_name,author_username')
          .eq('message_id', post.id).order('created_at', { ascending: true }).limit(500);

        if (r === 'stop' || !r) return null;

        if (e === 'stop') return;

  function loadProfiles() {

        }[post.main_section] || 'other'))) + '.html" style="text-decoration:none;display:inline-block">← 回发帖区</a>';

        h += '<div class="reply-acts">'
           + '<button data-reply-to="' + esc(r.id) + '" data-reply-name="' + esc(rName) + '">↩ 回复</button>'
           + '<button data-del-reply="' + esc(r.id) + '">🗑 删除</button>'
           + '</div>';
        h += '</div></div>';
      });
    }

    // 回复输入
    h += '<div class="reply-form">';
    if (loggedIn()) {
      h += '<input type="text" id="p-reply-input" maxlength="300" placeholder="回复 ' + esc(showName) + '……">';
      h += '<button class="btn-main" id="p-reply-send" type="button">发送</button>';
    } else {
      h += '<div style="width:100%;text-align:center;padding:12px;font-size:.82rem;color:var(--muted)">'
         + '<a href="./auth.html?next=' + encodeURIComponent('post.html?id=' + postId) + '" style="color:var(--accent);font-weight:700">登录</a>'
         + ' 后才能回复</div>';
    }
    h += '</div>';
    h += '</div>';

    $('p-content').innerHTML = h;

    // 头像
    var avBox = $('p-avatar');
    avBox.textContent = '';
    avBox.appendChild(avatarNode(p.avatar_color || post.avatar_color, p.avatar_emoji || post.avatar_emoji, avPath, 'big', post.author_username || post.name));
    document.querySelectorAll('.reply-ava').forEach(function (box) {
      var idx = Array.prototype.indexOf.call(document.querySelectorAll('.reply-ava'), box);
      var r = replies[idx]; if (!r) return;
      var rp = profOf(r) || {};
      box.textContent = '';
      box.appendChild(avatarNode(rp.avatar_color || r.avatar_color, rp.avatar_emoji || r.avatar_emoji,
        rp.avatar_mode === 'image' ? rp.avatar_path : (r.avatar_mode === 'image' ? r.avatar_path : null), 'small',
        r.author_username || r.name));
    });

    bind();
    // 更新页面标题
    document.title = showName + '：' + (post.content || '').slice(0, 20) + '… | 达高中墙Board';
    if (window.__jwSetArticleSEO) window.__jwSetArticleSEO(showName + ' 的帖子', showName, post.content);
  }

  function bind() {
    // 图片放大
    document.querySelectorAll('[data-img]').forEach(function (im) {
      im.onclick = function () {
        if (window.__jwOpenImage) window.__jwOpenImage(im.getAttribute('data-img'), '图片');
        else window.open(im.getAttribute('data-img'), '_blank');
      };
    });
    // 点赞
    var lk = $('p-like');
    if (lk) lk.onclick = function () {
      if (!JW.deviceId) return;
      sb.rpc('like_message', { p_message_id: post.id, p_device_id: JW.deviceId }).then(function (r) {
        if (r.error) throw r.error;
        var o = r.data; if (typeof o === 'string') { try { o = JSON.parse(o); } catch (e) {} }
        if (o) {
          post.like_count = o.like_count;
          myLiked = o.liked;
          lk.textContent = '👍 ' + o.like_count;
          lk.className = 'post-act' + (o.liked ? ' liked' : '');
        }
      }).catch(function (e) { status('点赞失败：' + ((e && e.message) || e), 'err'); });
    };
    // 复制链接
    var sh = $('p-share');
    if (sh) sh.onclick = function () {
      var u = location.origin + location.pathname + '?id=' + postId;
      if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { status('链接已复制 ✅', 'ok'); setTimeout(function(){status('');},1800); });
      else prompt('复制这个链接：', u);
    };
    // 回复
    var send = $('p-reply-send');
    if (send) send.onclick = function () { sendReply(null, null); };
    var inp = $('p-reply-input');
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendReply(null, null); });
    // 回复某条
    document.querySelectorAll('[data-reply-to]').forEach(function (b) {
      b.onclick = function () {
        var rid = b.getAttribute('data-reply-to');
        var rname = b.getAttribute('data-reply-name');
        var box = $('p-reply-input');
        if (!box) { alert('登录后才能回复'); return; }
        box.focus();
        box.placeholder = '回复 ' + rname + '……';
        sendReply(rid, rname);
      };
    });
    // 删回复
    document.querySelectorAll('[data-del-reply]').forEach(function (b) {
      b.onclick = function () { deleteReply(b.getAttribute('data-del-reply')); };
    });
  }

  function sendReply(toId, toName) {
    if (!loggedIn()) { alert('登录后才能回复'); return; }
    var inp = $('p-reply-input');
    var t = inp ? inp.value.trim() : '';
    if (!t) { alert('回复不能为空'); return; }
    var btn = $('p-reply-send');
    if (btn) { btn.disabled = true; btn.textContent = '发送中…'; }
    sb.from('replies').insert({
      message_id: post.id,
      device_id: JW.deviceId,
      name: myName().slice(0, 20),
      content: t.slice(0, 300),
      reply_to_id: toId || null,
      reply_to_name: toName || null,
      author_username: myUsername()
    }).then(function (r) {
      if (r.error) throw r.error;
      if (inp) inp.value = '';
      return load();
    }).catch(function (e) {
      status('回复失败：' + ((e && e.message) || e), 'err');
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = '发送'; }
    });
  }

  function deleteReply(id) {
    var mine = false;
    replies.forEach(function (r) {
      if (r.id === id && r.author_username && myUsername()
          && String(r.author_username).replace(/^@+/, '').toLowerCase() === myUsername().toLowerCase()) mine = true;
    });
    if (!confirm(mine ? '删除自己的这条回复？' : '删除别人的回复？需要管理密码。')) return;
    if (mine) {
      var p0 = pw();
      if (!p0) { status('本机没有登录密码记录', 'err'); return; }
      sha(PW_SALT + '|' + p0).then(function (h) {
        return sb.rpc('delete_own_reply', { p_reply_id: id, p_username: myUsername(), p_pw_hash: h });
      }).then(function (r) {
        if (r.error) throw r.error;
        return load();
      }).catch(function (e) { status('删除失败：' + ((e && e.message) || e), 'err'); });
      return;
    }
    var pwIn = prompt('删除需要管理密码：');
    if (pwIn === null || !pwIn.trim()) return;
    sha(PW_SALT + '|' + pwIn.trim()).then(function (h) {
      return sb.rpc('delete_reply', { p_reply_id: id, p_pw_hash: h });
    }).then(function (r) {
      if (r.error) throw r.error;
      return load();
    }).catch(function (e) { status('删除失败：' + ((e && e.message) || e), 'err'); });
  }

  function showError(msg) {
    $('p-content').innerHTML = '<div class="post-error">'
      + '<b>😕 ' + esc(msg) + '</b>'
      + '<p style="font-size:.84rem;color:var(--muted)">'
      + '<a href="./guestbook.html">← 回发帖区</a></p></div>';
  }

  function boot() {
    postId = new URLSearchParams(location.search).get('id') || '';
    JW.whenReady(function (e) {
      if (e) { showError('连不上服务器：' + ((e && e.message) || e)); return; }
      sb = JW.sb;
      document.querySelectorAll('.post-ava, .post-name, .reply-name, .reply-ava').forEach(function (el) {
        // 资料卡点击由 PROFILE.bind 处理
      });
      if (window.PROFILE) PROFILE.bind($('p-content'));
      load();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
SITE.shell('guestbook');
SITE.footer(document.querySelector('.container'));

</script>
</body>
</html>
