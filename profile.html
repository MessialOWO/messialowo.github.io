var SITE = {

/* 是否已登录 */
SITE.loggedIn = function () {
  try {
    var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
    return !!(a && a.username);
  } catch (e) { return false; }
};
SITE.account = function () {

/* 生成侧边栏 + 顶栏（每个页面只需调用 SITE.shell('key')） */
SITE.shell = function (activeKey) {
  var links = SITE.pages.map(function (p) {
    return '<a href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');

  // 「用户中心」折叠组
  var logged = SITE.loggedIn();
  // 已登录后不再显示「登录 / 注册」
  var userItems = SITE.userPages.filter(function (p) {
    return !(logged && p.key === 'auth');
  });
  var userOpen = userItems.some(function (p) { return p.key === activeKey; })
                 || ['auth','user','user-settings','user-bg'].indexOf(activeKey) >= 0;
  var userLinks = userItems.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');
  links += '<div class="nav-group' + (userOpen ? ' open' : '') + '" id="nav-user">'
    + '<button type="button" class="nav-group-btn' + (userOpen ? ' on' : '') + '" id="nav-user-btn">'
    + (logged && SITE.account() && SITE.account().username
        ? SITE.account().username.replace(/^@/, '') + '<small>已登录</small>'
        : '用户中心<small>Account</small>')
    + '<i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + userLinks + '</div>'
    + '</div>';

  // 「关于」折叠组：关于学校 / 关于本站
  var aboutOpen = SITE.aboutPages.some(function (p) { return p.key === activeKey; });
  var aboutLinks = SITE.aboutPages.map(function (p) {
    var cls = 'sub-link' + (p.faint ? ' sub-link-faint' : '') + (p.key === activeKey ? ' on' : '');
    var small = p.en ? '' : '';
    return '<a class="' + cls + '" href="' + p.href + '">' + p.label + small + '</a>';
  }).join('');
  links += '<div class="nav-group' + (aboutOpen ? ' open' : '') + '" id="nav-about">'
    + '<button type="button" class="nav-group-btn' + (aboutOpen ? ' on' : '') + '" id="nav-about-btn">'
    + '关于<small>About</small><i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + aboutLinks + '</div>'
    + '</div>';

  var bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = '<button id="nav-toggle" aria-label="菜单">☰</button>'
    + '<span class="title">' + SITE.name + '</span>';

  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.id = 'nav-mask';
  mask.hidden = true;

  var aside = document.createElement('aside');
  aside.className = 'sidebar';
  aside.innerHTML =
    '<div class="brand">'
    + '<img src="./img/logo.png" alt="校徽">'
    + '<div class="name">' + SITE.name + '</div>'
    + '<div class="sub">Unofficial</div>'
    + '</div>'
    + '<nav>' + links + '</nav>'
    ;

  document.body.insertBefore(aside, document.body.firstChild);
  document.body.insertBefore(mask, document.body.firstChild);
  document.body.insertBefore(bar, document.body.firstChild);

  var userBtn = aside.querySelector('#nav-user-btn');
  if (userBtn) {
    userBtn.onclick = function () {
      var g = aside.querySelector('#nav-user');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_user_open', open ? '1' : '0'); } catch (e) {}
    };
    if (!userOpen) {
      try {
        if (localStorage.getItem('jw_user_open') === '1') aside.querySelector('#nav-user').classList.add('open');
      } catch (e) {}
    }
  }

  var aboutBtn = aside.querySelector('#nav-about-btn');
  if (aboutBtn) {
    aboutBtn.onclick = function () {
      var g = aside.querySelector('#nav-about');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_about_open', open ? '1' : '0'); } catch (e) {}
    };
    // 记住上次展开状态（只要不是当前页在关于里）
    if (!aboutOpen) {
      try {
        if (localStorage.getItem('jw_about_open') === '1') aside.querySelector('#nav-about').classList.add('open');
      } catch (e) {}
    }
  }

  bar.querySelector('#nav-toggle').onclick = function () {
    document.body.classList.toggle('nav-open');
    mask.hidden = !document.body.classList.contains('nav-open');
  };
  mask.onclick = function () {
    document.body.classList.remove('nav-open');
    mask.hidden = true;
  };
};

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

</script>

  },
  retry: function (fn, times) {
    times = times === undefined ? 2 : times;
    var n = 0;
    var run = function () {
      n++;
      return Promise.resolve().then(fn).catch(function (e) {
        if (n >= times) throw e;
        return new Promise(function (r) { setTimeout(r, 1200); }).then(run);
      });
    };
    return run();
  },
  makeFetch: function () {
    var BASE = JW.url;
    return function (input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      var rel = null;
      try {
        var u = new URL(url, BASE);
        if (u.origin === BASE) rel = u.pathname + u.search;
      } catch (e) {}
      if (!rel || !JW.proxy || !JW.proxy.length) return fetch(input, init);

      /* 文件存储：国内直连 Supabase 会被重置，所以也走中转（Cloudflare 带宽无限） */

      /* ===== 连接策略 =====
         实测：国内直连 Supabase 会被 RST 重置，所以默认直接走中转。
         中转顺序：Cloudflare Pages（额度无限）→ Deno（额度紧张，备用）
         用户可在「用户中心 → 连接线路」里改成只连官方（海外网络适用）。
         所有中转都失败时，最后再试直连兜底。 */
      var cleanList = JW.proxy.map(function (x) { return String(x).replace(/\/$/, ''); });

      function viaRelay() {
        if (!cleanList.length) return fetch(url, init);
        function attempt(i) {
          if (i >= cleanList.length) {
            console.warn('所有中转都失败，最后试直连');
            return fetch(url, init);
          }
          var clean = cleanList[i];
          return fetch(clean + rel, init).then(function (res) {
            if (!res || res.status >= 500) throw new Error('中转返回 ' + (res && res.status));
            return res;
          }).catch(function (e) {
            console.warn('中转失败：' + clean, e && e.message);
            return attempt(i + 1);
          });
        }
        return attempt(0);
      }

      // 用户明确选「只连官方」→ 直连
      if (JW.lineMode === 'direct') return fetch(url, init);

      // 默认 / 「只用中转」→ 走中转
      return viaRelay();
    };
  }
};
/* 图片/音视频的公开地址：国内直连 Supabase 会被重置，所以走中转
   （Cloudflare Pages 带宽无限，图片走它不心疼） */
JW.storagePublic = (JW.proxy && JW.proxy.length ? String(JW.proxy[0]).replace(/\/$/, '') : JW.url)
                 + '/storage/v1/object/public/' + JW.bucket + '/';

(function () {
  /* ---- 连接线路：读用户手动选择；不选就是「自动」 ---- */
  try {
    var lm = localStorage.getItem(JW.LINE_KEY);
    if (lm === 'direct' || lm === 'relay') JW.lineMode = lm;
  } catch (e) {}

  JW.setLine = function (mode) {
    JW.lineMode = (mode === 'direct' || mode === 'relay') ? mode : null;
    try {
      if (JW.lineMode) localStorage.setItem(JW.LINE_KEY, JW.lineMode);
      else localStorage.removeItem(JW.LINE_KEY);
    } catch (e) {}
    return JW.lineMode;
  };
  JW.getLine = function () { return JW.lineMode; };
  JW.proxyList = function () { return JW.proxy.slice(); };

  function newDeviceId() {
    if (window.crypto && window.crypto.randomUUID) return 'gb-' + window.crypto.randomUUID();
    return 'gb-' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  JW.deviceId = localStorage.getItem('jiangwan_gb_device') || '';
  if (!JW.deviceId || JW.deviceId.length < 8 || JW.deviceId.length > 64) {
    JW.deviceId = newDeviceId();
    try { localStorage.setItem('jiangwan_gb_device', JW.deviceId); } catch (e) {}
  }
  function boot() {
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
      JW._settle(new Error('云端组件没加载到（vendor/supabase.js）'));
      return;
    }
    try {
      JW.sb = window.supabase.createClient(JW.url, JW.key, {
        auth: { persistSession: true, autoRefreshToken: true },
        global: JW.proxy && JW.proxy.length ? { fetch: JW.makeFetch() } : undefined
      });
    } catch (e) { JW._settle(e); return; }
    JW.sb.auth.getSession().then(function (r) {
      var u = r && r.data && r.data.session && r.data.session.user;
      if (u && u.id) JW.uid = u.id;
      return null;
    }).catch(function () { return null; })
      .then(function () {
        if (JW.uid) return null;
        return JW.retry(function () {
          return JW.withTimeout(JW.sb.auth.signInAnonymously(), JW.timeoutMs, '登录匿名身份');
        }, 2).then(function (res) {
          if (res && res.error) throw new Error(res.error.message || '匿名登录被拒绝');
          if (res && res.data && res.data.user) JW.uid = res.data.user.id || '';
          return null;
        });
      })
      .then(function () { JW._settle(null); })
      .catch(function (e) { JW._settle(e); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var sb = null, target = '', prof = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function storageUrl(p) {
    if (typeof p !== 'string' || !/^[A-Za-z0-9-]{1,64}\/[A-Za-z0-9._-]{1,80}$/.test(p)) return '';
    return (JW.storagePublic || '') + p;
  }
  function fmtDate(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }
  function fmtTime(ts) {
    var d = new Date(ts); if (isNaN(d)) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function account() { try { return JSON.parse(localStorage.getItem('jw_account') || 'null'); } catch (e) { return null; } }
  function myUsername() { var a = account(); return a ? String(a.username).replace(/^@+/, '') : ''; }
  function isSelf() {
    return myUsername() && prof &&
      String(prof.username).replace(/^@+/, '').toLowerCase() === myUsername().toLowerCase();
  }

  function render() {
    var box = $('pf-content');
    if (!prof) {
      box.innerHTML = '<div class="pf-empty"><b style="display:block;font-size:1.05rem;margin-bottom:8px">😕 找不到这个用户</b>'
        + '<a href="./guestbook.html" style="color:var(--accent)">← 回发帖区</a></div>';
      return;
    }
    var coverUrl = prof.cover_path ? storageUrl(prof.cover_path) : '';
    var avUrl = (prof.avatar_mode === 'image' && prof.avatar_path) ? storageUrl(prof.avatar_path) : '';

    var h = '<div class="pf-hero">';
    h += '<div class="pf-cover" ' + (coverUrl ? 'style="background-image:url(' + esc(coverUrl) + ')"' : '')
       + '>' + (coverUrl ? '' : '<div class="pf-cover-empty">没有设置背景图</div>') + '</div>';
    h += '<div class="pf-main">';
    h += '<div class="pf-avatar">'
       + (avUrl ? '<img src="' + esc(avUrl) + '" alt="">' : esc(prof.avatar_emoji || '🙂'))
       + '</div>';
    h += '<div class="pf-name">' + esc(prof.nickname) + '</div>';
    h += '<div class="pf-uid">' + esc(prof.username) + '</div>';
    h += '<div class="pf-bio' + (prof.bio ? '' : ' empty') + '">'
       + esc(prof.bio || '这个人很懒，什么都没写') + '</div>';
    h += '<div class="pf-stats">';
    h += '<div class="pf-stat"><b>' + (prof.post_count || 0) + '</b><span>发帖</span></div>';
    h += '<div class="pf-stat"><b>' + (prof.likes_received || 0) + '</b><span>获赞</span></div>';
    h += '<div class="pf-stat"><b>' + (prof.reply_count || 0) + '</b><span>回复</span></div>';
    h += '<div class="pf-stat"><b>' + (prof.work_count || 0) + '</b><span>作品</span></div>';
    h += '</div>';
    if (isSelf()) {
      h += '<button class="pf-edit" id="pf-edit-btn" type="button">编辑资料</button>';
    }
    h += '</div></div>';

    // 帖子列表
    var posts = prof.recent_posts || [];
    if (typeof posts === 'string') { try { posts = JSON.parse(posts); } catch (e) { posts = []; } }
    h += '<div class="pf-sec-title">' + (isSelf() ? '我发的帖子' : 'TA 发的帖子')
       + (prof.post_count > posts.length ? '（最近 ' + posts.length + ' 条，共 ' + prof.post_count + ' 条）' : '')
       + '</div>';
    if (!posts.length) {
      h += '<div class="pf-empty">还没有发过帖子。</div>';
    } else {
      posts.forEach(function (p) {
        h += '<a class="pf-post" href="./post.html?id=' + encodeURIComponent(p.id) + '">';
        h += '<div class="pf-post-top">';
        h += '<span class="pf-post-tag">' + esc(p.main_section) + '</span>';
        if (p.is_pinned) h += '<span class="pf-post-tag" style="color:var(--accent)">置顶</span>';
        h += '<span class="pf-post-time">' + fmtTime(p.created_at) + '</span>';
        h += '</div>';
        h += '<div class="pf-post-text">' + esc(p.content) + '</div>';
        h += '<div class="pf-post-meta"><span>👍 ' + (p.like_count || 0) + '</span>'
           + '<span>💬 ' + (p.reply_count || 0) + '</span></div>';
        h += '</a>';
      });
    }
    box.innerHTML = h;

    var eb = $('pf-edit-btn');
    if (eb) eb.onclick = function () { location.href = './user.html#settings'; };

    document.title = prof.nickname + '（' + prof.username + '）| 达高中墙Board';
  }

  function load() {
    target = new URLSearchParams(location.search).get('u') || '';
    if (!target) { target = myUsername(); }
    if (!target) {
      $('pf-content').innerHTML = '<div class="pf-empty">没有指定用户。'
        + '<br><a href="./guestbook.html" style="color:var(--accent)">← 回发帖区</a></div>';
      return;
    }
    sb.rpc('get_profile', { p_username: target }).then(function (r) {
      if (r.error) throw r.error;
      prof = r.data;
      if (typeof prof === 'string') { try { prof = JSON.parse(prof); } catch (e) { prof = null; } }
      render();
    }).catch(function (e) {
      $('pf-content').innerHTML = '<div class="pf-empty">加载失败：' + esc((e && e.message) || e) + '</div>';
    });
  }

  function boot() {
    JW.whenReady(function (e) {
      if (e) { $('pf-content').innerHTML = '<div class="pf-empty">连不上服务器：' + esc((e && e.message) || e) + '</div>'; return; }
      sb = JW.sb;
      load();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
SITE.shell('user');
SITE.footer(document.querySelector('.container'));

</script>
