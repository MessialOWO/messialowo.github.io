<title>登录 / 注册 | 达高中墙Board</title>
<style>

  .au-tab {
    flex:1; padding:11px; text-align:center; cursor:pointer;
    border:1px solid var(--glass-brd); border-radius:10px;
    background:rgba(255,255,255,.55); color:var(--muted);
    font-family:inherit; font-size:.92rem; transition:all .16s;

  .au-label { display:block; font-size:.84rem; color:var(--muted); margin-bottom:6px; }
  .au-input {

  .au-input:focus { outline:none; border-color:rgba(192,57,43,.55); box-shadow:0 0 0 3px rgba(192,57,43,.12); }
  .au-hint { font-size:.76rem; color:var(--muted); margin-bottom:16px; min-height:1.2em; line-height:1.5; }

  .au-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .au-row .au-at-prefix {
    flex-shrink:0; font-size:1rem; color:var(--accent);
    padding:11px 0 11px 13px; margin-right:-13px; z-index:1;
  }
  .au-row .au-input { padding-left:26px; }

    font-size:.78rem; color:var(--muted); line-height:1.9;

<div class="page-head">

  <p>用户名只能用英文，密码可以不填（默认 123456），之后随时能改。</p>
</div>

<div class="status" id="au-status" hidden></div>

  <div style="font-size:.85rem;color:var(--muted);margin-bottom:6px">你已登录</div>
  <div id="au-logged-name" style="font-size:1.1rem;font-weight:700;margin-bottom:14px"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn-main" id="au-go" type="button">进入账户设置</button>
    <button class="btn-ghost" id="au-logout" type="button">退出登录</button>
  </div>
</div>

  <button class="au-tab on" data-tab="login" type="button">登录</button>
  <button class="au-tab" data-tab="register" type="button">注册</button>

<!-- 登录 -->

    <label class="au-label">用户名</label>
    <div class="au-row">
      <span class="au-at-prefix">@</span>
      <input class="au-input" type="text" id="lg-user" placeholder="英文用户名" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>
    <div class="au-hint" id="lg-user-hint"></div>
    <label class="au-label">密码</label>
    <input class="au-input" type="password" id="lg-pass" placeholder="密码" autocomplete="current-password">

    <button class="btn-main" id="lg-btn" type="button" style="width:100%">登录</button>
  </div>
</div>

      用户名规则：<b>以英文字母开头</b>，只能用<b>英文字母、数字、下划线</b>，长度 <b>3~20</b> 个字符。<br>
      前面会自动加 <b>@</b>，注册后它就是你的账户名。

    <label class="au-label">用户名</label>

      <span class="au-at-prefix">@</span>

    <button class="btn-main" id="rg-btn" type="button" style="width:100%">注册</button>

var SITE = {
  name: '达高中墙Board',

  pages: [

    { href: './journal.html',      label: '期刊投稿',   en: 'Journal',   key: 'journal' }
  ],
  /* 「用户中心」折叠组 */

    { href: './auth.html',          label: '登录 / 注册', en: 'Sign in',  key: 'auth' },

/* 是否已登录 */
SITE.loggedIn = function () {
  try {
    var a = JSON.parse(localStorage.getItem('jw_account') || 'null');
    return !!(a && a.username);
  } catch (e) { return false; }
};
SITE.account = function () {
  try { return JSON.parse(localStorage.getItem('jw_account') || 'null'); } catch (e) { return null; }
};

/* 生成侧边栏 + 顶栏（每个页面只需调用 SITE.shell('key')） */
SITE.shell = function (activeKey) {
  var links = SITE.pages.map(function (p) {
    return '<a href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');

  // 「用户中心」折叠组
  var logged = SITE.loggedIn();
  // 已登录后不再显示「登录 / 注册」
  var userItems = SITE.userPages.filter(function (p) {
    return !(logged && p.key === 'auth');
  });
  var userOpen = userItems.some(function (p) { return p.key === activeKey; })
                 || ['auth','user','user-settings','user-bg'].indexOf(activeKey) >= 0;
  var userLinks = userItems.map(function (p) {
    return '<a class="sub-link" href="' + p.href + '"' + (p.key === activeKey ? ' class="on"' : '') + '>'
      + p.label + '<small>' + p.en + '</small></a>';
  }).join('');
  links += '<div class="nav-group' + (userOpen ? ' open' : '') + '" id="nav-user">'
    + '<button type="button" class="nav-group-btn' + (userOpen ? ' on' : '') + '" id="nav-user-btn">'
    + (logged && SITE.account() && SITE.account().username
        ? SITE.account().username.replace(/^@/, '') + '<small>已登录</small>'
        : '用户中心<small>Account</small>')
    + '<i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + userLinks + '</div>'
    + '</div>';

  // 「关于」折叠组：关于学校 / 关于本站
  var aboutOpen = SITE.aboutPages.some(function (p) { return p.key === activeKey; });
  var aboutLinks = SITE.aboutPages.map(function (p) {
    var cls = 'sub-link' + (p.faint ? ' sub-link-faint' : '') + (p.key === activeKey ? ' on' : '');
    var small = p.en ? '' : '';
    return '<a class="' + cls + '" href="' + p.href + '">' + p.label + small + '</a>';
  }).join('');
  links += '<div class="nav-group' + (aboutOpen ? ' open' : '') + '" id="nav-about">'
    + '<button type="button" class="nav-group-btn' + (aboutOpen ? ' on' : '') + '" id="nav-about-btn">'
    + '关于<small>About</small><i class="caret">▾</i></button>'
    + '<div class="nav-group-body">' + aboutLinks + '</div>'
    + '</div>';

  var bar = document.createElement('div');
  bar.className = 'topbar';
  bar.innerHTML = '<button id="nav-toggle" aria-label="菜单">☰</button>'
    + '<span class="title">' + SITE.name + '</span>';

  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.id = 'nav-mask';
  mask.hidden = true;

  var aside = document.createElement('aside');
  aside.className = 'sidebar';
  aside.innerHTML =
    '<div class="brand">'
    + '<img src="./img/logo.png" alt="校徽">'
    + '<div class="name">' + SITE.name + '</div>'
    + '<div class="sub">Unofficial</div>'
    + '</div>'
    + '<nav>' + links + '</nav>'
    ;

  document.body.insertBefore(aside, document.body.firstChild);
  document.body.insertBefore(mask, document.body.firstChild);
  document.body.insertBefore(bar, document.body.firstChild);

  var userBtn = aside.querySelector('#nav-user-btn');
  if (userBtn) {
    userBtn.onclick = function () {
      var g = aside.querySelector('#nav-user');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_user_open', open ? '1' : '0'); } catch (e) {}
    };
    if (!userOpen) {
      try {
        if (localStorage.getItem('jw_user_open') === '1') aside.querySelector('#nav-user').classList.add('open');
      } catch (e) {}
    }
  }

  var aboutBtn = aside.querySelector('#nav-about-btn');
  if (aboutBtn) {
    aboutBtn.onclick = function () {
      var g = aside.querySelector('#nav-about');
      var open = g.classList.toggle('open');
      try { localStorage.setItem('jw_about_open', open ? '1' : '0'); } catch (e) {}
    };
    // 记住上次展开状态（只要不是当前页在关于里）
    if (!aboutOpen) {
      try {
        if (localStorage.getItem('jw_about_open') === '1') aside.querySelector('#nav-about').classList.add('open');
      } catch (e) {}
    }
  }

  bar.querySelector('#nav-toggle').onclick = function () {
    document.body.classList.toggle('nav-open');
    mask.hidden = !document.body.classList.contains('nav-open');
  };
  mask.onclick = function () {
    document.body.classList.remove('nav-open');
    mask.hidden = true;
  };
};

/* ==========================================================================
   自定义背景（只存本地 localStorage，不上传、不入库）
   jw_bg_src : 压缩后的原图 dataURL（最长边 1600px，JPEG）
   jw_bg_cfg : { dim: 0~80 暗度, blur: 0~24 模糊 }
   做法：用 canvas 预先把图模糊掉再当背景，避免实时 filter 拖慢滚动。
   ========================================================================== */
SITE.BG = (function () {
  var SRC_KEY = 'jw_bg_src', CFG_KEY = 'jw_bg_cfg';
  var _blurCache = { key: '', url: '' };

  function readCfg() {
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (!c) return { dim: 35, blur: 6 };
      return {
        dim: Math.max(0, Math.min(80, +c.dim || 0)),
        blur: Math.max(0, Math.min(24, +c.blur || 0))
      };
    } catch (e) { return { dim: 35, blur: 6 }; }
  }
  function readSrc() {
    try { return localStorage.getItem(SRC_KEY) || ''; } catch (e) { return ''; }
  }
  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  function saveSrc(dataUrl) {
    try { localStorage.setItem(SRC_KEY, dataUrl); return true; }
    catch (e) { return false; }   // 超出配额
  }

  /* 把图压缩到最长边 max 像素 */
  function compress(file, max, quality) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(im, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality || 0.82));
      };
      im.onerror = function () { rej(new Error('图片打不开（HEIC 请先转 JPG）')); };
      var fr = new FileReader();
      fr.onload = function () { im.src = fr.result; };
      fr.onerror = function () { rej(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }

  /* 生成模糊后的背景图（缩到 900px 再模糊，够用且快） */
  function blurImage(dataUrl, px) {
    return new Promise(function (res, rej) {
      if (!px || px < 0.5) return res(dataUrl);
      var im = new Image();
      im.onload = function () {
        var max = 900;
        var sc = Math.min(1, max / Math.max(im.width, im.height));
        var w = Math.max(1, Math.round(im.width * sc));
        var h = Math.max(1, Math.round(im.height * sc));
        var pad = Math.ceil(px * 3);            // 留出模糊需要的边，避免四边发白
        var cv = document.createElement('canvas');
        cv.width = w + pad * 2; cv.height = h + pad * 2;
        var cx = cv.getContext('2d');
        try { cx.filter = 'blur(' + px + 'px)'; } catch (e) {}
        cx.drawImage(im, pad, pad, w, h);
        // 裁掉留边，回到正常比例
        var out = document.createElement('canvas');
        out.width = w; out.height = h;
        out.getContext('2d').drawImage(cv, -pad, -pad);
        res(out.toDataURL('image/jpeg', 0.78));
      };
      im.onerror = function () { rej(new Error('处理失败')); };
      im.src = dataUrl;
    });
  }

  /* 把配置应用到页面 */
  function apply(src, cfg) {
    var body = document.body;
    if (!body) return;
    if (!src) {
      // 恢复默认背景
      body.style.backgroundImage = '';
      body.style.backgroundSize = '';
      body.style.backgroundPosition = '';
      body.style.backgroundAttachment = '';
      body.style.backgroundRepeat = '';
      body.style.backgroundColor = '';
      body.classList.remove('has-custom-bg');
      return;
    }
    var url;
    var key = src.slice(-48) + '|' + cfg.blur;
    if (_blurCache.key === key && _blurCache.url) {
      url = _blurCache.url;
    } else {
      url = src;   // 先立即用原图顶上，避免白屏
      blurImage(src, cfg.blur).then(function (u) {
        _blurCache = { key: key, url: u };
        paint(body, u, cfg);
      }).catch(function () {});
    }
    paint(body, url, cfg);
    body.classList.add('has-custom-bg');
  }

  function paint(body, url, cfg) {
    var d = (cfg.dim / 100).toFixed(3);
    body.style.backgroundColor = '#f6f4ef';
    body.style.backgroundImage =
      'linear-gradient(rgba(0,0,0,' + d + '), rgba(0,0,0,' + d + ')), url("' + url + '")';
    body.style.backgroundSize = 'auto, cover';
    body.style.backgroundPosition = '0 0, center center';
    body.style.backgroundAttachment = 'scroll, fixed';
    body.style.backgroundRepeat = 'repeat, no-repeat';
  }

  /* 启动时立即应用（脚本在 body 末尾，此时 body 已存在） */
  function boot() {
    var src = readSrc(), cfg = readCfg();
    if (!src) return;
    // 大图先测体积，超配额就放弃
    apply(src, cfg);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  return {
    getSrc: readSrc,
    getCfg: readCfg,
    saveCfg: saveCfg,
    saveSrc: saveSrc,
    compress: compress,
    apply: function () { apply(readSrc(), readCfg()); },
    preview: function (src, cfg) { apply(src || readSrc(), cfg || readCfg()); },
    clear: function () {
      try { localStorage.removeItem(SRC_KEY); localStorage.removeItem(CFG_KEY); } catch (e) {}
      apply('', {});
    }
  };
})();

</script>
<script>
/* ===== 班级期刊 · 云端连接（所有页面共用） ===== */
var JW = {
  url: 'https://wvqrnkgjwnlhjhfuonts.supabase.co',
  key: 'sb_publishable_cGy9MFHh3-t2i0kEnbHeeg_A1-rUMaF',
  bucket: 'avatars',
  timeoutMs: 10000,
  /* 中转线路列表（按顺序尝试）
     ⚠ 国内直连 Supabase 会被重置，所以实际全靠中转。
     Cloudflare Pages 额度无限，放第一位；Deno 额度紧张，只作备用。 */
  proxy: [
    'https://jw-relay.pages.dev',
    'https://arid-bluejay-4932.messialowo.deno.net'
  ],
  /* 中转健康状态：连续失败就暂时跳过，直接连主库，避免每次白等超时 */
  _proxyFail: {}, _proxySkipUntil: 0,
  _directOK: null, _directFailCount: 0, _directSkipUntil: 0,
  /* 用户手动选择：'direct' 只直连 / 'relay' 走中转 / null 未选（先试直连） */
  lineMode: null, _asking: false,      // null=默认(直连优先+5秒询问) / 'direct' / 'relay'
  LINE_KEY: 'jw_line_mode',
  sb: null, uid: '', deviceId: '', ready: false, error: null, _waiters: [],
  whenReady: function (cb) { if (JW.ready) cb(JW.error); else JW._waiters.push(cb); },
  _settle: function (err) {
    JW.error = err || null; JW.ready = true;
    JW._waiters.splice(0).forEach(function (cb) { try { cb(JW.error); } catch (e) { console.error(e); } });
    try { document.dispatchEvent(new Event('jw:ready')); } catch (e) {}
  },
  withTimeout: function (p, ms, what) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (done) return; done = true;
        reject(new Error('连接超时：' + (what || '请求') + '（' + Math.round(ms / 1000) + ' 秒无响应）'));
      }, ms);
      Promise.resolve(p).then(function (v) { if (done) return; done = true; clearTimeout(t); resolve(v); },
        function (e) { if (done) return; done = true; clearTimeout(t); reject(e); });
    });
  },
  retry: function (fn, times) {
    times = times === undefined ? 2 : times;
    var n = 0;
    var run = function () {
      n++;
      return Promise.resolve().then(fn).catch(function (e) {
        if (n >= times) throw e;
        return new Promise(function (r) { setTimeout(r, 1200); }).then(run);
      });
    };
    return run();
  },
  makeFetch: function () {
    var BASE = JW.url;
    return function (input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      var rel = null;
      try {
        var u = new URL(url, BASE);
        if (u.origin === BASE) rel = u.pathname + u.search;
      } catch (e) {}
      if (!rel || !JW.proxy || !JW.proxy.length) return fetch(input, init);

      /* 文件存储：国内直连 Supabase 会被重置，所以也走中转（Cloudflare 带宽无限） */

      /* ===== 连接策略 =====
         实测：国内直连 Supabase 会被 RST 重置，所以默认直接走中转。
         中转顺序：Cloudflare Pages（额度无限）→ Deno（额度紧张，备用）
         用户可在「用户中心 → 连接线路」里改成只连官方（海外网络适用）。
         所有中转都失败时，最后再试直连兜底。 */
      var cleanList = JW.proxy.map(function (x) { return String(x).replace(/\/$/, ''); });

      function viaRelay() {
        if (!cleanList.length) return fetch(url, init);
        function attempt(i) {
          if (i >= cleanList.length) {
            console.warn('所有中转都失败，最后试直连');
            return fetch(url, init);
          }
          var clean = cleanList[i];
          return fetch(clean + rel, init).then(function (res) {
            if (!res || res.status >= 500) throw new Error('中转返回 ' + (res && res.status));
            return res;
          }).catch(function (e) {
            console.warn('中转失败：' + clean, e && e.message);
            return attempt(i + 1);
          });
        }
        return attempt(0);
      }

      // 用户明确选「只连官方」→ 直连
      if (JW.lineMode === 'direct') return fetch(url, init);

      // 默认 / 「只用中转」→ 走中转
      return viaRelay();
    };
  }
};
/* 图片/音视频的公开地址：国内直连 Supabase 会被重置，所以走中转
   （Cloudflare Pages 带宽无限，图片走它不心疼） */
JW.storagePublic = (JW.proxy && JW.proxy.length ? String(JW.proxy[0]).replace(/\/$/, '') : JW.url)
                 + '/storage/v1/object/public/' + JW.bucket + '/';

(function () {
  /* ---- 连接线路：读用户手动选择；不选就是「自动」 ---- */
  try {
    var lm = localStorage.getItem(JW.LINE_KEY);
    if (lm === 'direct' || lm === 'relay') JW.lineMode = lm;
  } catch (e) {}

  JW.setLine = function (mode) {
    JW.lineMode = (mode === 'direct' || mode === 'relay') ? mode : null;
    try {
      if (JW.lineMode) localStorage.setItem(JW.LINE_KEY, JW.lineMode);
      else localStorage.removeItem(JW.LINE_KEY);
    } catch (e) {}
    return JW.lineMode;
  };
  JW.getLine = function () { return JW.lineMode; };
  JW.proxyList = function () { return JW.proxy.slice(); };

  function newDeviceId() {
    if (window.crypto && window.crypto.randomUUID) return 'gb-' + window.crypto.randomUUID();
    return 'gb-' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  JW.deviceId = localStorage.getItem('jiangwan_gb_device') || '';
  if (!JW.deviceId || JW.deviceId.length < 8 || JW.deviceId.length > 64) {
    JW.deviceId = newDeviceId();
    try { localStorage.setItem('jiangwan_gb_device', JW.deviceId); } catch (e) {}
  }
  function boot() {
    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
      JW._settle(new Error('云端组件没加载到（vendor/supabase.js）'));
      return;
    }
    try {
      JW.sb = window.supabase.createClient(JW.url, JW.key, {
        auth: { persistSession: true, autoRefreshToken: true },
        global: JW.proxy && JW.proxy.length ? { fetch: JW.makeFetch() } : undefined
      });
    } catch (e) { JW._settle(e); return; }
    JW.sb.auth.getSession().then(function (r) {
      var u = r && r.data && r.data.session && r.data.session.user;
      if (u && u.id) JW.uid = u.id;
      return null;
    }).catch(function () { return null; })
      .then(function () {
        if (JW.uid) return null;
        return JW.retry(function () {
          return JW.withTimeout(JW.sb.auth.signInAnonymously(), JW.timeoutMs, '登录匿名身份');
        }, 2).then(function (res) {
          if (res && res.error) throw new Error(res.error.message || '匿名登录被拒绝');
          if (res && res.data && res.data.user) JW.uid = res.data.user.id || '';
          return null;
        });
      })
      .then(function () { JW._settle(null); })
      .catch(function (e) { JW._settle(e); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>

/* ===== 登录 / 注册 ===== */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ACC_KEY = 'jw_account';       // {username, nickname, avatarMode, avatarPath, avatarColor, avatarEmoji}
  var PW_KEY  = 'jw_account_pw';    // 登录态用的密码（本机保存，用于改资料/看消息）

  /* 密码哈希：sha256('jw-salt-2026|密码')，与管理员密码同一套规则 */
  var PW_SALT = 'jw-salt-2026';
  function hashPw(pw) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(PW_SALT + '|' + pw))
        .then(function (b) {
          return Array.prototype.map.call(new Uint8Array(b), function (x) {
            return ('0' + x.toString(16)).slice(-2);
          }).join('');
        });
    }
    return Promise.reject(new Error('当前环境不支持加密（请用 https 打开）'));
  }

  function status(t, kind) {
    var el = $('au-status');
    if (!el) return;
    if (!t) { el.hidden = true; el.textContent = ''; return; }
    el.hidden = false; el.className = 'status' + (kind ? ' ' + kind : ''); el.textContent = t;
  }

  /* 用户名规则（与数据库完全一致）：3~20 位，字母开头，只含字母数字下划线 */
  function checkUser(v) {
    v = (v || '').replace(/^@+/, '').trim();
    if (!v) return { ok: false, msg: '请填用户名' };
    if (v.length < 3) return { ok: false, msg: '至少 3 个字符' };
    if (v.length > 20) return { ok: false, msg: '最多 20 个字符' };
    if (!/^[A-Za-z]/.test(v)) return { ok: false, msg: '必须以英文字母开头' };
    if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(v)) return { ok: false, msg: '只能用英文字母、数字、下划线' };
    return { ok: true, msg: '可以用', value: v };
  }

  function hint(el, text, ok) {
    if (!el) return;
    el.textContent = text || '';
    el.style.color = ok ? '#27ae60' : (text ? '#c0392b' : '#6b6b6b');
  }

  function saveLogin(data, password) {
    try {
      localStorage.setItem(ACC_KEY, JSON.stringify({
        username: data.username, nickname: data.nickname || '',
        avatarMode: data.avatar_mode || 'emoji',
        avatarPath: data.avatar_path || '',
        avatarColor: data.avatar_color || '#c0392b',
        avatarEmoji: data.avatar_emoji || '🙂'
      }));
      localStorage.setItem(PW_KEY, password);
      // 兼容旧逻辑：留言/发作品读的是这两个键
      localStorage.setItem('jiangwan_gb_name', data.nickname || data.username.replace(/^@/, ''));
      localStorage.setItem('jiangwan_gb_look', JSON.stringify({
        mode: data.avatar_mode || 'emoji',
        emoji: data.avatar_emoji || '🙂',
        color: data.avatar_color || '#c0392b',
        image: '', imagePath: data.avatar_path || ''
      }));
    } catch (e) {}
  }

  function goNext() {
    var back = new URLSearchParams(location.search).get('next');
    location.href = back ? decodeURIComponent(back) : './user.html';
  }

  function bindTabs() {
    var tabs = document.querySelectorAll('.au-tab');
    Array.prototype.forEach.call(tabs, function (t) {
      t.onclick = function () {
        Array.prototype.forEach.call(tabs, function (x) { x.classList.remove('on'); });
        t.classList.add('on');
        var isLogin = t.dataset.tab === 'login';
        $('au-login').hidden = !isLogin;
        $('au-register').hidden = isLogin;
        status('');
      };
    });
  }

  /* ---- 注册 ---- */
  function doRegister() {
    var u = $('rg-user').value;
    var chk = checkUser(u);
    if (!chk.ok) { hint($('rg-user-hint'), chk.msg, false); $('rg-user').focus(); return; }
    var pw = $('rg-pass').value.trim();
    if (pw && pw.length < 6) { hint($('rg-pass-hint'), '密码至少 6 位（不填则默认 123456）', false); return; }
    var btn = $('rg-btn');
    btn.disabled = true; btn.textContent = '注册中…';
    status('正在注册……');
    var realPw = pw || '123456';
    hashPw(realPw).then(function (h) {
      return JW.sb.rpc('register_account', {
        p_username: chk.value, p_pw_hash: h, p_device: JW.deviceId
      }).then(function (r) { return { r: r, pw: realPw }; });
    }).then(function (o) {
      var r = o.r;
      if (r.error) throw r.error;
      var d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
      saveLogin(d, o.pw);
      status('注册成功，正在进入……', 'ok');
      setTimeout(goNext, 600);
    }).catch(function (e) {
      var m = (e && e.message) || String(e);
      status(/username taken/i.test(m) ? '这个用户名已经有人用了。'
        : (/bad username/i.test(m) ? '用户名不符合规则。' : ('注册失败：' + m)), 'err');
    }).then(function () { btn.disabled = false; btn.textContent = '注册'; });
  }

  /* ---- 登录 ---- */
  function doLogin() {
    var chk = checkUser($('lg-user').value);
    if (!chk.ok) { hint($('lg-user-hint'), chk.msg, false); return; }
    var pw = $('lg-pass').value;
    if (!pw) { hint($('lg-pass-hint'), '请填密码', false); return; }
    var btn = $('lg-btn');
    btn.disabled = true; btn.textContent = '登录中…';
    status('正在登录……');
    hashPw(pw).then(function (h) {
      return JW.sb.rpc('login_account', {
        p_username: chk.value, p_pw_hash: h, p_device: JW.deviceId
      });
    }).then(function (r) {
      if (r.error) throw r.error;
      var d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
      saveLogin(d, pw);
      status('登录成功，正在进入……', 'ok');
      setTimeout(goNext, 500);
    }).catch(function (e) {
      var m = (e && e.message) || String(e);
      status(/no such account/i.test(m) ? '没有这个用户，先去注册吧。'
        : (/bad password/i.test(m) ? '密码不对。' : ('登录失败：' + m)), 'err');
    }).then(function () { btn.disabled = false; btn.textContent = '登录'; });
  }

  function boot() {
    bindTabs();
    // 已登录就直接跳走
    var acc = null;
    try { acc = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); } catch (e) {}
    if (acc && acc.username) {
      var box = $('au-logged');
      var info = $('au-logged-name');
      if (box) box.hidden = false;
      if (info) info.textContent = acc.username + (acc.nickname ? '（' + acc.nickname + '）' : '');
      var go = $('au-go');
      if (go) go.onclick = goNext;
      var out = $('au-logout');
      if (out) out.onclick = function () {
        try { localStorage.removeItem(ACC_KEY); localStorage.removeItem(PW_KEY); } catch (e) {}
        location.reload();
      };
    }

    var takenTimer = null;
    $('rg-user').oninput = function () {
      this.value = this.value.replace(/[^A-Za-z0-9_@]/g, '');
      if (this.value.charAt(0) === '@') this.value = this.value.replace(/^@+/, '');
      var chk = checkUser(this.value);
      hint($('rg-user-hint'), chk.ok ? '检查是否被占用……' : chk.msg, chk.ok);
      if (!chk.ok) return;
      // 实时查重（输入停下 450ms 后查）
      clearTimeout(takenTimer);
      takenTimer = setTimeout(function () {
        JW.sb.rpc('username_taken', { p_username: chk.value }).then(function (r) {
          if (r.error) { hint($('rg-user-hint'), '可以用', true); return; }
          var taken = r.data === true || r.data === 'true';
          hint($('rg-user-hint'), taken ? '这个用户名已经有人用了' : '可以用', !taken);
        }).catch(function () { hint($('rg-user-hint'), '可以用', true); });
      }, 450);
    };
    $('rg-pass').oninput = function () {
      var v = this.value.trim();
      hint($('rg-pass-hint'), v ? (v.length < 6 ? '密码至少 6 位' : '可以') : '不填则默认 123456', !v || v.length >= 6);
    };
    $('rg-btn').onclick = doRegister;
    $('lg-btn').onclick = doLogin;
    $('lg-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    $('rg-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doRegister(); });

    JW.whenReady(function (e) {
      if (e) status('连不上服务器，暂时没法登录注册：' + (e.message || e), 'err');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
SITE.shell('auth');
SITE.footer(document.querySelector('.container'));

</script>
